del integrating SSA and CNN-Transformer",authors:"Bochao Chen; Wansheng Yang; Biao Yan; Keren Zhang",journal:"Energy and Buildings",year:2024,volume:"309",issue:"",pages:"114000",doi:"10.1016/j.enbuild.2024.114000",doiUrl:"https://doi.org/10.1016/j.enbuild.2024.114000",citations:38,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"",abstractKind:"unavailable",abstractSource:"",abstractUrl:"",abstractLicense:"",keywords:[],sections:["2.3"],originalCitation:"Chen B, Yang W, Yan B, Zhang K. An advanced airport terminal cooling load forecasting model integrating SSA and CNN-Transformer. Energy and Buildings. 2024;309:114000.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.enbuild.2024.114000",note:"",isRetracted:!1},{id:"ref-48",number:48,numbers:[48],type:"journal-article",title:"Prediction of functional zones cooling load for shopping mall using dual attention based LSTM: A case study",authors:"Anjun Zhao; Yu Zhang; Yuping Zhang; Hangjie Yang; Yingxi Zhang",journal:"International Journal of Refrigeration",year:2022,volume:"144",issue:"",pages:"211-221",doi:"10.1016/j.ijrefrig.2022.07.020",doiUrl:"https://doi.org/10.1016/j.ijrefrig.2022.07.020",citations:38,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"",abstractKind:"unavailable",abstractSource:"",abstractUrl:"",abstractLicense:"",keywords:[],sections:["2.3"],originalCitation:"Zhao A, Zhang Y, Zhang Y, Yang H, Zhang Y. Prediction of functional zones cooling load for shopping mall using dual attention based LSTM: A case study. International Journal of Refrigeration. 2022;144:211-21.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.ijrefrig.2022.07.020",note:"",isRetracted:!1},{id:"ref-49",number:49,numbers:[49],type:"journal-article",title:"A physics-constrained deep learning framework for dynamic modeling of vapor compression systems",authors:"Jiacheng Ma; Yiyun Dong; Hongtao Qiao; Christopher R. Laughman",journal:"Applied Thermal Engineering",year:2024,volume:"254",issue:"",pages:"123734",doi:"10.1016/j.applthermaleng.2024.123734",doiUrl:"https://doi.org/10.1016/j.applthermaleng.2024.123734",citations:20,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"Data-driven dynamic models typically offer faster execution than their physics-based counterparts described by large systems of nonlinear differential-algebraic equations (DAEs) with quantitatively reasonable accuracy. Therefore, development of such models can be extremely useful for design optimization, controls, fault detection and diagnostics of vapor compression based building Heating, ventilation and air conditioning (HVAC) systems. As the complexity and scale of vapor compression systems (VCS) increase rapidly across the industry, a modular approach of generating and interconnecting data-driven component models enables model reuse and efficient adaption to arbitrary system layouts. Despite the flexibility, the modular integration for system model generation can suffer from nonphysical behaviors of violating conservation laws due to inevitable prediction errors associated with each component. This paper presents a data-driven modeling framework that exploits state-of-the-art deep learning techniques for constructing component models, while enforcing physical conservation for system simulations. A general-purpose system solver is developed to handle arbitrary configurations by automatically integrating data-driven or interchangeable physics-based component models into a system model. Results of an air-source heat pump system reveal a significant speedup with good agreement, compared to high-fidelity first-principles models.",abstractKind:"abstract",abstractSource:"User-provided literature library",abstractUrl:"",abstractLicense:"",keywords:["Transient simulation","Deep learning","Gated recurrent unit","Vapor compression system","Component-based modeling","Physical conservation"],sections:["2.3","3.1","3.1.2","3.1.3","3.2","3.2.1","3.3"],originalCitation:"Ma J, Dong Y, Qiao H, Laughman CR. A physics-constrained deep learning framework for dynamic modeling of vapor compression systems. Applied Thermal Engineering. 2024;254:123734.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.applthermaleng.2024.123734",note:"",isRetracted:!1},{id:"ref-50",number:50,numbers:[50],type:"journal-article",title:"A novel Transformer-based network forecasting method for building cooling loads",authors:"Long Li; Xingyu Su; Xianting Bi; Yueliang Lu; Xuetao Sun",journal:"Energy and Buildings",year:2023,volume:"296",issue:"",pages:"113409",doi:"10.1016/j.enbuild.2023.113409",doiUrl:"https://doi.org/10.1016/j.enbuild.2023.113409",citations:72,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"",abstractKind:"unavailable",abstractSource:"",abstractUrl:"",abstractLicense:"",keywords:[],sections:["2.3"],originalCitation:"Li L, Su X, Bi X, Lu Y, Sun X. A novel Transformer-based network forecasting method for building cooling loads. Energy and Buildings. 2023;296:113409.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.enbuild.2023.113409",note:"",isRetracted:!1},{id:"ref-51",number:51,numbers:[51],type:"journal-article",title:"Transformer based day-ahead cooling load forecasting of hub airport air-conditioning systems with thermal energy storage",authors:"Die Yu; Tong Liu; Kai Wang; Kang Li; Mehmet Mercang\xF6z; Jian Zhao; Yu Lei; RuoFan Zhao",journal:"Energy and Buildings",year:2024,volume:"308",issue:"",pages:"114008",doi:"10.1016/j.enbuild.2024.114008",doiUrl:"https://doi.org/10.1016/j.enbuild.2024.114008",citations:33,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"",abstractKind:"unavailable",abstractSource:"",abstractUrl:"",abstractLicense:"",keywords:[],sections:["2.3"],originalCitation:"Yu D, Liu T, Wang K, Li K, Mercang\xF6z M, Zhao J, et al. Transformer based day-ahead cooling load forecasting of hub airport air-conditioning systems with thermal energy storage. Energy and Buildings. 2024;308:114008.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.enbuild.2024.114008",note:"",isRetracted:!1},{id:"ref-52",number:52,numbers:[52],type:"journal-article",title:"Principles, research status, and prospects of feature engineering for data-driven building energy prediction: A comprehensive review",authors:"Zeyu Wang; Lisha Xia; Hongping Yuan; Ravi S. Srinivasan; Xiangnan Song",journal:"Journal of Building Engineering",year:2022,volume:"58",issue:"",pages:"105028",doi:"10.1016/j.jobe.2022.105028",doiUrl:"https://doi.org/10.1016/j.jobe.2022.105028",citations:72,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"",abstractKind:"unavailable",abstractSource:"",abstractUrl:"",abstractLicense:"",keywords:[],sections:["2.4.1"],originalCitation:"Wang Z, Xia L, Yuan H, Srinivasan RS, Song X. Principles, research status, and prospects of feature engineering for data-driven building energy prediction: A comprehensive review. Journal of Building Engineering. 2022;58:105028.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.jobe.2022.105028",note:"",isRetracted:!1},{id:"ref-53",number:53,numbers:[53],type:"journal-article",title:"Energy modelling and control of building heating and cooling systems with data-driven and hybrid models\u2014A review",authors:"Yasaman Balali; Adrian Chong; Andrew Busch; Steven O\u2019Keefe",journal:"Renewable and Sustainable Energy Reviews",year:2023,volume:"183",issue:"",pages:"113496",doi:"10.1016/j.rser.2023.113496",doiUrl:"https://doi.org/10.1016/j.rser.2023.113496",citations:140,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"Implementing an efficient control strategy for heating, ventilation, and air conditioning (HVAC) systems can lead to improvements in both energy efficiency and thermal performance in buildings. As HVAC systems and buildings are complicated dynamic systems, the effectiveness of both data-driven and model-based control methods has been widely investigated by researchers. However, the main challenges that impede the practical application of model-based methods in real buildings are their reliance on the precision of control-oriented models and the dependence of data-based systems on the quantity and quality of input\u2013output data. The objectives of this study are: (1) To present an overview of the prevalent thermal modelling strategies used as control-oriented models or virtual environments in model-based and data-based control methods, addressing the main requirements of thermal models; (2) the state-of-the-art of MPC and RL control techniques; (3) the data requirements for thermal models. The findings emphasise the need for unified guidelines to validate and verify the proposed control methods, ensuring their practical implementation in real buildings. Moreover, the inclusion of occupancy forecasts in models presents challenges due to the intricate nature of accurately predicting human behaviour, occupancy patterns, and their effects on thermal dynamics. Balancing thermal comfort and energy efficiency in HVAC systems with a supervisory controller remains a difficult task, but combining data-driven and physics-based models can help overcome challenges. Further research is needed to compare the effectiveness of MPC and RL approaches, and accurately measuring the impact of human behaviour and occupancy remains a significant obstacle.",abstractKind:"abstract",abstractSource:"Open-license abstract",abstractUrl:"https://api.openalex.org/works/W4383213297",abstractLicense:"http://creativecommons.org/licenses/by-nc/4.0/",keywords:[],sections:["2.4.1"],originalCitation:"Balali Y, Chong A, Busch A, O'Keefe S. Energy modelling and control of building heating and cooling systems with data-driven and hybrid models\u2014A review. Renewable and Sustainable Energy Reviews. 2023;183:113496.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.rser.2023.113496",note:"",isRetracted:!1},{id:"ref-54",number:54,numbers:[54],type:"journal-article",title:"Review of modeling methods for HVAC systems",authors:"Abdul Afram; Farrokh Janabi-Sharifi",journal:"Applied Thermal Engineering",year:2014,volume:"67",issue:"1-2",pages:"507-519",doi:"10.1016/j.applthermaleng.2014.03.055",doiUrl:"https://doi.org/10.1016/j.applthermaleng.2014.03.055",citations:476,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"",abstractKind:"unavailable",abstractSource:"",abstractUrl:"",abstractLicense:"",keywords:[],sections:["2.4.1","2.4.2"],originalCitation:"Afram A, Janabi-Sharifi F. Review of modeling methods for HVAC systems. Applied Thermal Engineering. 2014;67(1-2):507-19.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.applthermaleng.2014.03.055",note:"",isRetracted:!1},{id:"ref-55",number:55,numbers:[55],type:"journal-article",title:"Time-series forecasting with deep learning: a survey",authors:"Bryan Lim; Stefan Zohren",journal:"Philosophical Transactions of the Royal Society A: Mathematical, Physical and Engineering Sciences",year:2021,volume:"379",issue:"2194",pages:"20200209",doi:"10.1098/rsta.2020.0209",doiUrl:"https://doi.org/10.1098/rsta.2020.0209",citations:1755,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"This survey organizes deep-learning approaches for time-series prediction by their encoder and decoder structures and by forecast horizon. It explains how temporal information enters predictions, reviews combinations of statistical models and neural networks, and discusses how forecasting architectures can support downstream decisions.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://api.crossref.org/works/10.1098%2Frsta.2020.0209",abstractLicense:"",keywords:[],sections:["2.4.2"],originalCitation:"Lim B, Zohren S. Time-series forecasting with deep learning: a survey. Philosophical Transactions of the Royal Society A: Mathematical, Physical and Engineering Sciences. 2021;379(2194):20200209.",metadataUrl:"https://api.crossref.org/works/10.1098%2Frsta.2020.0209",note:"",isRetracted:!1},{id:"ref-56",number:56,numbers:[56],type:"journal-article",title:"Deep networks for system identification: A survey",authors:"Gianluigi Pillonetto; Aleksandr Aravkin; Daniel Gedon; Lennart Ljung; Ant\xF4nio H. Ribeiro; Thomas B. Sch\xF6n",journal:"Automatica",year:2025,volume:"171",issue:"",pages:"111907",doi:"10.1016/j.automatica.2024.111907",doiUrl:"https://doi.org/10.1016/j.automatica.2024.111907",citations:85,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"Deep learning is a topic of considerable current interest.The availability of massive data collections and powerful software resources has led to an impressive amount of results in many application areas that reveal essential but hidden properties of the observations.System identification learns mathematical descriptions of dynamic systems from input-output data and can thus benefit from the advances of deep neural networks to enrich the possible range of models to choose from.For this reason, we provide a survey of deep learning from a system identification perspective.We cover a wide spectrum of topics to enable researchers to understand the methods, providing rigorous practical and theoretical insights into the benefits and challenges of using them.The main aim of the identified model is to predict new data from previous observations.This can be achieved with different deep learning-based modelling techniques and we discuss architectures commonly adopted in the literature, like feedforward, convolutional, and recurrent networks.Their parameters have to be estimated from past data to optimize the prediction performance.For this purpose, we discuss a specific set of first-order optimization tools that have emerged as efficient.The survey then draws connections to the well-studied area of kernel-based methods.They control the data fit by regularization terms that penalize models not in line with prior assumptions.We illustrate how to cast them in deep architectures to obtain deep kernel-based methods.The success of deep learning also resulted in surprising empirical observations, like the counter-intuitive behaviour of models with many parameters.We discuss the role of overparameterized models, including their connection to kernels, as well as implicit regularization mechanisms which affect generalization, specifically the interesting phenomena of benign overfitting and double-descent.Finally, we highlight numerical, computational and software aspects in the area with the help of applied examples.",abstractKind:"abstract",abstractSource:"Open-license abstract",abstractUrl:"https://api.openalex.org/works/W4402699269",abstractLicense:"http://creativecommons.org/licenses/by/4.0/",keywords:[],sections:["2.4.2"],originalCitation:"Pillonetto G, Aravkin A, Gedon D, Ljung L, Ribeiro AH, Sch\xF6n TB. Deep networks for system identification: A survey. Automatica. 2025;171:111907.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.automatica.2024.111907",note:"",isRetracted:!1},{id:"ref-57",number:57,numbers:[57],type:"journal-article",title:"A survey of regularization strategies for deep models",authors:"Reza Moradi; Reza Berangi; Behrouz Minaei",journal:"Artificial Intelligence Review",year:2020,volume:"53",issue:"6",pages:"3947-3986",doi:"10.1007/s10462-019-09784-7",doiUrl:"https://doi.org/10.1007/s10462-019-09784-7",citations:290,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"",abstractKind:"unavailable",abstractSource:"",abstractUrl:"",abstractLicense:"",keywords:[],sections:["2.4.2"],originalCitation:"Moradi R, Berangi R, Minaei B. A survey of regularization strategies for deep models. Artificial Intelligence Review. 2020;53(6):3947-86.",metadataUrl:"https://api.crossref.org/works/10.1007%2Fs10462-019-09784-7",note:"",isRetracted:!1},{id:"ref-58",number:58,numbers:[58],type:"journal-article",title:"Excitation Signal Design for Generating Optimal Training Data for Complex Dynamic Systems",authors:"Edward Winward; Zhijia Yang; Byron Mason; Mark Cary",journal:"IEEE Access",year:2022,volume:"10",issue:"",pages:"8653-8663",doi:"10.1109/access.2021.3138166",doiUrl:"https://doi.org/10.1109/access.2021.3138166",citations:4,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"The appropriate choice of excitation signal in system identification is an important but rarely considered part of the process that determines the success of many downstream activities. This paper presents a novel methodology for excitation signal design to create high accuracy multivariable nonlinear dynamic neuro-fuzzy models. Two different approaches to experimental design are investigated. In the first, a prescribed transient manoeuvre is used. In the second, informative potential is used to deconstruct the transient into a sequence of inputs designed to cover the same input space and reduce model development time. Star discrepancy is used to evaluate the resulting designs and is shown to provide a good proxy for excitation design quality. Results are presented showing the prediction accuracy of the model in terms of an application example, achieving a minimum < 2% cumulative error over a two minute transient. It is shown that the neuro-fuzzy models identified using data from the two different approaches have similar accuracy. However, the second approach based on informative potential leads to a more generalised model and reduces the development time by a factor of four. This is a significant result that shows the importance of choosing an appropriate excitation signal.",abstractKind:"abstract",abstractSource:"Open-license abstract",abstractUrl:"https://api.openalex.org/works/W4205402153",abstractLicense:"https://creativecommons.org/licenses/by/4.0/legalcode",keywords:[],sections:["2.4.2"],originalCitation:"Winward E, Yang Z, Mason B, Cary M. Excitation Signal Design for Generating Optimal Training Data for Complex Dynamic Systems. IEEE Access. 2022;10:8653-63.",metadataUrl:"https://api.crossref.org/works/10.1109%2Faccess.2021.3138166",note:"",isRetracted:!1},{id:"ref-59",number:59,numbers:[59],type:"journal-article",title:"How to approach Carnot cycle via zeotropic working fluid: Research methodology and case study",authors:"Weicong Xu; Shuai Deng; Wen Su; Ying Zhang; Li Zhao; Zhixin Yu",journal:"Energy",year:2018,volume:"144",issue:"",pages:"576-586",doi:"10.1016/j.energy.2017.12.041",doiUrl:"https://doi.org/10.1016/j.energy.2017.12.041",citations:60,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"",abstractKind:"unavailable",abstractSource:"",abstractUrl:"",abstractLicense:"",keywords:[],sections:["3"],originalCitation:"Xu W, Deng S, Su W, Zhang Y, Zhao L, Yu Z. How to approach Carnot cycle via zeotropic working fluid: Research methodology and case study. Energy. 2018;144:576-86.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.energy.2017.12.041",note:"",isRetracted:!1},{id:"ref-60",number:60,numbers:[60],type:"journal-article",title:"Dynamic modeling of steam power cycles: Part II \u2013 Simulation of a small simple Rankine cycle system",authors:"H. van Putten; P. Colonna",journal:"Applied Thermal Engineering",year:2007,volume:"27",issue:"14-15",pages:"2566-2582",doi:"10.1016/j.applthermaleng.2007.01.035",doiUrl:"https://doi.org/10.1016/j.applthermaleng.2007.01.035",citations:81,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"",abstractKind:"unavailable",abstractSource:"",abstractUrl:"",abstractLicense:"",keywords:[],sections:["3"],originalCitation:"Van Putten H, Colonna P. Dynamic modeling of steam power cycles: Part II\u2013Simulation of a small simple Rankine cycle system. Applied Thermal Engineering. 2007;27(14-15):2566-82.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.applthermaleng.2007.01.035",note:"",isRetracted:!1},{id:"ref-61",number:61,numbers:[61],type:"journal-article",title:"On the dynamic modeling of Brayton cycle power conversion systems with the CATHARE-3 code",authors:"Gedeon Mauger; Nicolas Tauveron; Fabrice Bentivoglio; Alain Ruby",journal:"Energy",year:2019,volume:"168",issue:"",pages:"1002-1016",doi:"10.1016/j.energy.2018.11.063",doiUrl:"https://doi.org/10.1016/j.energy.2018.11.063",citations:28,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"The CATHARE-3 simulation framework is extended for transient analysis of high-pressure, closed nitrogen Brayton cycles. The extensions account for real-gas properties, high-Reynolds-number pressure losses, turbomachinery behavior, and choking. Validation and accident calculations demonstrate why ideal-gas assumptions can misrepresent heat transfer, pressure losses, and compressor operating limits.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.semanticscholar.org/paper/55839faaecffbaad906a28e90c2ffb80de282c8f",abstractLicense:"",keywords:[],sections:["3"],originalCitation:"Mauger G, Tauveron N, Bentivoglio F, Ruby A. On the dynamic modeling of Brayton cycle power conversion systems with the CATHARE-3 code. Energy. 2019;168:1002-16.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.energy.2018.11.063",note:"",isRetracted:!1},{id:"ref-62",number:62,numbers:[62],type:"journal-article",title:"Thermodynamic model and optimization of a multi-step irreversible Brayton cycle",authors:"S. S\xE1nchez-Orgaz; A. Medina; A. Calvo Hern\xE1ndez",journal:"Energy Conversion and Management",year:2010,volume:"51",issue:"11",pages:"2134-2143",doi:"10.1016/j.enconman.2010.03.006",doiUrl:"https://doi.org/10.1016/j.enconman.2010.03.006",citations:42,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"",abstractKind:"unavailable",abstractSource:"",abstractUrl:"",abstractLicense:"",keywords:[],sections:["3"],originalCitation:"S\xE1nchez-Orgaz S, Medina A, Hern\xE1ndez AC. Thermodynamic model and optimization of a multi-step irreversible Brayton cycle. Energy Conversion and Management. 2010;51(11):2134-43.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.enconman.2010.03.006",note:"",isRetracted:!1},{id:"ref-63",number:63,numbers:[63],type:"journal-article",title:"A thermodynamic analysis of the Linde-Hampson cycle using low-GWP R1234yf-blends",authors:"Yanbin Qin; Nanxi Li; Hua Zhang; Baolin Liu",journal:"Case Studies in Thermal Engineering",year:2023,volume:"49",issue:"",pages:"103358",doi:"10.1016/j.csite.2023.103358",doiUrl:"https://doi.org/10.1016/j.csite.2023.103358",citations:18,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"The Linde-Hampson cycle (LHC) exhibits a promising future as a cooling method to achieve cooling temperatures below \u221240 \xB0C, and are highly desirable in commercial refrigeration. This paper investigated the refrigerant replacement options of low-GWP blends i.e. R1234yf/R1132a, R1234yf/R170, R1234yf/R41 and R1234yf/R744 in the LHC by using thermodynamic analysis. The compressor temperature, cooling capacity, coefficient of performance (COP) and exergy efficiency were chosen as the objective parameters. The modelling results show that the R1234yf/R41 mixture has larger cooling capacities, while the R1234yf/R1132a mixture has higher energy efficiency. Under a typical operating condition, the R1234yf/R1132a mixture attained a COP of 1.4162 and an exergy efficiency of 28.49%, demonstrating high priority for improving energy and exergy performances. Besides, the system performance will be improved significantly with increasing R1234yf mass fraction, but the cooling temperature will also increase. In addition, the condenser and expansion valve are the two components that deplete exergy the most, which should be the focus for performance improvement. These results have important guiding significance for understanding the effects of different operating conditions on the thermodynamic performance of the LHC, and also expand the selectivity towards the refrigeration system and its working fluids.",abstractKind:"abstract",abstractSource:"Open-license abstract",abstractUrl:"https://api.openalex.org/works/W4385498138",abstractLicense:"http://creativecommons.org/licenses/by/4.0/",keywords:[],sections:["3"],originalCitation:"Qin Y, Li N, Zhang H, Liu B. A thermodynamic analysis of the Linde-Hampson cycle using low-GWP R1234yf-blends. Case Studies in Thermal Engineering. 2023;49:103358.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.csite.2023.103358",note:"",isRetracted:!1},{id:"ref-64",number:64,numbers:[64],type:"journal-article",title:"Application of self-adaptive physics-informed neural network for the modeling of deep bottomhole heat exchangers",authors:"Ehsan Ghasemi; Mohammad Emami Niri; Mozhdeh Sajjadi; Hossein Nosrati",journal:"Applied Thermal Engineering",year:2026,volume:"294",issue:"",pages:"130607",doi:"10.1016/j.applthermaleng.2026.130607",doiUrl:"https://doi.org/10.1016/j.applthermaleng.2026.130607",citations:3,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"",abstractKind:"unavailable",abstractSource:"",abstractUrl:"",abstractLicense:"",keywords:[],sections:["3.1"],originalCitation:"Ghasemi E, Niri ME, Sajjadi M, Nosrati H. Application of self-adaptive physics-informed neural network for the modeling of deep bottomhole heat exchangers. Applied Thermal Engineering. 2026:130607.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.applthermaleng.2026.130607",note:"",isRetracted:!1},{id:"ref-65",number:65,numbers:[65],type:"journal-article",title:"Physics-informed deep residual neural network for finned-tube evaporator performance prediction",authors:"Xing-Yu Liang; Bo Zhang; Chun-Lu Zhang",journal:"Energy",year:2024,volume:"302",issue:"",pages:"131822",doi:"10.1016/j.energy.2024.131822",doiUrl:"https://doi.org/10.1016/j.energy.2024.131822",citations:19,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"Finned-tube heat exchangers are extensively used in industrial and daily life. As complex system designs and digital twins increase, higher demands arise for predictive modeling of finned-tube heat exchanger performance. Previous studies faced issues like disparities in evaporator performance under dry and wet conditions, inaccurate predictions of refrigerant pressure drop, and a lack of comprehensive consideration for predicting the trends in physical details. With the evolution of AI algorithms, exploring novel modeling methods becomes essential. Therefore, this study proposes a physics-informed deep residual network model for accurate performance prediction of finned-tube evaporators. The model achieved mean absolute error of 0.14 % for heat transfer rate prediction, 0.36 % for refrigerant pressure drop prediction, and 0.49 % for air pressure drop prediction. This model addresses previous issues of performance disparities under dry and wet conditions and high errors in refrigerant pressure drop prediction. The proposed deep residual network model is found much better performance in capturing physical details than other machine learning approaches. It can serve as a benchmark model for transfer learning or complex system modeling. The method of determining the structure of residual networks through a priori physical knowledge also provides a new perspective on modeling physical systems.",abstractKind:"abstract",abstractSource:"User-provided literature library",abstractUrl:"",abstractLicense:"",keywords:["Physics-informed network","Residual neural network","Finned-tube evaporator","Modeling","Deep learning"],sections:["3.1","3.1.1"],originalCitation:"Liang X-Y, Zhang B, Zhang C-L. Physics-informed deep residual neural network for finned-tube evaporator performance prediction. Energy. 2024;302:131822.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.energy.2024.131822",note:"",isRetracted:!1},{id:"ref-66",number:66,numbers:[66],type:"journal-article",title:"A physic-extract-constrained neural network for performance prediction of finned-tube condenser in air source heat pump system",authors:"Yanhua Guo; Ningbo Wang; Shuangquan Shao; Xiaoqiong Li; Yaran Liang; Zhuang Chen; Bo Tian; Zhentao Zhang",journal:"International Communications in Heat and Mass Transfer",year:2025,volume:"167",issue:"",pages:"109233",doi:"10.1016/j.icheatmasstransfer.2025.109233",doiUrl:"https://doi.org/10.1016/j.icheatmasstransfer.2025.109233",citations:6,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"It's vital to construct a fast and robust simulation model for the digital twins and intelligent control of air source heat pump (ASHP) system, where heat exchangers are the most complex and time-consuming parts. Therefore, a physics-exact-constrained neural network (PeCNN) is proposed to achieve highly generalized prediction of finned-tube condenser performance in the ASHP system under small data sample conditions. General framework of the PeCNN is to construct loss function integrated with physical constraints based on the 1-D physical correlation-based distributed parameter (PCDP) method and attention mechanism based residual network, resulting in the effective solution of the multiple non-smooth convex optimization problems in parallel. Comprehensive data experiments are conducted in the designed dataset. The results show that the proposed model achieves coefficient of determination (R2) of 0.998 for the refrigerant pressure drop prediction. Compared with other data-driven models, abilities of capturing physical details and extrapolation can be improved by 85% and 11.7%, respectively. The method of physical knowledge integration of the PeCNN also provides a new perspective on fast modeling ASHP systems.",abstractKind:"abstract",abstractSource:"User-provided literature library",abstractUrl:"",abstractLicense:"",keywords:["Physics-constrained","Air source heat pump","Finned-tube condenser","Performance prediction","Neural network"],sections:["3.1","3.1.1"],originalCitation:"Guo Y, Wang N, Shao S, Li X, Liang Y, Chen Z, et al. A physic-extract-constrained neural network for performance prediction of finned-tube condenser in air source heat pump system. International Communications in Heat and Mass Transfer. 2025;167:109233.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.icheatmasstransfer.2025.109233",note:"",isRetracted:!1},{id:"ref-67",number:67,numbers:[67],type:"journal-article",title:"Physics-Informed LSTM based dynamic model of heat exchanger and application on the thermal management system considering time delay",authors:"Xue-bin Tang; Qi-biao Hong; Yu Liu; Bing-cheng Wang; Zheng Cui; Wei Shao",journal:"International Journal of Heat and Mass Transfer",year:2025,volume:"250",issue:"",pages:"127322",doi:"10.1016/j.ijheatmasstransfer.2025.127322",doiUrl:"https://doi.org/10.1016/j.ijheatmasstransfer.2025.127322",citations:17,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"",abstractKind:"unavailable",abstractSource:"",abstractUrl:"",abstractLicense:"",keywords:[],sections:["3.1","3.1.2"],originalCitation:"Tang X-B, Hong Q-B, Liu Y, Wang B-C, Cui Z, Shao W. Physics-informed LSTM based dynamic model of heat exchanger and application on the thermal management system considering time delay. International Journal of Heat and Mass Transfer. 2025;250:127322.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.ijheatmasstransfer.2025.127322",note:"",isRetracted:!1},{id:"ref-69",number:69,numbers:[69],type:"journal-article",title:"AI for dynamic heat exchangers modeling in vapor compression systems with limited computational resources",authors:"Yiming Li; Suxin Qian",journal:"Energy",year:2026,volume:"346",issue:"",pages:"140284",doi:"10.1016/j.energy.2026.140284",doiUrl:"https://doi.org/10.1016/j.energy.2026.140284",citations:3,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"",abstractKind:"unavailable",abstractSource:"",abstractUrl:"",abstractLicense:"",keywords:[],sections:["3.1","3.1.2","4.1"],originalCitation:"Li Y, Qian S. AI for dynamic heat exchangers modeling in vapor compression systems with limited computational resources. Energy. 2026;346 //api.crossref.org/works/10.1016%2Fj.applthermaleng.2008.01.007",note:"",isRetracted:!1},{id:"ref-86",number:86,numbers:[86],type:"journal-article",title:"Prediction of the frost growth and performance change of air source heat pump system under various frosting conditions",authors:"Yoong Chung; Jin Woo Yoo; Gwi Taek Kim; Min Soo Kim",journal:"Applied Thermal Engineering",year:2019,volume:"147",issue:"",pages:"410-420",doi:"10.1016/j.applthermaleng.2018.10.085",doiUrl:"https://doi.org/10.1016/j.applthermaleng.2018.10.085",citations:82,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"A system model predicts frost accumulation and the resulting degradation of an air-source heat pump. The evaporator calculation includes latent heat and spatially uneven frosting, which changes airflow and pressure losses. Experimental comparisons support the model and indicate that much of the performance deterioration occurs late in the frosting cycle; frost mass alone is not a reliable measure of the loss.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.semanticscholar.org/paper/4bc16b12442f6ef5d2f89a6073592ce794926936",abstractLicense:"",keywords:[],sections:["3.1.4"],originalCitation:"Chung Y, Yoo JW, Kim GT, Kim MS. Prediction of the frost growth and performance change of air source heat pump system under various frosting conditions. Applied Thermal Engineering. 2019;147:410-20.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.applthermaleng.2018.10.085",note:"",isRetracted:!1},{id:"ref-87",number:87,numbers:[87],type:"journal-article",title:"Development and validation of a dynamic modeling framework for air-source heat pumps under cycling of frosting and reverse-cycle defrosting",authors:"Jiacheng Ma; Donghun Kim; James E. Braun; W. Travis Horton",journal:"Energy",year:2023,volume:"272",issue:"",pages:"127030",doi:"10.1016/j.energy.2023.127030",doiUrl:"https://doi.org/10.1016/j.energy.2023.127030",citations:37,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"",abstractKind:"unavailable",abstractSource:"",abstractUrl:"",abstractLicense:"",keywords:[],sections:["3.1.4"],originalCitation:"Ma J, Kim D, Braun JE, Horton WT. Development and validation of a dynamic modeling framework for air-source heat pumps under cycling of frosting and reverse-cycle defrosting. Energy. 2023;272:127030.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.energy.2023.127030",note:"",isRetracted:!1},{id:"ref-88",number:88,numbers:[88],type:"journal-article",title:"Deep learning-based prediction method on performance change of air source heat pump system under frosting conditions",authors:"Yong Hwan Eom; Yoong Chung; Minsu Park; Sung Bin Hong; Min Soo Kim",journal:"Energy",year:2021,volume:"228",issue:"",pages:"120542",doi:"10.1016/j.energy.2021.120542",doiUrl:"https://doi.org/10.1016/j.energy.2021.120542",citations:77,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"Since frost on an outdoor heat exchanger in winter reduces the performance of an air source heat pump (ASHP), a defrosting process is necessary to restore the degraded performance. Therefore, frosting and defrosting are crucial challenges. For a more efficient defrosting process, many researchers have conducted studies on demand-based defrosting control so far. Recently, various researches on frost growth prediction using neural networks have been conducted. Here, we propose a novel method to quantitatively predict changes in the performance (heating capacity, power consumption, and COP) of ASHPs due to frost growth using a single model based on deep learning. Based on prediction results, this method can be utilized to optimize the defrosting start control strategy. With multiple outputs regression models, we can predict three performance parameters simultaneously. They are models trained with only the initially installed sensors without additional sensors. Besides, we compared the prediction accuracy differences depending on three deep learning structures, such as a fully-connected deep neural network (FCDNN), convolutional neural network (CNN), and long short-term memory (LSTM). Summarizing the results, the optimal FCDNN-based model achieved a root-mean-square (RMS) error of 2.8% for the prediction of heating capacity, 2.4% for power consumption, and 3.4% for COP of ASHPs. (c) 2021 Published by Elsevier Ltd.",abstractKind:"abstract",abstractSource:"User-provided literature library",abstractUrl:"",abstractLicense:"",keywords:["Air source heat pump","Frost growth","Defrosting start control","Deep learning","Quantitative prediction","Multiple outputs regression"],sections:["3.1.4"],originalCitation:"Eom YH, Chung Y, Park M, Hong SB, Kim MS. Deep learning-based prediction method on performance change of air source heat pump system under frosting conditions. Energy. 2021;228:120542.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.energy.2021.120542",note:"",isRetracted:!1},{id:"ref-89",number:89,numbers:[89],type:"journal-article",title:"Dynamic modeling and defrost optimization for air source heat pumps: A deep learning and autoregression approach",authors:"Lei Chen; Wenpeng Wang; Xueyuan Yang; Hecheng Liu; Ruhao Ou",journal:"Energy and Buildings",year:2024,volume:"322",issue:"",pages:"114689",doi:"10.1016/j.enbuild.2024.114689",doiUrl:"https://doi.org/10.1016/j.enbuild.2024.114689",citations:21,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"Air source heat pumps (ASHPs) are celebrated for their exceptional energy efficiency and their capacity to curtail greenhouse gas emissions. However, a critical challenge in ASHPs research is the effective and accurate management of the defrosting process to preserve peak performance. The development of robust and precise simulation models is crucial yet complex for formulating and assessing defrosting strategies. To address this, our study investigates the integration of deep learning models with feature encoding to establish dynamic models for ASHPs. We evaluated various deep learning architectures, achieving a Mean Absolute Percentage Error (MAPE) of 3.5% in heating capacity predictions. Moreover, our analysis reveals that feature encoding substantially lowers the MAPE by 12%, thereby enhancing model accuracy. We employed a comprehensive suite of evaluation metrics to benchmark the performance across models, finding that the Temporal Convolutional Network (TCN) marginally surpasses others, including Transformer, LSTM, and LightGBM models. Additionally, we utilized transfer learning to boost the generalization capabilities models across different outdoor conditions (temperature and humidity), facilitating effective few-shot training. Finally, our study introduces a novel defrosting control strategy based on Heating Capacity Degradation (HCD). Using dynamic modeling, we determined optimal control thresholds (89%94%) that ensure maximum heating efficiency during frosting conditions. This strategy improves the average heating capacity by 101-278 W compared to conventional defrosting methods. The insights from this research not only advance defrosting control but also serve as a valuable reference for dynamic modeling and control optimization in the heat pump sector. The proposed control method enhances ASHPs performance and energy efficiency, supporting efforts towards achieving carbon neutrality.",abstractKind:"abstract",abstractSource:"User-provided literature library",abstractUrl:"",abstractLicense:"",keywords:["Air source heat pump","Defrosting control","Dynamic model","Transfer learning","Deep learning"],sections:["3.1.4"],originalCitation:"Chen L, Wang W, Yang X, Liu H, Ou R. Dynamic modeling and defrost optimization for air source heat pumps: A deep learning and autoregression approach. Energy and Buildings. 2024;322:114689.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.enbuild.2024.114689",note:"",isRetracted:!1},{id:"ref-90",number:90,number periment and neural network modeling",authors:"Xiang Cao; Ze-Yu Li; Liang-Liang Shao; Chun-Lu Zhang",journal:"Applied Thermal Engineering",year:2016,volume:"92",issue:"",pages:"210-218",doi:"10.1016/j.applthermaleng.2015.09.062",doiUrl:"https://doi.org/10.1016/j.applthermaleng.2015.09.062",citations:49,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"Electronic expansion valve (EEV) plays a crucial role in controlling refrigerant mass flow rate of refrigeration or heat pump systems for energy savings. However, complexities in two-phase throttling process and geometry make accurate modeling of EEV flow characteristics more difficult. This paper developed an artificial neural network (ANN) model using refrigerant inlet and outlet pressures, inlet subcooling, EEV opening as ANN inputs, refrigerant mass flow rate as ANN output. Both linear and nonlinear transfer functions in hidden layer were used and compared to each other. Experimental data from multiple sources including in-house experiments of one EEV with R410A were used for ANN training and test. In addition, literature correlations were compared with ANN as well. Results showed that the ANN model with nonlinear transfer function worked well in all cases and it is much accurate than the literature correlations. In all cases, nonlinear ANN predicted refrigerant mass flow rates within +/- 0.4% average relative deviation (A.D.) and 2.7% standard deviation (S.D.), meanwhile it predicted the EEV opening at 0.1% A.D. and 2.1% S.D. (C) 2015 Elsevier Ltd. All rights reserved.",abstractKind:"abstract",abstractSource:"User-provided literature library",abstractUrl:"",abstractLicense:"",keywords:["Electronic expansion valve","Refrigerant","Experiment","Model","Artificial neural network"],sections:["3.3"],originalCitation:"Cao X, Li Z-Y, Shao L-L, Zhang C-L. Refrigerant flow through electronic expansion valve: Experiment and neural network modeling. Applied Thermal Engineering. 2016;92:210\u20138.",metadataUrl:"htt dictions using Artificial Neural Network for isobutane flow in non-adiabatic capillary tubes",authors:"M. Heimel; W. Lang; R. Almbauer",journal:"International Journal of Refrigeration",year:2014,volume:"38",issue:"",pages:"281-289",doi:"10.1016/j.ijrefrig.2013.08.018",doiUrl:"https://doi.org/10.1016/j.ijrefrig.2013.08.018",citations:17,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"",abstractKind:"unavailable",abstractSource:"",abstractUrl:"",abstractLicense:"",keywords:[],sections:["3.3","3.3.2"],originalCitation:"Heimel M, Lang W, Almbauer R. Performance predictions using artificial neural network for isobutane flow in non-adiabatic capillary tubes. International Journal of Refrigeration. 2014;38:281\u20139.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.ijrefrig.2013.08.018",note:"",isRetracted:!1},{id:"ref-132",number:132,numbers:[132],type:"journal-article",title:"Machine learning and CFD for mapping and optimization of CO2 ejectors",authors:"Knut Emil Ringstad; Krzysztof Banasiak; \xC5smund Ervik; Armin Hafner",journal:"Applied Thermal Engineering",year:2021,volume:"199",issue:"",pages:"117604",doi:"10.1016/j.applthermaleng.2021.117604",doiUrl:"https://doi.org/10.1016/j.applthermaleng.2021.117604",citations:53,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"In this study, a novel simulation-based algorithm for CO2 ejector design and performance evaluation is presented. The algorithm is based on an automated Computational Fluid Dynamics (CFD) workflow that can account for different ejector geometries and operating conditions. The CFD data points are used to train a Gaussian Process Regression (GPR) machine learning model to predict the ejector performance indicators; efficiency, mass flow rates, outflow uniformity, and entropy generation. Three use cases are investigated using this methodology: 1) performance mapping for off-design operating conditions of a given ejector, 2) design mapping of ejector performance with 5 geometry variables investigated, and 3) flow structure prediction between different ejector mixing chamber geometries. The results show that this algorithm can be used to efficiently explore ejector designs with mean average errors between 0.07 and 0.1 [\u2013] in entrainment ratio. Furthermore, the method can to look for optimized geometries using gradient descent methods, as well as produce ejector performance maps. Additionally, the method is able to predict local flow structures of velocity and pressure inside the ejector with varied ejector geometries. The databases and GPR method implementation from this work is made available open-source for further development and research.",abstractKind:"abstract",abstractSource:"Open-license abstract",abstractUrl:"https://api.openalex.org/works/W3202243975",abstractLicense:"http://creativecommons.org/licenses/by/4.0/",keywords:[],sections:["3.3"],originalCitation:"Ringstad KE, Banasiak K, Ervik \xC5, Hafner A. Machine learning and CFD for mapping and optimization of CO2 ejectors. Applied Thermal Engineering. 2021;199:117604.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.applthermaleng.2021.117604",note:"",isRetracted:!1},{id:"ref-133",number:133,numbers:[133],type:"journal-article",title:"Generalized correlation of refrigerant mass flow rate through adiabatic capillary tubes using artificial neural network",authors:"Chun-Lu Zhang",journal:"International Journal of Refrigeration",year:2005,volume:"28",issue:"4",pages:"506-514",doi:"10.1016/j.ijrefrig.2004.11.004",doiUrl:"https://doi.org/10.1016/j.ijrefrig.2004.11.004",citations:59,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"",abstractKind:"unavailable",abstractSource:"",abstractUrl:"",abstractLicense:"",keywords:[],sections:["3.3"],originalCitation:"Zhang C-L. Generalized correlation of refrigerant mass flow rate through adiabatic capillary tubes using artificial neural network. International Journal of Refrigeration. 2005;28(4):506\u201314.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.ijrefrig.2004.11.004",note:"",isRetracted:!1},{id:"ref-134",number:134,numbers:[134],type:"journal-article",title:"Artificial neural network-based predictive model for supersonic ejector in refrigeration system",authors:"Hanzeng Zhu; Jiapeng Liu; Jinpeng Yu; Peng Yang",journal:"Case Studies in Thermal Engineering",year:2023,volume:"49",issue:"",pages:"103313",doi:"10.1016/j.csite.2023.103313",doiUrl:"https://doi.org/10.1016/j.csite.2023.103313",citations:15,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"In this paper, a novel predictive model is proposed for the supersonic ejector in the refrigeration system based on the artificial neural network technique. A composite performance prediction framework for the supersonic ejector is developed by employing a back propagation neural network with particle swarm optimization (PSO-BPNN) algorithm and a dynamic error com-pensation method. Firstly, we study the model construction problem for the supersonic ejector based on the traditional BPNN modeling method and the PSO algorithm. And then, a dynamic compensation technique is given to improve the predictive accuracy of the ejector model based on the adaptive neural network method. Finally, both the simulation and experimental results are given to verify our method. The experimental validation results show that most prediction errors of our model are less than 4%. Therefore, compared with the existing traditional models, our model has a higher accuracy.",abstractKind:"abstract",abstractSource:"User-provided literature library",abstractUrl:"",abstractLicense:"",keywords:["Ejector","Artificial neural network","Dynamic compensation","Model","Refrigeration system"],sections:["3.3"],originalCitation:"Zhu H, Liu J, Yu J, Yang P. Artificial neural network-based predictive model for supersonic ejector in refrigeration system. Case Studies in Thermal Engineering. 2023;49:103313.",metadataUrl:"https://api.crossref.org/works l neural network: A case study on VRF systems",authors:"Hanlong Wan; Tao Cao; Yunho Hwang; Saikee Oh",journal:"International Journal of Refrigeration",year:2019,volume:"107",issue:"",pages:"114-127",doi:"10.1016/j.ijrefrig.2019.08.018",doiUrl:"https://doi.org/10.1016/j.ijrefrig.2019.08.018",citations:22,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"Electronic expansion valves (EEV) are widely used in variable refrigerant flow systems (VRF) to control the mass flow rate of each indoor unit. EEV model is used to predict the mass flow rate through an EEV. While the power-law correlation method has been used to build the EEV model so far, Artificial Neural Network (ANN) methods have been adapted to model the EEV with a fixed speed compressor thanks to its higher accuracy. However, the EEV is typically working with the variable speed compressor in a VRF system. In addition, the parameters used in ANN modeling could be further optimized. The objective of this study is to develop an EEV modeling framework and optimize the input parameter number and hidden neuron number. We presented the framework through an EEV model development for a VRF system. For these, we used the field test data, applied a principal components analysis approach in optimizing the ANN input parameter number, and investigated the proper number of hidden neurons and appropriate transfer function pairs. We found the performance of the ANN model would not improve much as the number of input parameters and the number of hidden neurons reached a threshold. Only three transfer function pairs are suitable for this case in total nine groups we studied. Our ANN model has the average absolute deviation of 2.2%. The framework can be easily applied to EEV modeling in other VRF and air condition systems with necessary data support. (C) 2019 Elsevier Ltd and IIR. All rights reserved.",abstractKind:"abstract",abstractSource:"User-provided literature library",abstractUrl:"",abstractLicense:"",keywords:["
