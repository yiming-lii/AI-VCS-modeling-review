rmal Engineering. 2011;31(10):1770-9.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.applthermaleng.2011.02.022",note:"",isRetracted:!1},{id:"ref-150",number:150,numbers:[150],type:"journal-article",title:"Experimental investigation of oil retention in air conditioning systems",authors:"Lorenzo Cremaschi; Yunho Hwang; Reinhard Radermacher",journal:"International Journal of Refrigeration",year:2005,volume:"28",issue:"7",pages:"1018-1028",doi:"10.1016/j.ijrefrig.2005.03.012",doiUrl:"https://doi.org/10.1016/j.ijrefrig.2005.03.012",citations:68,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"",abstractKind:"unavailable",abstractSource:"",abstractUrl:"",abstractLicense:"",keywords:[],sections:["3.4"],originalCitation:"Cremaschi L, Hwang Y, Radermacher R. Experimental investigation of oil retention in air conditioning systems. International Journal of Refrigeration. 2005;28(7):1018-28.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.ijrefrig.2005.03.012",note:"",isRetracted:!1},{id:"ref-151",number:151,numbers:[151],type:"journal-article",title:"Transient refrigerant and oil distribution in a residential heat pump water heater system: Experiments and model",authors:"Wenzhe Li; Pega Hrnjak",journal:"International Journal of Refrigeration",year:2021,volume:"129",issue:"",pages:"184-193",doi:"10.1016/j.ijrefrig.2021.04.012",doiUrl:"https://doi.org/10.1016/j.ijrefrig.2021.04.012",citations:12,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"",abstractKind:"unavailable",abstractSource:"",abstractUrl:"",abstractLicense:"",keywords:[],sections:["3.4"],originalCitation:"Li W, Hrnjak P. Transient refrigerant and oil distribution in a residential heat pump water heater system: Experiments and model. International Journal of Refrigeration. 2021;129:184-93.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.ijrefrig.2021.04.012",note:"",isRetracted:!1},{id:"ref-152",number:152,numbers:[152],type:"journal-article",title:"An experimental data-driven charge model for round-tube-plate-fin heat exchangers using low-GWP refrigerants",authors:"Abraham J. Lee; Christian K. Bach; Craig R. Bradshaw",journal:"International Journal of Refrigeration",year:2024,volume:"158",issue:"",pages:"405-421",doi:"10.1016/j.ijrefrig.2023.12.006",doiUrl:"https://doi.org/10.1016/j.ijrefrig.2023.12.006",citations:2,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"Heat pumps can be switched between cooling and heating mode, requiring accurate charge modeling capabilities to enable the design of heat exchangers for near optimum efficiency in both operating modes. The charge modeling tools also require high-fidelity experimental validation data to tune their predictions. However, little experimental charge validation data is available in the open literature. This study addresses this need by providing complete, high-fidelity, experimental charge data of Round-Tube-Plate-Fin Heat Exchangers (RTPF) with +/- 2.2% of relative charge-measurement uncertainty and 0.8% of charge-measurement repeatability. In addition to R410A, charge data on two low-Global Warming Potential (GWP) refrigerants, R1234yf and R468C, is additionally collected. Furthermore, an accurate data-driven charge model is developed, tuned by the high-fidelity experimental charge data, with 12.3%, 12.8%, and 12.9% of the Mean Absolute Percentage Error (MAPE) based on the Taitel-Barnea, the Zivi, and the Baroczy void-fraction model, respectively. This experimentally validated charge model can contribute to enabling effective designs of heat pumps with high-accuracy charge predictions.",abstractKind:"abstract",abstractSource:"User-provided literature library",abstractUrl:"",abstractLicense:"",keywords:["Refrigerant charge","Charge inventory","Heat exchangers","Heat pumps","Low-GWP","Charge model"],sections:["3.4"],originalCitation:"Lee AJ, Bach CK, Bradshaw CR. An experimental data-driven charge model for round-tube-plate-fin heat exchangers using low-GWP refrigerants. International Journal of Refrigeration. 2024;158:405-21.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.ijrefrig.2023.12.006",note:"",isRetracted:!1},{id:"ref-153",number:153,numbers:[153],type:"journal-article",title:"LSTM-Based Modeling and Cross-Correlation Sensitivity Analysis for Heat Pump Refrigerant Distribution",authors:"Kosuke Miyawaki; Hongtao Qiao; Anna Sciazko; Naoki Shikazono",journal:"International Journal of Refrigeration",year:2025,volume:"177",issue:"",pages:"351-363",doi:"10.1016/j.ijrefrig.2025.06.006",doiUrl:"https://doi.org/10.1016/j.ijrefrig.2025.06.006",citations:0,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"An LSTM predicts refrigerant migration during heat-pump startup across different charge levels and initial refrigerant distributions. A sensitivity method perturbs selected outputs and examines how disturbances propagate through predicted variables. Validation indicates accurate distribution forecasts, while the perturbation analysis reveals physically plausible associations between refrigerant inventory, mass flow, compressor power, and heat-transfer capacity.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.semanticscholar.org/paper/5baec4806c4ee14a91730b618171106bcd617b17",abstractLicense:"",keywords:[],sections:["3.4"],originalCitation:"Miyawaki K, Qiao H, Sciazko A, Shikazono N. LSTM-based modeling and cross-correlation sensitivity analysis for heat pump refrigerant distribution. International Journal of Refrigeration. 2025;177:351-63.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.ijrefrig.2025.06.006",note:"",isRetracted:!1},{id:"ref-154",number:154,numbers:[154],type:"journal-article",title:"Deep learning-based prediction of oil reversal in R290 heat pump systems",authors:"Gil Jeong; Je Hyung Lee; Hyung Won Choi; Hee Woong Park; Hyun Jong Kim; Beom Soo Seo; Simon Chin; Yong Tae Kang",journal:"Energy",year:2025,volume:"320",issue:"",pages:"135255",doi:"10.1016/j.energy.2025.135255",doiUrl:"https://doi.org/10.1016/j.energy.2025.135255",citations:7,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"Recently, the R290 refrigerant has attracted significant attention due to its low global warming potential (GWP) and excellent thermal performance. To evaluate the reliability of R290 heat pump systems influenced by oil behavior of Polyalkylene glycol (PAG), this study introduces a novel oil reversal index (ORI). This index is defined as the ratio of the oil film thickness at the top and bottom of vertical pipes, providing a method to determine the occurrence and intensity of oil reversal. ORI is a metric that is not only easy to measure but also capable of accounting for the effects of oil viscosity and refrigerant solubility. It was experimentally measured under both transient and steady-state conditions, influencing factors were analyzed, and it was subsequently modeled using deep learning. The long short-term memory model with batch normalization (LSTM + BN) achieved a mean absolute percentage error (MAPE) of 12.64 % in predicting oil film thickness under transient conditions. Furthermore, by selecting top 10 most impactful parameters through feature importance analysis and retraining the model, this error was reduced to 8.81 %. Additionally, the model predicted ORI under steady-state conditions with an error of 2.21 % using 20 input features.",abstractKind:"abstract",abstractSource:"User-provided literature library",abstractUrl:"",abstractLicense:"",keywords:["Deep learning","Film thickness","Heat pump","Oil reversal","Polyalkylene glycol (PAG)","R290 (Propane)"],sections:["3.4"],originalCitation:"Jeong G, Lee JH, Choi HW, Park HW, Kim HJ, Seo BS, et al. Deep learning-based prediction of oil reversal in R290 heat pump systems. Energy. 2025;320:135255.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.energy.2025.135255",note:"",isRetracted:!1},{id:"ref-155",number:155,numbers:[155],type:"journal-article",title:"Oil circulation rate prediction by transformer based deep learning model in R290 heat pump systems",authors:"Jehyung Lee; Gil Jeong; Hyungwon Choi; Hyunjong Kim; Eunjun Cho; Beomsoo Seo; Simon Chin; Yong Tae Kang",journal:"Energy",year:2025,volume:"337",issue:"",pages:"138652",doi:"10.1016/j.energy.2025.138652",doiUrl:"https://doi.org/10.1016/j.energy.2025.138652",citations:0,citationSource:"Local Web of Science export \xB7 snapshot",abstract:"R290 (propane) has emerged as a leading candidate for next-generation heat pump systems due to its negligible ozone depletion potential (ODP), very low global warming potential (GWP), and excellent thermophysical properties. However, its relatively low density makes oil transport within the cycle less favorable, highlighting the importance of accurate Oil Circulation Rate (OCR) control. Excessive oil migration can degrade performance and hinder compressor lubrication. This study develops and validates a framework that combines indirect sensing with deep learning for real-time, non-invasive OCR prediction in R290 heat pumps. A total of 54 heatingmode experiments were conducted under diverse conditions, yielding OCR values from 0.31 % to 1.51 %. Excessive OCR caused up to a 10.3 % reduction in refrigerant mass flow rate, a 15.5 % drop in COP, a 5.7 % decline in heating capacity, and a 20 % decrease in condenser pressure at 0 degrees C. Deep learning models (MLP, LSTM, Transformer) were trained on 44 datasets and tested on 10 unseen cases, achieving mean absolute percentage errors below 10 % for OCR prediction. Among them, the Transformer showed the best performance, with an RMSE of 0.0179 % under transient compressor frequency variations. Moreover, the self-attention analysis captured feature dependencies consistent with oil entrainment mechanisms, highlighting the Transformer's capability to provide physically meaningful explanations beyond pure prediction. Finally, Transformer-predicted OCR was applied as a virtual sensor to estimate component-wise oil retention using a corrected mixture law, yielding 3-12 g.",abstractKind:"abstract",abstractSource:"User-provided literature library",abstractUrl:"",abstractLicense:"",keywords:["Deep learning","Heat pump","Oil circulation rate (OCR)","Polyalkylene glycol (PAG)","R290 (propane)","Transformer"],sections:["3.4"],originalCitation:"Lee J, Jeong G, Choi H, Kim H, Cho E, Seo B, et al. Oil circulation rate prediction by transformer based deep learning model in R290 heat pump systems. Energy. 2025;337:138652.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.energy.2025.138652",note:"",isRetracted:!1},{id:"ref-156",number:156,numbers:[156],type:"journal-article",title:"A hybrid physics-based machine learning framework for oil retention prediction: a comparative analysis of modeling approaches in refrigerant vapor lines",authors:"Ammar M. Bahman; Mohammad Erfanimatin; Pejman Nourani; Haotian Liu; Vatsal M. Shah; James E. Braun; Eckhard A. Groll",journal:"International Journal of Refrigeration",year:2026,volume:"182",issue:"",pages:"504-521",doi:"10.1016/j.ijrefrig.2025.11.015",doiUrl:"https://doi.org/10.1016/j.ijrefrig.2025.11.015",citations:3,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"\u2022 Evaluation of physics-based machine learning-aided (PBMLA) model developed for oil retention (OR) prediction. \u2022 PBMLA investigated for horizontal and vertical lines of different diameters, refrigerants, and flow conditions. \u2022 PBMLA demonstrated superiority over purely standalone machine learning (ML) models. \u2022 Sensitivity analysis demonstrated relative improvement of PBMLA model to address variations in the feature inputs compared to physics-based (PB) model. \u2022 PBMLA demonstrated relatively higher accuracy than a purely PB model in extrapolation predictions with different refrigerants and oil types. With the deployment of variable-speed compressors in unitary air conditioning (AC) systems as well as the future implementation of newer HFO refrigerants, there is a need to upgrade line sizing guidelines to account for the effects of oil retention (OR). These new guidelines can be facilitated through developing and applying a predictive model for OR in vapor lines for commonly used refrigerant-lubricant combinations in the heating, ventilation, air conditioning, and refrigeration (HVAC&R) industry. This work aims to evaluate the prediction accuracy of machine learning (ML), physics-based (PB), and hybrid models trained using OR data obtained for horizontal and vertical lines of different diameters (11, 17, and 20 mm). The data include different refrigerants (R134a, R410A, R32, and R1234ze(E)) used with POE32 lubricant under various flow conditions. The ML models were trained and tested using data obtained from over 230 experimental tests. The input parameters for each model were refrigerant conditions (type, temperature, pressure, and mass flow rate), pipeline dimensions and orientation, injected oil mass flow rate, and oil viscosity, with OR as the predicted output. Various model types were investigated and compared, including a purely physics-based (PB) model, two standalone ML models, and two physics-based machine learning-aided (PBMLA) algorithms. A sensitivity analysis was performed to assess the effect of input parameters on the prediction errors. In addition, an extrapolation study was conducted using different refrigerants and various oil grades and types to evaluate the models\u2019 ability to predict OR with acceptable accuracy. The results showed that the standalone ML algorithms exhibited lower accuracy in predicting OR compared to the PB model. Furthermore, the PBMLA models demonstrated a modest improvement in OR prediction accuracy over the purely PB model (improved R 2 by up to 10.8 %, and reduced RMSE by up to 4.5 %). Moreover, the parametric analysis revealed that the PBMLA models could address variations of the feature inputs relatively better than the PB model, leading to their higher prediction accuracy compared to all other models. Finally, the extrapolation analysis showed that both the PB and PBMLA models were not limited to specific oil types or grades, suggesting their potential for general applicability in OR prediction and system design.",abstractKind:"abstract",abstractSource:"Open-license abstract",abstractUrl:"https://api.openalex.org/works/W4416530290",abstractLicense:"http://creativecommons.org/licenses/by/4.0/",keywords:[],sections:["3.4"],originalCitation:"Bahman AM, Erfanimatin M, Nourani P, Liu H, Shah VM, Braun JE, et al. A hybrid physics-based machine learning framework for oil retention prediction: A comparative analysis of modeling approaches in refrigerant vapor lines. International Journal of Refrigeration. 2026;182:504-21.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.ijrefrig.2025.11.015",note:"",isRetracted:!1},{id:"ref-157",number:157,numbers:[157],type:"journal-article",title:"The coefficient of determination R-squared is more informative than SMAPE, MAE, MAPE, MSE and RMSE in regression analysis evaluation",authors:"Davide Chicco; Matthijs J. Warrens; Giuseppe Jurman",journal:"PeerJ Computer Science",year:2021,volume:"7",issue:"",pages:"e623",doi:"10.7717/peerj-cs.623",doiUrl:"https://doi.org/10.7717/peerj-cs.623",citations:5213,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"Regression analysis makes up a large part of supervised machine learning, and consists of the prediction of a continuous independent target from a set of other predictor variables. The difference between binary classification and regression is in the target range: in binary classification, the target can have only two values (usually encoded as 0 and 1), while in regression the target can have multiple values. Even if regression analysis has been employed in a huge number of machine learning studies, no consensus has been reached on a single, unified, standard metric to assess the results of the regression itself. Many studies employ the mean square error (MSE) and its rooted variant (RMSE), or the mean absolute error (MAE) and its percentage variant (MAPE). Although useful, these rates share a common drawback: since their values can range between zero and +infinity, a single value of them does not say much about the performance of the regression with respect to the distribution of the ground truth elements. In this study, we focus on two rates that actually generate a high score only if the majority of the elements of a ground truth group has been correctly predicted: the coefficient of determination (also known as R -squared or R 2 ) and the symmetric mean absolute percentage error (SMAPE). After showing their mathematical properties, we report a comparison between R 2 and SMAPE in several use cases and in two real medical scenarios. Our results demonstrate that the coefficient of determination ( R -squared) is more informative and truthful than SMAPE, and does not have the interpretability limitations of MSE, RMSE, MAE and MAPE. We therefore suggest the usage of R -squared as standard metric to evaluate regression analyses in any scientific domain.",abstractKind:"abstract",abstractSource:"Open-license abstract",abstractUrl:"https://api.crossref.org/works/10.7717%2Fpeerj-cs.623",abstractLicense:"https://creativecommons.org/licenses/by/4.0/",keywords:[],sections:["4.1"],originalCitation:"Chicco D, Warrens MJ, Jurman G. The coefficient of determination R-squared is more informative than SMAPE, MAE, MAPE, MSE and RMSE in regression analysis evaluation. Peerj computer science. 2021;7:e623.",metadataUrl:"https://api.crossref.org/works/10.7717%2Fpeerj-cs.623",note:"",isRetracted:!1},{id:"ref-159",number:159,numbers:[159],type:"journal-article",title:"Promising directions of machine learning for partial differential equations",authors:"Steven L. Brunton; J. Nathan Kutz",journal:"Nature Computational Science",year:2024,volume:"4",issue:"7",pages:"483-494",doi:"10.1038/s43588-024-00643-2",doiUrl:"https://doi.org/10.1038/s43588-024-00643-2",citations:122,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"",abstractKind:"unavailable",abstractSource:"",abstractUrl:"",abstractLicense:"",keywords:[],sections:["4.2"],originalCitation:"Brunton SL, Kutz JN. Promising directions of machine learning for partial differential equations. Nature Computational Science. 2024;4(7):483-94.",metadataUrl:"https://api.crossref.org/works/10.1038%2Fs43588-024-00643-2",note:"",isRetracted:!1},{id:"ref-160",number:160,numbers:[160],type:"journal-article",title:"Physics-guided, noise-resilient and interpretable machine learning framework for fault detection and diagnosis in variable refrigerant flow systems",authors:"Muhammad Reshaeel; Vinod Khadkikar; Mohamed I.Hassan Ali",journal:"Energy and AI",year:2026,volume:"24",issue:"",pages:"100766",doi:"10.1016/j.egyai.2026.100766",doiUrl:"https://doi.org/10.1016/j.egyai.2026.100766",citations:0,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"Fault detection and diagnosis (FDD) in variable refrigerant flow (VRF) systems is typically driven by improving classification accuracy using complex machine learning (ML) models trained on clean datasets, with limited consideration of robustness to sensor noise, generalization under distributional shift, and interpretability. Moreover, existing studies predominantly focus on refrigerant charge and fouling faults, while critical component-level hard faults remain underexplored. To address these gaps, this study proposes a Gaussian noise-resilient, interpretable, and physics-guided ML framework for component-level VRF FDD using only built-in sensor telemetry. The framework introduces noise-resilient physics-informed (NRPI) variants of three conventional classifiers (RF, SVC, and XGBoost), integrating curriculum-based Gaussian noise augmentation to explicitly account for noise and a post-hoc physics-guided probabilistic rule to refine class-specific predictions in a modular manner. A comprehensive three-stage evaluation protocol including hold-out testing, independent offline validation, and controlled noise-based stress testing was employed to assess accuracy, offline generalization, and noise robustness. NRPI variants consistently outperform their baseline counterparts with NRPI-RF and NRPI-SVC achieving the highest mean macro-F1 of 99.10% and 99.13% across different level of sensor noise. Averaged across the different noise tests, NRPI\u2011XGBoost achieved the largest macro\u2011F1 gain (38.15%) over its baseline variant, while NRPI\u2011RF and NRPI\u2011SVC improved their macro-F1 scores by 11.98% and 4.38%, respectively. Ablation and interpretability analyses reveal that noise-aware training enhances global robustness under additive Gaussian noise, while the physics-guided rule improves class-specific reliability. Overall, the proposed framework provides an accurate, robust and interpretable pathway for component-level FDD in VRF systems.",abstractKind:"abstract",abstractSource:"Open-license abstract",abstractUrl:"https://api.openalex.org/works/W7160064825",abstractLicense:"http://creativecommons.org/licenses/by-nc/4.0/",keywords:[],sections:["5"],originalCitation:"Reshaeel M, Khadkikar V, Ali MIH. Physics-guided, noise-resilient and interpretable machine learning framework for fault detection and diagnosis in variable refrigerant flow systems. Energy and AI. 2026:100766.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.egyai.2026.100766",note:"",isRetracted:!1},{id:"ref-161",number:161,numbers:[161],type:"journal-article",title:"Deep learning in fault detection and diagnosis of building HVAC systems: A systematic review with meta analysis",authors:"Fan Zhang; Nausheen Saeed; Paria Sadeghian",journal:"Energy and AI",year:2023,volume:"12",issue:"",pages:"100235",doi:"10.1016/j.egyai.2023.100235",doiUrl:"https://doi.org/10.1016/j.egyai.2023.100235",citations:69,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"Building sector account for significant global energy consumption and Heating Ventilation and Air Conditioning (HVAC) systems contribute to the highest portion of building energy consumption. Therefore, the potential for energy saving by improving the efficiency of HVAC systems is huge and various fault detection and diagnosis (FDD) methods have been studied for this purpose. Although amongst all types of existing FDD methods, data-driven based ones are regarded as the most effective methods. As a relatively new branch of data-driven approaches, deep learning (DL) methods have shown promising results, a comprehensive review of DL applications in this area is absent. To fill the research gap, this systematic review with meta analysis analyses the relevant studies both quantitatively and qualitatively. The review is conducted by searching Web of Science, ScienceDirect, and Semantic search. There are 47 eligible studies included in this review following the preferred reporting items for systematic reviews and meta-analyses (PRISMA) protocol. 6 out of the 47 studies are identified as eligible for meta analysis of the effectiveness of DL methods for FDD. The most used DL method is 2D convolutional neural network (CNN). Results suggest that DL methods show promising results as a HVAC FDD. However, most studies use simulation/lab experiment data and real-world complexities are not fully investigated. Therefore, DL methods need to be further tested with real-world scenarios to support decision-making.",abstractKind:"abstract",abstractSource:"Open-license abstract",abstractUrl:"https://api.openalex.org/works/W4318203596",abstractLicense:"http://creativecommons.org/licenses/by/4.0/",keywords:[],sections:["5"],originalCitation:"Zhang F, Saeed N, Sadeghian P. Deep learning in fault detection and diagnosis of building HVAC systems: A systematic review with meta analysis. Energy and AI. 2023;12:100235.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.egyai.2023.100235",note:"",isRetracted:!1},{id:"ref-162",number:162,numbers:[162],type:"journal-article",title:"Chiller faults detection and diagnosis with sensor network and adaptive 1D CNN",authors:"Ke Yan; Xiaokang Zhou",journal:"Digital Communications and Networks",year:2022,volume:"8",issue:"4",pages:"531-539",doi:"10.1016/j.dcan.2022.03.023",doiUrl:"https://doi.org/10.1016/j.dcan.2022.03.023",citations:89,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"Computer-empowered detection of possible faults for Heating, Ventilation and Air-Conditioning (HVAC) subsystems, e.g., chillers, is one of the most important applications in Artificial Intelligence (AI) integrated Internet of Things (IoT). The cyber-physical system greatly enhances the safety and security of the working facilities, reducing time, saving energy and protecting humans\u2019 health. Under the current trends of smart building design and energy management optimization, Automated Fault Detection and Diagnosis (AFDD) of chillers integrated with IoT is highly demanded. Recent studies show that standard machine learning techniques, such as Principal Component Analysis (PCA), Support Vector Machine (SVM) and tree-structure-based algorithms, are useful in capturing various chiller faults with high accuracy rates. With the fast development of deep learning technology, Convolutional Neural Networks (CNNs) have been widely and successfully applied to various fields. However, for chiller AFDD, few existing works are adopting CNN and its extensions in the feature extraction and classification processes. In this study, we propose to perform chiller FDD using a CNN-based approach. The proposed approach has two distinct advantages over existing machine learning-based chiller AFDD methods. First, the CNN-based approach does not require the feature selection/extraction process. Since CNN is reputable with its feature extraction capability, the feature extraction and classification processes are merged, leading to a more neat AFDD framework compared to traditional approaches. Second, the classification accuracy is significantly improved compared to traditional methods using the CNN-based approach.",abstractKind:"abstract",abstractSource:"Open-license abstract",abstractUrl:"https://api.openalex.org/works/W4221072297",abstractLicense:"http://creativecommons.org/licenses/by-nc-nd/4.0/",keywords:[],sections:["5"],originalCitation:"Yan K, Zhou X. Chiller faults detection and diagnosis with sensor network and adaptive 1D CNN. Digital Communications and Networks. 2022;8(4):531-9.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.dcan.2022.03.023",note:"",isRetracted:!1},{id:"ref-163",number:163,numbers:[163],type:"journal-article",title:"Energy saving by Artificial intelligence-based fault detection and diagnosis: 42 chiller case studies",authors:"Yen-Tang Chen; Da-Sheng Lee; Jhih-Jie Yang; Wei-Tao Huang; Yen-Po Liu",journal:"Case Studies in Thermal Engineering",year:2025,volume:"74",issue:"",pages:"106885",doi:"10.1016/j.csite.2025.106885",doiUrl:"https://doi.org/10.1016/j.csite.2025.106885",citations:1,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"This study proposes an Artificial Intelligence (AI)-based Fault Detection and Diagnosis (FDD) system for chiller fault diagnostics, utilizing a One-Dimensional Convolutional Neural Network (1D-CNN) combined with Transfer Learning to enhance generalizability across diverse sites. The system was deployed on 42 chillers across Taiwan and achieved a 93 % accuracy rate in detecting three major fault types. While previous studies have primarily focused on fault identification and maintenance cost reduction, empirical evidence regarding the energy-saving impact of AI-based FDD remains limited. This study is the first to quantitatively assess its energy-saving potential using the Green Mark's kW/RT metric as a benchmark. A three-year case study was conducted on 42 units, tracking seven common fault types. Among them, three faults resulted in prolonged operation post-failure, leading to abnormal energy consumption. The findings reveal a total abnormal energy consumption of 35,968 kW-hours, averaging 11,989 kWh per year. Moreover, chillers equipped with the AI-based FDD system demonstrated an average improvement of 15.13 % in kW/RT performance, highlighting its significant contributions to energy efficiency and carbon reduction.",abstractKind:"abstract",abstractSource:"Open-license abstract",abstractUrl:"https://api.openalex.org/works/W4413143985",abstractLicense:"http://creativecommons.org/licenses/by-nc-nd/4.0/",keywords:[],sections:["5"],originalCitation:"Chen Y-T, Lee D-S, Yang J-J, Huang W-T, Liu Y-P. Energy saving by artificial intelligence-based fault detection and diagnosis: 42 chiller case studies. Case Studies in Thermal Engineering. 2025;74:106885.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.csite.2025.106885",note:"",isRetracted:!1},{id:"ref-164",number:164,numbers:[164],type:"journal-article",title:"GraPHsep: An integrated construction method of vapor compression cycle and heat exchanger network",authors:"Mengdi Cui; Baolong Wang; Cuiling Wang; Falin Wei; Wenxing Shi",journal:"Energy Conversion and Management",year:2023,volume:"277",issue:"",pages:"116576",doi:"10.1016/j.enconman.2022.116576",doiUrl:"https://doi.org/10.1016/j.enconman.2022.116576",citations:16,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"",abstractKind:"unavailable",abstractSource:"",abstractUrl:"",abstractLicense:"",keywords:[],sections:["5"],originalCitation:"Cui M, Wang B, Wang C, Wei F, Shi W. GraPHsep: An integrated construction method of vapor compression cycle and heat exchanger network. Energy Conversion and Management. 2023;277:116576.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.enconman.2022.116576",note:"",isRetracted:!1},{id:"ref-165",number:165,numbers:[165],type:"journal-article",title:"Construction of vapor compression cycle with composite pressure-regulating components using GraPHsep method",authors:"Mengdi Cui; Yuzheng Ying; Baolong Wang; Falin Wei",journal:"Energy Conversion and Management",year:2024,volume:"301",issue:"",pages:"118074",doi:"10.1016/j.enconman.2024.118074",doiUrl:"https://doi.org/10.1016/j.enconman.2024.118074",citations:11,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"",abstractKind:"unavailable",abstractSource:"",abstractUrl:"",abstractLicense:"",keywords:[],sections:["5"],originalCitation:"Cui M, Ying Y, Wang B, Wei F. Construction of vapor compression cycle with composite pressure-regulating components using GraPHsep method. Energy Conversion and Management. 2024;301:118074.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.enconman.2024.118074",note:"",isRetracted:!1},{id:"ref-166",number:166,numbers:[166],type:"journal-article",title:"Potential low-GWP high-efficiency air conditioning and heat pump cycles for buildings based on intelligent GraPHsep method",authors:"Mengdi Cui; Zhigang Wang; Zhanwen Zhao; Xianguo Jiang; Baolong Wang",journal:"Energy",year:2025,volume:"333",issue:"",pages:"137381",doi:"10.1016/j.energy.2025.137381",doiUrl:"https://doi.org/10.1016/j.energy.2025.137381",citations:3,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"",abstractKind:"unavailable",abstractSource:"",abstractUrl:"",abstractLicense:"",keywords:[],sections:["5"],originalCitation:"Cui M, Wang Z, Zhao Z, Jiang X, Wang B. Potential low-GWP high-efficiency air conditioning and heat pump cycles for buildings based on intelligent GraPHsep method. Energy. 2025;333:137381.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.energy.2025.137381",note:"",isRetracted:!1},{id:"ref-168",number:168,numbers:[168],type:"journal-article",title:"SolarNet: A sky image-based deep convolutional neural network for intra-hour solar forecasting",authors:"Cong Feng; Jie Zhang",journal:"Solar Energy",year:2020,volume:"204",issue:"",pages:"71-78",doi:"10.1016/j.solener.2020.03.083",doiUrl:"https://doi.org/10.1016/j.solener.2020.03.083",citations:167,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"SolarNet uses a deep convolutional architecture to predict solar irradiance over the following hour directly from sky photographs, without additional measured predictors or manually designed features. Separate models estimate different forecast horizons. Evaluation on six years of observations shows improvements over a persistence benchmark and conventional machine-learning methods across multiple weather conditions.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.semanticscholar.org/paper/9bda40c479cdf128103b29c029120dbfa3c00757",abstractLicense:"",keywords:[],sections:["5"],originalCitation:"Feng C, Zhang J. SolarNet: A sky image-based deep convolutional neural network for intra-hour solar forecasting. Solar Energy. 2020;204:71-8.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.solener.2020.03.083",note:"",isRetracted:!1},{id:"ref-169",number:169,numbers:[169],type:"journal-article",title:"Convolutional neural networks for intra-hour solar forecasting based on sky image sequences",authors:"Cong Feng; Jie Zhang; Wenqi Zhang; Bri-Mathias Hodge",journal:"Applied Energy",year:2022,volume:"310",issue:"",pages:"118438",doi:"10.1016/j.apenergy.2021.118438",doiUrl:"https://doi.org/10.1016/j.apenergy.2021.118438",citations:148,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"Convolutional networks are trained to predict solar irradiance ten to sixty minutes ahead using sequences of sky photographs. Tests with six years of observations outperform persistence and shallow-learning benchmarks. Sensitivity studies examine image resolution, sequence length, and weather conditions, showing that input design materially influences forecast accuracy.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.semanticscholar.org/paper/1bbd06ce6fae4e47aa8881ba14b0462ee749d059",abstractLicense:"",keywords:[],sections:["5"],originalCitation:"Feng C, Zhang J, Zhang W, Hodge B-M. Convolutional neural networks for intra-hour solar forecasting based on sky image sequences. Applied Energy. 2022;310:118438.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.apenergy.2021.118438",note:"",isRetracted:!1},{id:"ref-172",number:172,numbers:[172],type:"journal-article",title:"HeatGen: A guided diffusion framework for multiphysics heat sink design optimization",authors:"Hadi Keramati; Morteza Sadeghi; Rajeev K. Jaiman",journal:"International Journal of Heat and Mass Transfer",year:2026,volume:"261",issue:"",pages:"128579",doi:"10.1016/j.ijheatmasstransfer.2026.128579",doiUrl:"https://doi.org/10.1016/j.ijheatmasstransfer.2026.128579",citations:0,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"",abstractKind:"unavailable",abstractSource:"",abstractUrl:"",abstractLicense:"",keywords:[],sections:["5"],originalCitation:"Keramati H, Sadeghi M, Jaiman RK. HeatGen: A guided diffusion framework for multiphysics heat sink design optimization. International Journal of Heat and Mass Transfer. 2026;261:128579.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.ijheatmasstransfer.2026.128579",note:"",isRetracted:!1},{id:"ref-173",number:173,numbers:[173],type:"journal-article",title:"Generative prediction of flow fields around an obstacle using the diffusion model",authors:"Jiajun Hu; Zhen Lu; Yue Yang",journal:"Physical Review Fluids",year:2025,volume:"10",issue:"9",pages:"094903",doi:"10.1103/8flg-k6s5",doiUrl:"https://doi.org/10.1103/8flg-k6s5",citations:9,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"A diffusion model predicts flow fields from obstacle geometry, using a U-Net denoiser and cross-attention conditioning. Training uses simple obstacle shapes, while evaluation also includes unfamiliar geometries. Compared with convolutional and variational-autoencoder baselines, the model better reproduces instantaneous flow patterns and generalizes more effectively to complex shapes. Accuracy and divergence checks support the robustness of the generated fields.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://journals.aps.org/prfluids/abstract/10.1103/8flg-k6s5",abstractLicense:"",keywords:[],sections:["5"],originalCitation:"Hu J, Lu Z, Yang Y. Generative prediction of flow field based on the diffusion model. 2024.",metadataUrl:"https://api.crossref.org/works/10.1103/8flg-k6s5",note:"The manuscript cites the 2024 preprint. This panel uses its verified 2025 journal version, linked by arXiv:2407.00735.",isRetracted:!1},{id:"ref-174",number:174,numbers:[174],type:"journal-article",title:"Energy-efficient HVAC control in residential buildings through occupant intention inference with multimodal large language models",authors:"Zixuan Qi; Zhiyao Yang; Mingzhe Liu; Zheng O\u2019Neill",journal:"Advances in Applied Energy",year:2026,volume:"23",issue:"",pages:"100283",doi:"10.1016/j.adapen.2026.100283",doiUrl:"https://doi.org/10.1016/j.adapen.2026.100283",citations:2,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"Heating, ventilation, and air-conditioning (HVAC) systems account for a large share of building energy use, and their operation is strongly shaped by occupant behavior. Occupant-centric control (OCC) can improve HVAC energy efficiency while maintaining thermal comfort, but most existing approaches rely on sparse and limited behavioral signals, such as occupant presence, and miss the occupant\u2019s actual intention and activity context that drive both comfort needs and energy demand. This study introduces an occupant intention-aware framework that integrates multimodal large language models with a model predictive controller. The language model observes camera footage and infers structured occupant and building states, which update the controller's comfort bounds and heat-gain predictions in real time, enabling the MPC controller to optimize heat pump operation more accurately. A 13-hour residential case study in a fully furnished 111 m\xB2 residential lab home in Texas demonstrated the effectiveness of the proposed pipeline. A six-configuration case study shows that the proposed framework reduces unmet degree hours by 48.1% and heat-pump electricity use by 60.4% relative to a baseline predictive controller driven by U.S. Department of Energy prototype building schedules in a simulation environment, and progressive ablation indicates that the occupant state is the dominant driver of the improvement. This study underscores the potential of intention-aware OCC, in which LLMs serve as a cognitive layer that translates unstructured observations into structured and explainable semantic states, reducing reliance on fragmented sensor streams and enabling control strategies directly aligned with occupant intentions.",abstractKind:"abstract",abstractSource:"Open-license abstract",abstractUrl:"https://api.openalex.org/works/W7163017798",abstractLicense:"http://creativecommons.org/licenses/by-nc-nd/4.0/",keywords:[],sections:["5"],originalCitation:"Qi Z, Yang Z, Liu M, O'Neill Z. Energy-efficient HVAC control in residential buildings through occupant intention inference with multimodal large language models. Advances in Applied Energy. 2026;23:100283.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.adapen.2026.100283",note:"",isRetracted:!1}]};var $1=mc.papers,Ql=mc.stats,e0=Ta.flatMap(function e(a){return[a,...(a.children??[]).flatMap(e)]});function $l(e){return e==="paper"?$1:$1.filter(a=>a.sections.some(t=>t===e||t.startsWith(e+".")))}function a0(e,a,t){let r=a.trim().toLowerCase();return e.filter(o=>!r||[o.title,o.authors,o.journal,o.year,o.doi,o.abstract,...o.keywords,...o.numbers.map(i=>`[${i}]`)].join(" ").toLowerCase().includes(r)).sort((o,i)=>t==="order"?o.number-i.number:t==="newes
