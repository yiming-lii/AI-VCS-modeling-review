.workspace{grid-template-columns:minmax(0,1fr) 430px}
.workspace.panel-hidden{grid-template-columns:minmax(0,1fr)}
.references-pane{min-width:0;overflow:auto;padding:25px 24px;background:#0e1628;border-left:1px solid var(--line);scrollbar-width:thin;scrollbar-color:#43516a transparent}
.references-selected{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}
.references-label{margin:0 0 10px;color:#91a9c8;font-size:11px;letter-spacing:.15em;line-height:1.4;text-transform:uppercase}
.references-selected h2{margin:0;color:#eef4ff;font-size:27px;font-weight:650;line-height:1.28;letter-spacing:-.025em;overflow-wrap:anywhere}
.references-color{width:13px;height:13px;border-radius:50%;margin-top:3px;flex-shrink:0}
.heading-hit-area{cursor:pointer;outline:none;transition:fill .15s}
.heading-hit-area:hover{fill:#9bcaff0c;stroke:#99bde6;stroke-opacity:.65}
.heading-hit-area:focus-visible{stroke:#9adeff;stroke-width:3;fill:#9bcaff12}
.selected-node>rect:first-child{stroke-opacity:.9;stroke-width:2}
.reference-number{margin:0 0 5px;color:#7292b7;font-size:10px;letter-spacing:.08em}
.reference-number strong{color:#ff958c}
.reference-abstract-label{color:#c9dafa;font-size:11px;font-weight:650;letter-spacing:.04em}
.reference-provenance,.reference-original{font-size:10px;color:#859ab7}
.reference-provenance a{font-size:10px}
.reference-record-note{padding:9px 11px;background:#dbb57f0c;border-left:2px solid #dbb57f;color:#ccb993}
.references-stats{display:grid;grid-template-columns:1fr 1.1fr 1.05fr;gap:13px;margin:24px 0 0;padding:19px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.references-stats dt{margin:0;color:#91a9c8;font-size:11px;line-height:1.4;white-space:nowrap}
.references-stats dd{margin:8px 0 0;font-size:21px;line-height:1.3;font-weight:600;color:#edf4ff;white-space:nowrap}
.references-stats dd.year-range{font-size:17px;padding-top:3px}
.references-stats dd.pending-mapping{font-size:17px;padding-top:3px;color:#b3bfd1}
.references-preview-note{margin:14px 0;color:#778ba7;font-size:10px;line-height:1.65}
.references-preview-note>span{color:#a9bcda;margin-right:6px;font-weight:600}
.references-search{position:relative;display:block;margin:0 0 15px}
.references-search>svg{position:absolute;left:12px;top:12px;color:#91a9c8;z-index:1;pointer-events:none}
.references-search-input{display:block;width:100%;height:40px;min-height:40px;padding:8px 11px 8px 35px!important;border:1px solid #ffffff26!important;border-radius:10px;background:#ffffff04!important;color:#edf4ff;font:inherit;font-size:12px!important;outline:none;box-shadow:none!important}
.references-search-input::placeholder{color:#75869e;opacity:1}
.references-search-input:focus{border-color:#42b9ff!important;box-shadow:0 0 0 3px #42b9ff18!important}
.references-list-head{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#91a9c8;font-size:11px;margin:0 0 3px}
.references-sorts{display:flex;gap:3px}
.reference-sort-button{border:0;background:none;border-radius:9px;color:#eef4ff;font-size:10px;font-weight:500;padding:7px 7px;min-height:29px;height:auto;line-height:1.2;white-space:nowrap}
.reference-sort-button:hover,.reference-sort-button[aria-pressed=true]{background:#ffffff18}
.reference-articles article{padding:17px 0 21px;border-bottom:1px solid var(--line)}
.reference-articles h3{margin:0;color:#eef4ff;font-size:15px;font-weight:650;line-height:1.48;letter-spacing:-.01em;overflow-wrap:anywhere}
.reference-authors{margin:9px 0 0;color:#91a9c8;font-size:12px;line-height:1.6}
.reference-meta{display:flex;flex-wrap:wrap;gap:4px 7px;margin-top:9px;color:#8399b8;font-size:10.5px;line-height:1.6}
.reference-links{display:flex;flex-wrap:wrap;gap:13px;margin-top:11px}
.reference-links a,.reference-details summary{color:#73d5ff;font-size:12px;font-weight:600;text-decoration:none;line-height:1.5}
.reference-links a:hover,.reference-details summary:hover{text-decoration:underline}
.reference-details{width:100%}
.reference-details summary{cursor:pointer;list-style:none;width:fit-content}
.reference-details summary::-webkit-details-marker{display:none}
.reference-details summary:focus-visible{outline:2px solid #42b9ff;outline-offset:4px;border-radius:2px}
.details-open{display:none}
.reference-details[open] .details-open{display:inline}
.reference-details[open] .details-closed{display:none}
.reference-expanded{margin-top:13px;padding-left:13px;border-left:1px solid #9d5cff70;color:#c6d0df;font-size:12px;line-height:1.75}
.reference-expanded p{margin:0 0 12px}
.reference-expanded p:last-child{margin-bottom:0}
.reference-keywords{color:#8ea2c0}
.references-source-note{margin:18px 0 0;color:#5f7594;font-size:10px;line-height:1.7}
.references-empty{padding:45px 10px;text-align:center;color:#91a9c8;font-size:12px}
.reference-clear{color:#73d5ff;background:none;border:0;font-size:12px}
@media(min-width:1700px){.workspace{grid-template-columns:minmax(0,1fr) 465px}.references-pane{padding:28px 26px}.references-selected h2{font-size:29px}.reference-articles h3{font-size:16px}.references-search-input{font-size:13px!important}}
@media(max-width:1150px) and (min-width:851px){.workspace{grid-template-columns:minmax(0,1fr) 370px}.references-pane{padding:22px 19px}.references-selected h2{font-size:24px}.references-stats{gap:8px}.references-stats dt{font-size:10px}.reference-sort-button{padding:7px;font-size:9.5px}.references-search-input{font-size:10.5px!important}.reference-articles h3{font-size:14px}}
@media(max-width:850px){.references-pane{overflow:visible;border-left:0;border-top:1px solid var(--line);padding:26px;min-height:400px}.references-selected h2{max-width:640px}.references-stats{max-width:480px}.references-preview-note{max-width:520px}.references-search{max-width:640px}.reference-articles{max-width:760px}.references-list-head{max-width:640px}}
@media(max-width:520px){.references-pane{padding:23px 18px}.references-selected h2{font-size:24px}.references-stats{gap:10px}.references-stats dt{font-size:10px}.reference-sort-button{font-size:10px;padding:7px 8px}.references-search-input{font-size:11px!important}}

ameter ranges + joint distributions + initial states"]}]},{id:"5",title:"Up-to-date and future AI-based applications in VCS",ideas:[{label:"Current applications",items:["Fault detection and diagnosis","Intelligent co-design","LLM agent collaboration","Image-assisted control"]},{label:"Future directions",items:["Generative design and physical-field generation","Multimodal digital twins","Distributed simulation and cloud\u2013edge computing"]}]},{id:"6",title:"Conclusions",ideas:["Physics integration + dynamic reliability + modular reuse","From predictive models to engineering applications"]}],fd=e=>1+(e.children??[]).reduce((a,t)=>a+fd(t),0);var md={checkedAt:"2026-08-31",stats:{sourceReferences:174,journalReferences:166,excludedReferences:8,withDOI:166,doiAdded:51,originalAbstracts:42,abstractSummaries:124,abstractUnavailable:0,unmappedReferences:[11]},papers:[{id:"ref-1",number:1,numbers:[1],type:"journal-article",title:"Artificial intelligence: A powerful paradigm for scientific research",authors:"Yongjun Xu; Xin Liu; Xin Cao; Changping Huang; Enke Liu; Sen Qian; Xingchen Liu; Yanjun Wu; Fengliang Dong; Cheng-Wei Qiu; Junjun Qiu; Keqin Hua; Wentao Su; Jian Wu; Huiyu Xu; Yong Han; Chenguang Fu; Zhigang Yin; Miao Liu; Ronald Roepman; Sabine Dietmann; Marko Virta; Fredrick Kengara; Ze Zhang; Lifu Zhang; Taolan Zhao; Ji Dai; Jialiang Yang; Liang Lan; Ming Luo; Zhaofeng Liu; Tao An; Bin Zhang; Xiao He; Shan Cong; Xiaohong Liu; Wei Zhang; James P. Lewis; James M. Tiedje; Qi Wang; Zhulin An; Fei Wang; Libo Zhang; Tao Huang; Chuan Lu; Zhipeng Cai; Fang Wang; Jiabao Zhang",journal:"The Innovation",year:2021,volume:"2",issue:"4",pages:"100179",doi:"10.1016/j.xinn.2021.100179",doiUrl:"https://doi.org/10.1016/j.xinn.2021.100179",citations:1670,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"Artificial intelligence (AI) coupled with promising machine learning (ML) techniques well known from computer science is broadly affecting many aspects of various fields including science and technology, industry, and even our day-to-day life. The ML techniques have been developed to analyze high-throughput data with a view to obtaining useful insights, categorizing, predicting, and making evidence-based decisions in novel ways, which will promote the growth of novel applications and fuel the sustainable booming of AI. This paper undertakes a comprehensive survey on the development and application of AI in different aspects of fundamental sciences, including information science, mathematics, medical science, materials science, geoscience, life science, physics, and chemistry. The challenges that each discipline of science meets, and the potentials of AI techniques to handle these challenges, are discussed in detail. Moreover, we shed light on new research trends entailing the integration of AI into each scientific discipline. The aim of this paper is to provide a broad research guideline on fundamental sciences with potential infusion of AI, to help motivate researchers to deeply understand the state-of-the-art applications of AI-based fundamental sciences, and thereby to help promote the continuous development of these fundamental sciences.",abstractKind:"abstract",abstractSource:"Open-license abstract",abstractUrl:"https://api.openalex.org/works/W3210165781",abstractLicense:"http://creativecommons.org/licenses/by-nc-nd/4.0/",keywords:[],sections:["1.1"],originalCitation:"Xu Y, Liu X, Cao X, Huang C, Liu E, Qian S, et al. Artificial intelligence: A powerful paradigm for scientific research. The Innovation. 2021;2(4):100179.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.xinn.2021.100179",note:"",isRetracted:!1},{id:"ref-3",number:3,numbers:[3],type:"journal-article",title:"Artificial intelligence for science\u2014bridging data to wisdom",authors:"Yongjun Xu; Fei Wang; Zhulin An; Qi Wang; Zhao Zhang",journal:"The Innovation",year:2023,volume:"4",issue:"6",pages:"100525",doi:"10.1016/j.xinn.2023.100525",doiUrl:"https://doi.org/10.1016/j.xinn.2023.100525",citations:43,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"Throughout the scientific discoveries of human history, research paradigms have undergone profound changes.1 As shown in Figure 1, from the empirical paradigm, which relies on experimental observation, to the theoretical paradigm, which is based on theoretical deduction, and further to the computational paradigm, which is associated with simulation and emulation, and finally to the data-driven paradigm, which is grounded in human-machine-object integration, every transformation of scientific paradigm has brought about a major leap in science and technology.",abstractKind:"abstract",abstractSource:"Open-license abstract",abstractUrl:"https://api.openalex.org/works/W4387731421",abstractLicense:"http://creativecommons.org/licenses/by-nc-nd/4.0/",keywords:[],sections:["1.1"],originalCitation:"Xu Y, Wang F, An Z, Wang Q, Zhang Z. Artificial intelligence for science\u2014bridging data to wisdom. The Innovation. 2023;4(6).",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.xinn.2023.100525",note:"",isRetracted:!1},{id:"ref-6",number:6,numbers:[6],type:"journal-article",title:"Field test of a ground-source heat pump system and numerical investigation on advanced control strategies",authors:"Yiming Li; Suxin Qian",journal:"Applied Thermal Engineering",year:2024,volume:"246",issue:"",pages:"123008",doi:"10.1016/j.applthermaleng.2024.123008",doiUrl:"https://doi.org/10.1016/j.applthermaleng.2024.123008",citations:14,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"A field study evaluates a ground-source heat-pump installation in an office building and identifies limitations in its existing circulation-pump control. An experimentally validated transient TRNSYS model is then used to test two load-predictive strategies that adjust water flow and supply temperature. The simulated strategies reduce energy consumption by approximately 9.9% and 11.0% relative to the baseline.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S1359431124006768",abstractLicense:"",keywords:[],sections:["1.1"],originalCitation:"Li Y, Qian S. Field test of a ground-source heat pump system and numerical investigation on advanced control strategies. Applied Thermal Engineering. 2024;246:123008.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.applthermaleng.2024.123008",note:"",isRetracted:!1},{id:"ref-7",number:7,numbers:[7],type:"journal-article",title:"Recent advances on performance enhancement of propane heat pump for heating applications",authors:"Lingeng Zou; Ye Liu; Jianlin Yu",journal:"Energy",year:2025,volume:"314",issue:"",pages:"134251",doi:"10.1016/j.energy.2024.134251",doiUrl:"https://doi.org/10.1016/j.energy.2024.134251",citations:44,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"This review assesses propane and propane-blend heat-pump water heaters, covering refrigerant selection, efficiency improvement, low-temperature operation, and safety. It compares enhancements involving subcooling, solar assistance, thermal storage, ejectors, vapor injection, and two-stage compression. The authors identify compact heat exchangers, lower refrigerant charge, suitable compressors, and low-temperature-slip blends as important routes toward efficient and safer R290 systems.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S0360544224040295",abstractLicense:"",keywords:[],sections:["1.1"],originalCitation:"Zou L, Liu Y, Yu J. Recent advances on performance enhancement of propane heat pump for heating applications. Energy. 2025;314(C).",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.energy.2024.134251",note:"",isRetracted:!1},{id:"ref-8",number:8,numbers:[8],type:"journal-article",title:"A modified dual-ejector enhanced dual-evaporator transcritical CO2 refrigeration cycle: 4E (Energy, Exergy, economic and Environmental) assessment",authors:"Lingeng Zou; Ye Liu; Mengqi Yu; Jianlin Yu",journal:"Energy Conversion and Management",year:2024,volume:"303",issue:"",pages:"118181",doi:"10.1016/j.enconman.2024.118181",doiUrl:"https://doi.org/10.1016/j.enconman.2024.118181",citations:85,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"A dual-ejector, dual-evaporator transcritical carbon-dioxide refrigeration cycle is compared with basic and single-ejector arrangements using energy, exergy, economic, and environmental criteria. The proposed cycle recovers expansion work, substantially raises cooling COP, and nearly eliminates expansion-valve exergy destruction. It also lowers unit exergy cost and carbon emissions, with particularly strong benefits at higher ambient or lower evaporating temperatures.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S0196890424001225",abstractLicense:"",keywords:[],sections:["1.1"],originalCitation:"Zou L, Liu Y, Yu M, Yu J. A modified dual-ejector enhanced dual-evaporator transcritical CO2 refrigeration cycle: 4E (Energy, Exergy, economic and Environmental) assessment. Energy Conversion and Management. 2024;303:118181.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.enconman.2024.118181",note:"",isRetracted:!1},{id:"ref-9",number:9,numbers:[9],type:"journal-article",title:"A review of the state-of-the-art data-driven modeling of building HVAC systems",authors:"Po-Ching Hsu; Lei Gao; Yunho Hwang; Reinard Radermacher",journal:"Energy and Buildings",year:2025,volume:"342",issue:"",pages:"115881",doi:"10.1016/j.enbuild.2025.115881",doiUrl:"https://doi.org/10.1016/j.enbuild.2025.115881",citations:20,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"An accurate model for a building's HVAC system plays an essential role in providing thermal comfort for the building while maintaining efficiency. Recent advancements in artificial intelligence, along with the development of tools in various programming languages and platforms, enable researchers to quickly implement these technologies to tackle challenges across different engineering fields. For building energy system modeling, machine learning (ML) and deep learning (DL) models are gaining attention due to their high accuracy and less modeling effort than physics-based white-box models. However, the data-driven model is less robust than the physics-based model due to the lack of physical interpretation. Therefore, a comprehensive review to summarize the latest progress of data-driven approaches in building energy systems is needed. This study addresses the limitation of the early review by 1) performing a comprehensive review of recent advancements in data-driven approaches for building HVAC systems modeling and highlighting key findings; 2) summarizing the attributes of various data types and sources used in data-driven models across different tasks; 3) identifying essential features for different HVAC systems and analyzing the strengths and weaknesses of the feature selection methods; 4) reviewing the state-of-the-art techniques like hybrid and physics-informed neural network (PINN) model which improve the explainability and prediction with limited data; and 5) evaluating recent hyperparameter tuning methods for data-driven models and offer practical recommendations. Based on the review on the papers published in the last 15 years and related to the topics mentioned above, potential future research directions in this field are proposed.",abstractKind:"abstract",abstractSource:"User-provided literature library",abstractUrl:"",abstractLicense:"",keywords:["HVAC","Data-driven model","Feature selection","Hyperparameter tuning","Machine learning","Deep learning"],sections:["1.1","2"],originalCitation:"Hsu P-C, Gao L, Hwang Y, Radermacher R. A review of the state-of-the-art data-driven modeling of building HVAC systems. Energy and Buildings. 2025:115881.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.enbuild.2025.115881",note:"",isRetracted:!1},{id:"ref-10",number:10,numbers:[10],type:"journal-article",title:"Recent developments in simulation techniques for vapour-compression refrigeration systems",authors:"Guo-liang Ding",journal:"International Journal of Refrigeration",year:2007,volume:"30",issue:"7",pages:"1119-1133",doi:"10.1016/j.ijrefrig.2007.02.001",doiUrl:"https://doi.org/10.1016/j.ijrefrig.2007.02.001",citations:180,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"This review traces the development of vapor-compression refrigeration simulation and summarizes models for evaporators, condensers, compressors, capillary tubes, and enclosures. It also discusses emerging techniques for refrigerant-property calculation, intelligent model-based simulation, and graph-based solution methods, before outlining prospective directions such as noise-field simulation, knowledge-engineering approaches, and nanofluid-property models.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S0140700707000357",abstractLicense:"",keywords:["Refrigeration","Compression system","Survey","Process","Modelling","Simulation","R\xE9frig\xE9ration","Syst\xE8me \xE0 compression","Enqu\xEAte","Proc\xE9d\xE9","Mod\xE9lisation"],sections:["1.1"],originalCitation:"Ding G-l. Recent developments in simulation techniques for vapour-compression refrigeration systems. International Journal of Refrigeration. 2007;30(7):1119-33.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.ijrefrig.2007.02.001",note:"",isRetracted:!1},{id:"ref-11",number:11,numbers:[11],type:"journal-article",title:"Comparison of approximation-assisted heat exchanger models for steady-state simulation of vapor compression system",authors:"Ransisi Huang; Jiazhen Ling; Vikrant Aute",journal:"Applied Thermal Engineering",year:2020,volume:"166",issue:"",pages:"114691",doi:"10.1016/j.applthermaleng.2019.114691",doiUrl:"https://doi.org/10.1016/j.applthermaleng.2019.114691",citations:10,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"Three fast heat-exchanger approximations were evaluated against finite-volume calculations: interpolation, Kriging, and a three-zone formulation assisted by Kriging. Tests covered five exchangers and three vapor-compression systems. The standalone Kriging approximation was the most accurate overall, while accelerated system calculations were between ten and six hundred times faster than the baseline, depending on operating conditions.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.semanticscholar.org/paper/2e139ca6c9ee69dbadd409b6cd08d593560e788e",abstractLicense:"",keywords:[],sections:[],originalCitation:"Huang R, Ling J, Aute V. Comparison of approximation-assisted heat exchanger models for steady-state simulation of vapor compression system. Applied Thermal Engineering. 2020;166:114691.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.applthermaleng.2019.114691",note:"Listed in the bibliography; no visible in-text citation was found. Not assigned to a section.",isRetracted:!1},{id:"ref-12",number:12,numbers:[12],type:"journal-article",title:"A co-simulation method of refrigerator system and temperature field",authors:"Shijie Xu; Min Wang; Lili Han; Shoujie Zhang; Jianlin Yu; Suxin Qian",journal:"Applied Thermal Engineering",year:2023,volume:"235",issue:"",pages:"121412",doi:"10.1016/j.applthermaleng.2023.121412",doiUrl:"https://doi.org/10.1016/j.applthermaleng.2023.121412",citations:13,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"A reduced-order temperature-field model links system-level refrigerator simulation with detailed CFD information. Time constants and temperature deviations extracted from CFD results extend a lumped cabinet model into spatial temperature distributions during transient operation. Measurements of pressures, power, and compartment temperatures validate the co-simulation approach, with most reported temperature errors remaining within a few degrees Celsius during pull-down and cycling operation.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S1359431123014412",abstractLicense:"",keywords:[],sections:["1.1","3.1.2"],originalCitation:"Xu S, Wang M, Han L, Zhang S, Yu J, Qian S. A co-simulation method of refrigerator system and temperature field. Applied Thermal Engineering. 2023;235:121412.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.applthermaleng.2023.121412",note:"",isRetracted:!1},{id:"ref-13",number:13,numbers:[13],type:"journal-article",title:"A data-driven model for heat pump water heater with wrap-around condenser coil in heating-up transients",authors:"Yiming Li; Shijie Xu; Leitao Fu; Yongzhang Liao; Shidong Pang; Suxin Qian",journal:"Applied Thermal Engineering",year:2025,volume:"275",issue:"",pages:"126856",doi:"10.1016/j.applthermaleng.2025.126856",doiUrl:"https://doi.org/10.1016/j.applthermaleng.2025.126856",citations:10,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"To simulate the heating-up transients in heat pump water heaters, the traditional approach used CFD software to simulate the transient flow and temperature fields inside the water tank, which usually took more than ten hours to complete one simulation. To balance the computational speed and simulation accuracy, a data-driven model for heat pump water heaters with wrap-around condenser coils was proposed in this study that can accommodate water tanks and condensers with different geometries and operating parameters. The natural convection heat transfer coefficient was fitted as an explicit function, and the water temperature evolution and distribution can be solved using the normalized temperature distribution database summarized in this work. Compared to the traditional CFD-based model, the proposed data-driven model reduced simulation time by four magnitudes while achieving an energy deviation of less than 1 %. The water temperature predicted by the data-driven model deviated from the experimental data by less than 2 degrees C, while the discrepancy in heating energy was under 3 %. These results indicated that the proposed data-driven model can accurately simulate the dynamic temperature evolution within the tank and the performance of the refrigeration system with trivial computational resources.",abstractKind:"abstract",abstractSource:"User-provided literature library",abstractUrl:"",abstractLicense:"",keywords:["Heat pump water heater","Data-driven model","Coupled model","Water temperature field","Transient simulation"],sections:["1.1"],originalCitation:"Li Y, Xu S, Fu L, Liao Y, Pang S, Qian S. A data-driven model for heat pump water heater with wrap-around condenser coil in heating-up transients. Applied Thermal Engineering. 2025:126856.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.applthermaleng.2025.126856",note:"",isRetracted:!1},{id:"ref-14",number:14,numbers:[14],type:"journal-article",title:"Physics-constrained neural network for chiller guided by reverse Carnot cycle analogy model with extrapolation ability",authors:"Hongrui Li; Hong Zheng; Tiexiao Xu; Bo Zhang; Lu Wang; Zhen Li",journal:"Energy",year:2025,volume:"339",issue:"",pages:"139099",doi:"10.1016/j.energy.2025.139099",doiUrl:"https://doi.org/10.1016/j.energy.2025.139099",citations:3,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"Amid growing global energy demand and rising building energy consumption, chillers, which are the core energy-consuming equipment in heating, ventilation, and air conditioning (HVAC) systems, require accurate modeling for energy efficiency optimization and carbon emission control. However, traditional white-box models are hardly practical due to complex structures and difficult parameter acquisition, while purely data-driven models lack physical mechanism support, leading to poor extrapolation beyond training data. Moreover, physics-constrained neural network methods used in existing studies are limited to simple physical information such as monotonicity and energy conservation. To address these problems, this study proposes a PhysicsConstrained Neural Network Guided by reverse Carnot cycle analogy model (PCNN-GC). A simplified mechanism model with correction factor is built and integrated into multiple physical constraints, forming a framework balancing physical consistency and data adaptability. The CoolProp library is connected with PyTorch for differentiable refrigerant thermophysical calculations and stable training. Validated via four extrapolation scenarios using actual operational data and benchmarked against Multilayer Perceptron (MLP), Random Forest (RF), and Support Vector Machine (SVM), the PCNN-GC demonstrates superior extrapolation capabilities and learning efficiency, achieving high accuracy with only three or four external data augmentation samples. Compared to the next-best model, it reduces the Mean Absolute Percentage Error (MAPE) and Root Mean Square Error (RMSE) by 26.7 % and 33.3 %, respectively, and increases the coefficient of determination (R2) by 1.76 times. Furthermore, standard deviations of the PCNN-GC's performance metrics across all extrapolation scenarios are significantly lower than those of the MLP, demonstrating its superior robustness.",abstractKind:"abstract",abstractSource:"User-provided literature library",abstractUrl:"",abstractLicense:"",keywords:["Chiller model","Deep learning","Physics-constrained neural network","Extrapolation ability","Loss function"],sections:["1.1","2.2.3","4.2"],originalCitation:"Li H, Zheng H, Xu T, Zhang B, Wang L, Li Z. Physics-constrained neural network for chiller guided by reverse Carnot cycle analogy model with extrapolation ability. Energy. 2025;339:139099.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.energy.2025.139099",note:"",isRetracted:!1},{id:"ref-15",number:15,numbers:[15],type:"journal-article",title:"Physics-informed neural networks: A deep learning framework for solving forward and inverse problems involving nonlinear partial differential equations",authors:"M. Raissi; P. Perdikaris; G.E. Karniadakis",journal:"Journal of Computational Physics",year:2019,volume:"378",issue:"",pages:"686-707",doi:"10.1016/j.jcp.2018.10.045",doiUrl:"https://doi.org/10.1016/j.jcp.2018.10.045",citations:18922,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"This paper introduces neural-network solvers that combine observed data with differential-equation constraints during training. It addresses both prediction with known equations and identification of unknown equations or parameters. Continuous-time and time-discretized formulations are demonstrated on several nonlinear physical systems, establishing a framework for learning from limited measurements while incorporating governing physics.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.semanticscholar.org/paper/d86084808994ac54ef4840ae65295f3c0ec4decd",abstractLicense:"",keywords:[],sections:["1.1","2.1","2.2"],originalCitation:"Raissi M, Perdikaris P, Karniadakis GE. Physics-informed neural networks: A deep learning framework for solving forward and inverse problems involving nonlinear partial differential equations. Journal of Computational Physics. 2019;378:686-707.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.jcp.2018.10.045",note:"",isRetracted:!1},{id:"ref-16",number:16,numbers:[16],type:"journal-article",title:"Large language models for building energy applications: Opportunities and challenges",authors:"Mingzhe Liu; Liang Zhang; Jianli Chen; Wei-An Chen; Zhiyao Yang; L. James Lo; Jin Wen; Zheng O\u2019Neill",journal:"Building Simulation",year:2025,volume:"18",issue:"2",pages:"225-234",doi:"10.1007/s12273-025-1235-9",doiUrl:"https://doi.org/10.1007/s12273-025-1235-9",citations:95,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"This perspective examines how large language models could assist building-energy modeling, operational decisions, and fault diagnosis. It also considers practical barriers, including computation, data preparation, and the need for domain expertise. The authors outline a development path combining contextual prompting, specialized training, retrieval of relevant information, and multimodal inputs.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://pure.psu.edu/en/publications/large-language-models-for-building-energy-applications-opportunit/",abstractLicense:"",keywords:[],sections:["1.1"],originalCitation:"Liu M, Zhang L, Chen J, Chen W-A, Yang Z, Lo LJ, et al. Large language models for building energy applications: Opportunities and challenges. Conference Large language models for building energy applications: Opportunities and challenges,  vol. 18. Springer, p. 225-34.",metadataUrl:"https://api.crossref.org/works/10.1007%2Fs12273-025-1235-9",note:"Listed as a conference item in the manuscript export; verified as a Building Simulation journal article.",isRetracted:!1},{id:"ref-17",number:17,numbers:[17],type:"journal-article",title:"Physics-informed neural network-based model predictive control for chiller plant \u2013 fan coil unit system and intelligent human-AI interaction via large language model",authors:"Xinbin Liang; Siliang Chen; Zhuyun Mao; Xilin Li; Xinqiao Jin; Zhimin Du",journal:"Energy",year:2025,volume:"339",issue:"",pages:"139149",doi:"10.1016/j.energy.2025.139149",doiUrl:"https://doi.org/10.1016/j.energy.2025.139149",citations:5,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"The advanced building control technology, like model predictive control (MPC), can achieve significant energy savings and mitigate greenhouse gas emissions for heating, ventilation, and air conditioning (HVAC) system. In this study, we propose a novel MPC controller for chiller plant-fan coil unit system. The overall method includes three folds. First, a physics-informed neural network (PINN) is proposed to predict the dynamic of chilled water return temperature. Combing data and physics knowledge, the proposed PINN model has good generalization performance and it can capture the dynamic of chilled water temperature through black-box module and physics module. Second, the developed PINN model is employed in an MPC controller as its system dynamic model (state-space model). And the overall optimization problem is formulated as a mixed-integer linear programming (MILP) to minimize system total power and user discomfort. Third, an AI agent is developed based on large language model (LLM) to automatically tune the parameters of MPC controller based on operator's feedback. The system operators don't need to know about any piece of MPC controller, while the AI agent can understand the content of MPC controller and interact with operators. Comprehensive experiments are conducted to validate the proposed method using real-world data. The results showed that the PINN outperformed pure black-box model for a large margin. And the ideal MPC controller achieved 8.4 % energy savings comparing with rule-based control. The AI agent correctly tuned the MPC parameters in five scenarios, and the average cost was only",abstractKind:"abstract",abstractSource:"User-provided literature library",abstractUrl:"",abstractLicense:"",keywords:["Chiller plant","Model predictive control","Physics-informed neural network","Large language model","AI agent"],sections:["1.1","2.2.1","5"],originalCitation:"Liang X, Chen S, Mao Z, Li X, Jin X, Du Z. Physics-informed neural network-based model predictive control for chiller plant \u2013 fan coil unit system and intelligent human-AI interaction via large language model. Energy. 2025;339:139149.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.energy.2025.139149",note:"",isRetracted:!1},{id:"ref-18",number:18,numbers:[18],type:"journal-article",title:"Applications of artificial neural networks for refrigeration, air-conditioning and heat pump systems\u2014A review",authors:"M. Mohanraj; S. Jayaraj; C. Muraleedharan",journal:"Renewable and Sustainable Energy Reviews",year:2012,volume:"16",issue:"2",pages:"1340-1358",doi:"10.1016/j.rser.2011.10.015",doiUrl:"https://doi.org/10.1016/j.rser.2011.10.015",citations:420,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"This review examines more than ninety studies applying neural networks to refrigeration, air conditioning, and heat pumps. It organizes the literature by system technology, component modeling, refrigerant properties, control, and related thermal applications. The authors assess energy and exergy prediction, discuss model limitations, and report that neural networks can provide useful accuracy across these applications.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.semanticscholar.org/paper/a2c3a14be9fa74a8d853f9f80e0473c104bc4cba",abstractLicense:"",keywords:[],sections:["1.2"],originalCitation:"Mohanraj M, Jayaraj S, Muraleedharan C. Applications of artificial neural networks for refrigeration, air-conditioning and heat pump systems\u2014A review. Renewable and sustainable energy reviews. 2012;16(2):1340-58.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.rser.2011.10.015",note:"",isRetracted:!1},{id:"ref-19",number:19,numbers:[19],type:"journal-article",title:"Artificial intelligence techniques in refrigeration system modelling and optimization: A multi-disciplinary review",authors:"Rasel Ahmed; Shuhaimi Mahadzir; Nor Erniza Mohammad Rozali; Kallol Biswas; Fahad Matovu; Kamran Ahmed",journal:"Sustainable Energy Technologies and Assessments",year:2021,volume:"47",issue:"",pages:"101488",doi:"10.1016/j.seta.2021.101488",doiUrl:"https://doi.org/10.1016/j.seta.2021.101488",citations:77,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"Refrigeration systems currently utilize 17% of total electric energy, and this consumption is expected to increase by more than 30% by 2050. Moreover, these systems significantly contribute to global warming (10%) and environmental degradation. Optimization of these systems can overcome these critical issues, increase thermal efficiency, and decrease the total cost. Refrigeration system optimization problems are complex, multi-modal, non-linear, and time-consuming. Both classic and non-classic (computational intelligence (CI)) methods are successfully applied to overcome these challenges. This comprehensive review presents state-of-the-art theory and application of the most widely used CI techniques such as GA, PSO, SA, DE, HTS, CRO, MOGA, and NSGA II in the optimization of various refrigeration systems. The properties of these algorithms, their computational efficiency, robustness, and applications are highlighted most. Additionally, the authors discuss several surrogate modelling techniques and their applications in refrigeration systems, including ANN, RSM, and regression analysis. According to trend analysis, the major cost function to optimize is the COP, followed by total cost, exergetic efficiency, energy consumption, and cooling capacity. Subsequently, the application of CI approaches has increased dramatically in the optimization of refrigeration systems, where GA and its variants are typically used, and authors are more interested in multi-objective optimization.",abstractKind:"abstract",abstractSource:"User-provided literature library",abstractUrl:"",abstractLicense:"",keywords:["Refrigeration Systems Modelling and","Optimization","Deterministic and Stochastic Optimization","Computational Intelligence","Genetic Algorithm","Artificial Neural Network"],sections:["1.2"],originalCitation:"Ahmed R, Mahadzir S, Rozali NEM, Biswas K, Matovu F, Ahmed K. Artificial intelligence techniques in refrigeration system modelling and optimization: A multi-disciplinary review. Sustainable Energy Technologies and Assessments. 2021;47:101488.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.seta.2021.101488",note:"",isRetracted:!1},{id:"ref-20",number:20,numbers:[20],type:"journal-article",title:"A review of data-driven fault detection and diagnostics for building HVAC systems",authors:"Zhelun Chen; Zheng O\u2019Neill; Jin Wen; Ojas Pradhan; Tao Yang; Xing Lu; Guanjing Lin; Shohei Miyata; Seungjae Lee; Chou Shen; Roberto Chiosa; Marco Savino Piscitelli; Alfonso Capozzoli; Franz Hengel; Alexander K\xFChrer; Marco Pritoni; Wei Liu; John Clau\xDF; Yimin Chen; Terry Herr",journal:"Applied Energy",year:2023,volume:"339",issue:"",pages:"121030",doi:"10.1016/j.apenergy.2023.121030",doiUrl:"https://doi.org/10.1016/j.apenergy.2023.121030",citations:299,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"This review organizes data-driven HVAC fault detection and diagnosis as a workflow spanning collection, cleaning, preprocessing, baseline construction, detection, diagnosis, and possible prognosis. It compares studied equipment, fault types, data sources, methods, and evaluation metrics. Remaining barriers include deployment in real buildings, benchmarking, scalability, transferability, interpretability, cybersecurity, privacy, and user experience.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S030626192300394X",abstractLicense:"",keywords:[],sections:["1.2"],originalCitation:"Chen Z, O\u2019Neill Z, Wen J, Pradhan O, Yang T, Lu X, et al. A review of data-driven fault detection and diagnostics for building HVAC systems. Applied Energy. 2023;339:121030.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.apenergy.2023.121030",note:"",isRetracted:!1},{id:"ref-21",number:21,numbers:[21],type:"journal-article",title:"Artificial intelligence models for refrigeration, air conditioning and heat pump systems",authors:"D.S. Adelekan; O.S. Ohunakin; B.S. Paul",journal:"Energy Reports",year:2022,volume:"8",issue:"",pages:"8451-8466",doi:"10.1016/j.egyr.2022.06.062",doiUrl:"https://doi.org/10.1016/j.egyr.2022.06.062",citations:71,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"Artificial intelligence (AI) models for refrigeration, heat pumps, and air conditioners have emerged in recent decades. The universal approximation accuracy and prediction performances of various AI structures like feedforward neural networks, radial basis function neural networks, adaptive neuro-fuzzy inference and recurrent neural networks are encouraging interest. This review discusses existing topographies of neural network models for RHVAC system modelling, energy prediction and fault(s), and detection and diagnosis. Studies show that AI structures require standardization and improvement for tuning hyperparameters (like weight, bias, activation functions, number of hidden layers and neurons). The selection of activation functions, validation, and learning algorithms depends on author's suitability for a particular application. Backpropagation, error trial selection of the number of hidden layer, and hidden layers' neurons, and Levenberg-Marquardt learning algorithms, remain prevalent methodologies for developing AI structures. The major limitations to the application of AI models in RHVAC systems include exploding or/and vanishing gradients, interpretability, and accuracy trade off, and training saturation and limited sensitivity. This review aims to give up-to-date applications of different AI architectures in RHVAC systems and to identify the associated limitations and prospects. (C) 2022 The Author(s). Published by Elsevier Ltd.",abstractKind:"abstract",abstractSource:"User-provided literature library",abstractUrl:"",abstractLicense:"",keywords:["Artificial neural network","Adaptive neuro fuzzy inference system","Radial basis function","Recurrent neural network","Refrigerator","Heat pump","Air conditioners"],sections:["1.2"],originalCitation:"Adelekan D, Ohunakin O, Paul B. Artificial intelligence models for refrigeration, air conditioning and heat pump systems. Energy Reports. 2022;8:8451-66.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.egyr.2022.06.062",note:"",isRetracted:!1},{id:"ref-22",number:22,numbers:[22],type:"journal-article",title:"Large Language Models Meet Energy Systems: Opportunities, Challenges, and Future Perspectives",authors:"Chaobo Zhang; Jian Zhang; Jie Lu; Yang Zhao",journal:"Applied Energy",year:2026,volume:"403",issue:"",pages:"127076",doi:"10.1016/j.apenergy.2025.127076",doiUrl:"https://doi.org/10.1016/j.apenergy.2025.127076",citations:28,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"The review examines how large language models are being applied to energy systems. It compares 22 model families, five adaptation approaches, and thirteen potential system roles, including maintenance, advice, programming, and modeling. Prompt engineering, retrieval, fine-tuning, multimodal integration, and autonomous agents are discussed alongside practical limitations, research opportunities, and eight proposed future directions.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S0306261925018069",abstractLicense:"",keywords:[],sections:["1.2"],originalCitation:"Zhang C, Zhang J, Lu J, Zhao Y. Large language models meet energy systems: Opportunities, challenges, and future perspectives. Applied Energy. 2026;403:127076.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.apenergy.2025.127076",note:"",isRetracted:!1},{id:"ref-23",number:23,numbers:[23],type:"journal-article",title:"A review on hybrid physics and data-driven modeling methods applied in air source heat pump systems for energy efficiency improvement",authors:"Yanhua Guo; Ningbo Wang; Shuangquan Shao; Congqi Huang; Zhentao Zhang; Xiaoqiong Li; Youdong Wang",journal:"Renewable and Sustainable Energy Reviews",year:2024,volume:"204",issue:"",pages:"114804",doi:"10.1016/j.rser.2024.114804",doiUrl:"https://doi.org/10.1016/j.rser.2024.114804",citations:40,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:'Purely data-driven modeling methods exhibit inherent "black box" characteristics when applied to the air source heat pump (ASHP) systems for energy efficiency improvement (EEI). Therefore, hybrid physics and data-driven modeling (HPDM) methods have been developed to enhance model interpretability, transparency, and generalizability. The comprehensive and systematic application of HPDM methods in ASHP systems for EEI are reviewed in this work. Firstly, recognizing the combined methods of data-driven and physical information, they are categorized as three essential types: (1) knowledge-infused data, (2) physics-guided modeling, and (3) physics-embedded loss. Secondly, three types of HPDM applied in the important sides (knowledge discovery, building load prediction, faults detection and diagnosis) of the ASHP systems for EEI are reviewed, and the superiority and bottleneck of HPDM in addressing issues in different application scenarios are summarized. Finally, the prospective directions and challenges of HPDM applied in the ASHP systems for EEI are discussed from the perspective of data acquirement and privacy protection, HPDM construction, real-model integration and implementation, method scalability and transferability for the future research reference.',abstractKind:"abstract",abstractSource:"User-provided literature library",abstractUrl:"",abstractLicense:"",keywords:["Air source heat pump","Efficiency improvement","Hybrid","Data-driven","Interpretability"],sections:["1.2","2.4.1"],originalCitation:"Guo Y, Wang N, Shao S, Huang C, Zhang Z, Li X, et al. A review on hybrid physics and data-driven modeling methods applied in air source heat pump systems for energy efficiency improvement. Renewable and Sustainable Energy Reviews. 2024;204:114804.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.rser.2024.114804",note:"",isRetracted:!1},{id:"ref-24",number:24,numbers:[24],type:"journal-article",title:"Software survey: VOSviewer, a computer program for bibliometric mapping",authors:"Nees Jan van Eck; Ludo Waltman",journal:"Scientometrics",year:2010,volume:"84",issue:"2",pages:"523-538",doi:"10.1007/s11192-009-0146-3",doiUrl:"https://doi.org/10.1007/s11192-009-0146-3",citations:20920,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"We present VOSviewer, a freely available computer program that we have developed for constructing and viewing bibliometric maps. Unlike most computer programs that are used for bibliometric mapping, VOSviewer pays special attention to the graphical representation of bibliometric maps. The functionality of VOSviewer is especially useful for displaying large bibliometric maps in an easy-to-interpret way. The paper consists of three parts. In the first part, an overview of VOSviewer's functionality for displaying bibliometric maps is provided. In the second part, the technical implementation of specific parts of the program is discussed. Finally, in the third part, VOSviewer's ability to handle large maps is demonstrated by using the program to construct and display a co-citation map of 5,000 major scientific journals.",abstractKind:"abstract",abstractSource:"Open-license abstract",abstractUrl:"https://api.openalex.org/works/W2150220236",abstractLicense:"http://creativecommons.org/licenses/by-nc/2.0",keywords:[],sections:["1.3"],originalCitation:"Van Eck NJ, Waltman L. Software survey: VOSviewer, a computer program for bibliometric mapping. scientometrics. 2010;84(2):523-38.",metadataUrl:"https://api.crossref.org/works/10.1007%2Fs11192-009-0146-3",note:"",isRetracted:!1},{id:"ref-25",number:25,numbers:[25],type:"journal-article",title:"Physics-informed neural network for chiller plant optimal control with structure-type and trend-type prior knowledge",authors:"Xinbin Liang; Ying Liu; Siliang Chen; Xilin Li; Xinqiao Jin; Zhimin Du",journal:"Applied Energy",year:2025,volume:"390",issue:"",pages:"125857",doi:"10.1016/j.apenergy.2025.125857",doiUrl:"https://doi.org/10.1016/j.apenergy.2025.125857",citations:32,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"A general physics-informed framework improves the extrapolation of energy models used for HVAC optimal control. Equation structure is embedded in network architecture, while known trends are enforced through an additional training loss. Applied to pumps, cooling towers, and chillers in a commercial building, both forms of prior knowledge outperform gray-box and purely data-driven alternatives outside the training range; field control tests report a 23.2% efficiency improvement.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S0306261925005872",abstractLicense:"",keywords:[],sections:["2","2.2.2"],originalCitation:"Liang X, Liu Y, Chen S, Li X, Jin X, Du Z. Physics-informed neural network for chiller plant optimal control with structure-type and trend-type prior knowledge. Applied Energy. 2025;390:125857.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.apenergy.2025.125857",note:"",isRetracted:!1},{id:"ref-26",number:26,numbers:[26],type:"journal-article",title:"Deep learning and transfer learning models of energy consumption forecasting for a building with poor information data",authors:"Yuan Gao; Yingjun Ruan; Chengkuan Fang; Shuai Yin",journal:"Energy and Buildings",year:2020,volume:"223",issue:"",pages:"110156",doi:"10.1016/j.enbuild.2020.110156",doiUrl:"https://doi.org/10.1016/j.enbuild.2020.110156",citations:264,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"The study addresses building-energy forecasting when the target building has little historical data. Two architectures, an encoder-decoder sequence model and an attention-equipped two-dimensional convolutional model, are combined with transfer learning. Tests on three office buildings show substantial accuracy improvements over a conventional LSTM trained with similarly limited target-building information.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.semanticscholar.org/paper/c2d40bf798fbeaf0dbf5152e58ac233d1bb92acd",abstractLicense:"",keywords:[],sections:["2"],originalCitation:"Gao Y, Ruan Y, Fang C, Yin S. Deep learning and transfer learning models of energy consumption forecasting for a building with poor information data. Energy and Buildings. 2020;223:110156.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.enbuild.2020.110156",note:"",isRetracted:!1},{id:"ref-27",number:27,numbers:[27],type:"journal-article",title:"Performance assessment of a hybrid vapor compression-thermoelectric refrigeration system using machine learning models",authors:"Ali M. Ashour; Ayad M. Al Jubori; Adri\xE1n Mota-Babiloni; Hayder Mohsin Ali; Hamzah M. Jaffar; Abdallah Bouabidi",journal:"Energy Conversion and Management",year:2026,volume:"348",issue:"",pages:"120627",doi:"10.1016/j.enconman.2025.120627",doiUrl:"https://doi.org/10.1016/j.enconman.2025.120627",citations:1,citationSource:"Local Web of Science export \xB7 snapshot",abstract:"In this study, a hybrid refrigeration configuration was developed by integrating thermoelectric cooling (TEC) modules with a conventional vapor compression refrigeration (VCR) system to achieve lower temperatures in a freezer compartment. Experimental tests were conducted under various conditions, with the TEC voltage varied between 5.5 and 7.5 V, as determined by initial trials, to achieve optimal performance. Three airflow rates (0, 0.4, and 1.2 m/s) were used within the freezer to represent natural and forced convection modes. A regulated DC voltage source supplied TEC modules. The hot side heat of the TEC was transferred to the refrigerant via an aluminum heat exchanger, with a cold side heat sink and fans being employed. To predict system performance, five artificial intelligence models were developed, including Artificial Neural Network (ANN), Random Forest (RF), Extreme Gradient Boosting (XGB), AdaBoost (AB), and k-Nearest Neighbor (KNN). Among them, the Artificial Neural Network model was the most accurate, with R2 values exceeding 0.98 and the lowest mean absolute error (MAE) in forecasting all variables. Experimentally, the interior chamber temperature decreased from approximately -26 degrees C under static air conditions to -30.5 degrees C with a 7.5 V TEC voltage and 1.2 m/s airflow. Furthermore, the cold side temperature increased from -37.5 degrees C at 0 m/s to -34 degrees C at 1.2 m/s for the lowest voltage of 5.5 V, indicating a 3.5 degrees C decrease. The maximum COP of 0.96 was achieved at 5.5 V and decreased with increasing voltage, indicating a trade-off between increased cooling power and efficiency. This hybrid strategy presents a promising route for sustainable and effective use in sustainable refrigeration systems, especially for achieving ultra-low temperatures while maintaining controlled heat rejection.",abstractKind:"abstract",abstractSource:"User-provided literature library",abstractUrl:"",abstractLicense:"",keywords:["Hybrid Refrigeration System","Thermoelectric Cooling (TEC)","Vapor Compression Cycle (VCR)","Machine Learning Models","COP"],sections:["2.1"],originalCitation:"Ashour AM, Al Jubori AM, Mota-Babiloni A, Ali HM, Jaffar HM, Bouabidi A. Performance assessment of a hybrid vapor compression-thermoelectric refrigeration system using machine learning models. Energy Conversion and Management. 2026;348:120627.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.enconman.2025.120627",note:"",isRetracted:!1},{id:"ref-28",number:28,numbers:[28],type:"journal-article",title:"Enhance data-driven models for chiller plants by integrating empirical knowledge",authors:"Qilin Zhang; Yue Yuan; Zhiyuan Wang; Xiangrui Wang; Yixing Chen",journal:"Journal of Building Engineering",year:2025,volume:"111",issue:"",pages:"113475",doi:"10.1016/j.jobe.2025.113475",doiUrl:"https://doi.org/10.1016/j.jobe.2025.113475",citations:1,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"Chiller plants account for the majority of the energy consumption of heating, ventilation, and airconditioning (HVAC) systems in buildings. Therefore, it is crucial to accurately predict chiller performance such as energy consumption during the operation period. This paper proposed a novel data-driven modeling approach for chiller plants that incorporates empirical knowledge to improve prediction accuracy and generalization. The method is particularly effective in predicting chiller power consumption and leaving cooling water temperature under unknown operating conditions. Three machine learning algorithms, eXtreme Gradient Boosting (XGBoost), Random Forest (RF) and Artificial Neural Network (ANN), were selected to analyze the generalization performance of original data-driven models for unknown operating data prediction. Then, ten empirical chiller models from EnergyPlus were selected to generate physics-based datasets with specific data volume to assist the original model predictions individually. This study further evaluated the impact of different volumes of generated dataset using the most effective among ten empirical models. Results showed that, with appropriate empirical model assistance and a suitable data volume of generated dataset, the average CVRMSE of chiller power prediction decreased from 8.44 % to 3.04 %. Meanwhile, the average RMSE for leaving cooling water temperature prediction decreased from 1.36 degrees C to 0.27 degrees C. The results demonstrated the proposed method had the potential to improve the accuracy and generalization of data-driven models for chiller plants.",abstractKind:"abstract",abstractSource:"User-provided literature library",abstractUrl:"",abstractLicense:"",keywords:["Chiller plant","Data-driven model","Empirical knowledge integration","Machine learning","Extrapolation ability"],sections:["2.1"],originalCitation:"Zhang Q, Yuan Y, Wang Z, Wang X, Chen Y. Enhance data-driven models for chiller plants by integrating empirical knowledge. Journal of Building Engineering. 2025;111:113475.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.jobe.2025.113475",note:"",isRetracted:!1},{id:"ref-29",number:29,numbers:[29],type:"journal-article",title:"Study on data augmentation with physics-informed generative adversarial networks and the extrapolation performance of COP prediction for chillers",authors:"Zhengyang Wang; Jun Chen; Kexin Guo; Bo Xu; Zhenqian Chen",journal:"Energy Conversion and Management",year:2025,volume:"346",issue:"",pages:"120418",doi:"10.1016/j.enconman.2025.120418",doiUrl:"https://doi.org/10.1016/j.enconman.2025.120418",citations:8,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"The study evaluates chiller COP extrapolation across 13 tasks built from the ASHRAE-1043 dataset and introduces a physics-informed Wasserstein GAN for data augmentation. Thermodynamic monotonicity constraints help generate plausible boundary-region samples, reducing severe extrapolation errors while retaining an explicit polynomial predictor suitable for industrial control and optimization.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S0196890425009422",abstractLicense:"",keywords:["Data augmentation","prediction","Uncertainty quantification","Generative adversarial network","Physics-informed neural network"],sections:["2.1","2.2.2","4.2"],originalCitation:"Wang Z, Chen J, Guo K, Xu B, Chen Z. Study on data augmentation with physics-informed generative adversarial networks and the extrapolation performance of COP prediction for chillers. Energy Conversion and Management. 2025;346:120418.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.enconman.2025.120418",note:"",isRetracted:!1},{id:"ref-30",number:30,numbers:[30],type:"journal-article",title:"Hybrid model using Bayesian neural network for variable refrigerant flow system",authors:"Ki Uhn Ahn; Cheol Soo Park; Kyung-Jae Kim; Deuk-Woo Kim; Chang-U Chae",journal:"Journal of Building Performance Simulation",year:2022,volume:"15",issue:"1",pages:"1-20",doi:"10.1080/19401493.2021.1992013",doiUrl:"https://doi.org/10.1080/19401493.2021.1992013",citations:19,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"This study introduces a hybrid model that combines physics and machine learning (ML) models to describe the behaviour of variable refrigerant flow (VRF) systems. The standalone ML model was developed with identical data and conditions for comparison between the hybrid and ML models. A Bayesian neural network (BNN) was used for both the models, and the predictive abilities and uncertainties were investigated. For the experimental dataset, the predictive performances of both models were similar. For example, the predictive performance of the hybrid and ML models showed mean absolute error of 0.73 and 0.78 kW, respectively. However, the epistemic uncertainty of the hybrid model quantified using the BNN was 36.4% lower than that of the ML model. A parametric study showed that the hybrid model combined with the physics model can achieve better generalization performance than the ML model, yielding results that are more reliable and physically explainable.",abstractKind:"abstract",abstractSource:"User-provided literature library",abstractUrl:"",abstractLicense:"",keywords:["Machine learning","hybrid model","Bayesian neural network","variable refrigerant flow system"],sections:["2.1"],originalCitation:"Ahn KU, Park CS, Kim K-J, Kim D-W, Chae C-U. Hybrid model using Bayesian neural network for variable refrigerant flow system. Journal of Building Performance Simulation. 2022;15(1):1-20.",metadataUrl:"https://api.crossref.org/works/10.1080%2F19401493.2021.1992013",note:"",isRetracted:!1},{id:"ref-31",number:31,numbers:[31],type:"journal-article",title:"Imperfect physics-guided neural networks",authors:"Allan Carter; Syed Imtiaz; Greg Naterer",journal:"Chemical Engineering Science",year:2025,volume:"305",issue:"",pages:"121153",doi:"10.1016/j.ces.2024.121153",doiUrl:"https://doi.org/10.1016/j.ces.2024.121153",citations:2,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"This work examines how imperfect engineering models affect physics-guided neural networks for fault detection in nonlinear dynamical systems. Augmenting measurements with reliable physics-based estimates can markedly outperform an unguided network, but even modest model inaccuracies can sharply degrade detection performance. The findings emphasize that physics guidance is only as dependable as the underlying model and system representation.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S0009250924014532",abstractLicense:"",keywords:[],sections:["2.1"],originalCitation:"Carter A, Imtiaz S, Naterer G. Imperfect physics-guided neural networks. Chemical Engineering Science. 2025;305:121153.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.ces.2024.121153",note:"",isRetracted:!1},{id:"ref-32",number:32,numbers:[32],type:"journal-article",title:"Physics\u2010Informed Deep Neural Networks for Learning Parameters and Constitutive Relationships in Subsurface Flow Problems",authors:"A. M. Tartakovsky; C. Ortiz Marrero; Paris Perdikaris; G. D. Tartakovsky; D. Barajas\u2010Solano",journal:"Water Resources Research",year:2020,volume:"56",issue:"5",pages:"e2019WR026731",doi:"10.1029/2019wr026731",doiUrl:"https://doi.org/10.1029/2019wr026731",citations:508,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"Neural networks are trained with pressure or hydraulic-head observations and residuals of the governing flow equations to infer subsurface conductivity. The formulation covers both saturated and unsaturated conditions. Numerical tests show that physical constraints improve estimates from sparse measurements and can recover otherwise unobserved constitutive relationships, including when observations contain noise.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://api.crossref.org/works/10.1029%2F2019wr026731",abstractLicense:"",keywords:[],sections:["2.1","3.2.2"],originalCitation:"Tartakovsky AM, Marrero CO, Perdikaris P, Tartakovsky GD, Barajas\u2010Solano D. Physics\u2010informed deep neural networks for learning parameters and constitutive relationships in subsurface flow problems. Water Resources Research. 2020;56(5):e2019WR026731.",metadataUrl:"https://api.crossref.org/works/10.1029%2F2019wr026731",note:"",isRetracted:!1},{id:"ref-33",number:33,numbers:[33],type:"journal-article",title:"When and why PINNs fail to train: A neural tangent kernel perspective",authors:"Sifan Wang; Xinling Yu; Paris Perdikaris",journal:"Journal of Computational Physics",year:2022,volume:"449",issue:"",pages:"110768",doi:"10.1016/j.jcp.2021.110768",doiUrl:"https://doi.org/10.1016/j.jcp.2021.110768",citations:1347,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"The authors analyze optimization failures in physics-informed neural networks through neural tangent kernels. Their analysis identifies unequal learning rates among the components of the training loss as a source of poor convergence. An adaptive optimization procedure uses kernel spectral information to rebalance these components, with numerical experiments supporting both the analysis and the proposed remedy.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.semanticscholar.org/paper/52b975170b33e19855b2970b2e978fa3ea786465",abstractLicense:"",keywords:[],sections:["2.1"],originalCitation:"Wang S, Yu X, Perdikaris P. When and why PINNs fail to train: A neural tangent kernel perspective. Journal of Computational Physics. 2022;449:110768.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.jcp.2021.110768",note:"",isRetracted:!1},{id:"ref-34",number:34,numbers:[34],type:"journal-article",title:"Can physics-informed neural networks beat the finite element method?",authors:"Tamara G Grossmann; Urszula Julia Komorowska; Jonas Latz; Carola-Bibiane Sch\xF6nlieb",journal:"IMA Journal of Applied Mathematics",year:2024,volume:"89",issue:"1",pages:"143-174",doi:"10.1093/imamat/hxae011",doiUrl:"https://doi.org/10.1093/imamat/hxae011",citations:204,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"Abstract Partial differential equations (PDEs) play a fundamental role in the mathematical modelling of many processes and systems in physical, biological and other sciences. To simulate such processes and systems, the solutions of PDEs often need to be approximated numerically. The finite element method, for instance, is a usual standard methodology to do so. The recent success of deep neural networks at various approximation tasks has motivated their use in the numerical solution of PDEs. These so-called physics-informed neural networks and their variants have shown to be able to successfully approximate a large range of PDEs. So far, physics-informed neural networks and the finite element method have mainly been studied in isolation of each other. In this work, we compare the methodologies in a systematic computational study. Indeed, we employ both methods to numerically solve various linear and nonlinear PDEs: Poisson in 1D, 2D and 3D, Allen\u2013Cahn in 1D, semilinear Schr\xF6dinger in 1D and 2D. We then compare computational costs and approximation accuracies. In terms of solution time and accuracy, physics-informed neural networks have not been able to outperform the finite element method in our study. In some experiments, they were faster at evaluating the solved PDE.",abstractKind:"abstract",abstractSource:"Open-license abstract",abstractUrl:"https://api.crossref.org/works/10.1093%2Fimamat%2Fhxae011",abstractLicense:"https://creativecommons.org/licenses/by/4.0/",keywords:[],sections:["2.1"],originalCitation:"Grossmann TG, Komorowska UJ, Latz J, Sch\xF6nlieb C-B. Can physics-informed neural networks beat the finite element method? IMA Journal of Applied Mathematics. 2024;89(1):143-74.",metadataUrl:"https://api.crossref.org/works/10.1093%2Fimamat%2Fhxae011",note:"",isRetracted:!1},{id:"ref-35",number:35,numbers:[35],type:"journal-article",title:"Physics-informed machine learning",authors:"George Em Karniadakis; Ioannis G. Kevrekidis; Lu Lu; Paris Perdikaris; Sifan Wang; Liu Yang",journal:"Nature Reviews Physics",year:2021,volume:"3",issue:"6",pages:"422-440",doi:"10.1038/s42254-021-00314-5",doiUrl:"https://doi.org/10.1038/s42254-021-00314-5",citations:7620,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"This review surveys ways to combine physical models with machine learning for prediction and inverse analysis. It discusses the use of governing equations, physical constraints, and purpose-designed network structures alongside noisy observations. Applications include identifying unknown physics and solving high-dimensional problems, with attention to the capabilities and limitations of current approaches.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://pure.johnshopkins.edu/en/publications/physics-informed-machine-learning/",abstractLicense:"",keywords:[],sections:["2.2"],originalCitation:"Karniadakis GE, Kevrekidis IG, Lu L, Perdikaris P, Wang S, Yang L. Physics-informed machine learning. Nature Reviews Physics. 2021;3(6):422-40.",metadataUrl:"https://api.crossref.org/works/10.1038%2Fs42254-021-00314-5",note:"",isRetracted:!1},{id:"ref-36",number:36,numbers:[36],type:"journal-article",title:"A review of physics-informed machine learning for building energy modeling",authors:"Zhihao Ma; Gang Jiang; Yuqing Hu; Jianli Chen",journal:"Applied Energy",year:2025,volume:"381",issue:"",pages:"125169",doi:"10.1016/j.apenergy.2024.125169",doiUrl:"https://doi.org/10.1016/j.apenergy.2024.125169",citations:80,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"This review surveys physics-informed machine learning for building energy modeling as a way to improve the robustness, physical plausibility, interpretability, and generality of data-driven models. Existing methods are organized by physics-informed inputs, loss functions, architectures, and ensemble strategies. It also identifies challenges in integrating prior knowledge and consistently evaluating PIML methods, and outlines future building-energy applications.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S0306261924025534",abstractLicense:"",keywords:[],sections:["2.2"],originalCitation:"Ma Z, Jiang G, Hu Y, Chen J. A review of physics-informed machine learning for building energy modeling. Applied Energy. 2025;381:125169.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.apenergy.2024.125169",note:"",isRetracted:!1},{id:"ref-37",number:37,numbers:[37],type:"journal-article",title:"An online dynamic model based on Physical-Constraint Broad Learning System for extrapolation scenarios of chillers",authors:"Anjun Zhao; Qihang Ren; Wei Quan; Na Zhang; Liu Wei",journal:"Energy and Buildings",year:2025,volume:"343",issue:"",pages:"115939",doi:"10.1016/j.enbuild.2025.115939",doiUrl:"https://doi.org/10.1016/j.enbuild.2025.115939",citations:2,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"A physics-constrained broad learning system is proposed for online chiller modeling under operating conditions not represented in the training data. Error backpropagation and a customized physics loss encourage predictions to remain consistent with known behavior. Experiments show substantial improvements in MAE, RMSE, R-squared, and physical consistency while preserving fast training.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S0378778825006693",abstractLicense:"",keywords:[],sections:["2.2.1"],originalCitation:"Zhao A, Ren Q, Quan W, Zhang N, Wei L. An online dynamic model based on Physical-Constraint Broad Learning System for extrapolation scenarios of chillers. Energy and Buildings. 2025;343:115939.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.enbuild.2025.115939",note:"",isRetracted:!1},{id:"ref-38",number:38,numbers:[38],type:"journal-article",title:"Improving the out-of-sample generalization ability of data-driven chiller performance models using physics-guided neural network",authors:"Fangzhou Guo; Ao Li; Bao Yue; Ziwei Xiao; Fu Xiao; Rui Yan; Anbang Li; Yan Lv; Bing Su",journal:"Applied Energy",year:2024,volume:"354",issue:"",pages:"122190",doi:"10.1016/j.apenergy.2023.122190",doiUrl:"https://doi.org/10.1016/j.apenergy.2023.122190",citations:53,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"Modeling of the chiller performance is essential for the implementation of optimal energy-efficient control strategies in a heating, ventilation, and air conditioning (HVAC) system. Though classical data-driven chiller performance models are widely adopted in the industry, they generally suffer from poor out-of-sample generalization abilities, which refers to the model's capability to extrapolate for new data outside the range of the training dataset. In practice, however, the available chiller operation data for model development are often insufficient or collected from a few limited operating conditions, such that extrapolation is unavoidable after the model is applied for control purposes. To deal with this issue, this paper proposed a physics-guided neural network (PGNN) to model the energy performance of chillers. By adopting a new neural network architecture, modifying the loss function, and adding limited out-of-sample data, the PGNN incorporates domain knowledge into the data-driven model to achieve better out-of-sample generalization performance. Meanwhile, the convexity and monotonicity between the dependent and independent variables in the PGNN are properly addressed. The proposed PGNN is applied to model the chiller serving a high-rise building, and results show that PGNN performs much better in extrapolation than classical models and the multi-layer perceptron model. The research demonstrated the usefulness and effectiveness of the PGNN in modeling HVAC equipment.",abstractKind:"abstract",abstractSource:"User-provided literature library",abstractUrl:"",abstractLicense:"",keywords:["Chiller model","Generalization ability","Artificial intelligence","Physics-guided neural network","Input convex neural network","Loss function"],sections:["2.2.2"],originalCitation:"Guo F, Li A, Yue B, Xiao Z, Xiao F, Yan R, et al. Improving the out-of-sample generalization ability of data-driven chiller performance models using physics-guided neural network. Applied Energy. 2024;354:122190.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.apenergy.2023.122190",note:"",isRetracted:!1},{id:"ref-39",number:39,numbers:[39],type:"journal-article",title:"A novel physics-guided collaborative modeling method for steady-state simulation of air source heat pump system",authors:"Lianyu Shan; Qingzhuang Wu; Mei Wang; Hui Zhang; Wenbo Li; Yanhua Guo; Shuangquan Shao; Zhuang Chen; Yaran Liang",journal:"International Journal of Refrigeration",year:2026,volume:"181",issue:"",pages:"317-331",doi:"10.1016/j.ijrefrig.2025.10.026",doiUrl:"https://doi.org/10.1016/j.ijrefrig.2025.10.026",citations:3,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"The paper introduces physics-guided collaborative modeling for steady-state simulation of air-source heat-pump systems. A heat-exchanger physics-informed network captures nonlinear heat-transfer behavior, while a thermodynamic-cycle coupling residual supports system-level solution. Validation across broad operating conditions shows high component accuracy, a roughly 87\u201395% reduction in computation time versus the physical baseline, and low COP error.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S0140700725004189",abstractLicense:"",keywords:[],sections:["2.2.3","3.2","3.2.1"],originalCitation:"Shan L, Wu Q, Wang M, Zhang H, Li W, Guo Y, et al. A novel physics-guided collaborative modeling method for steady-state simulation of air source heat pump system. International Journal of Refrigeration. 2026;181:317-31.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.ijrefrig.2025.10.026",note:"",isRetracted:!1},{id:"ref-40",number:40,numbers:[40],type:"journal-article",title:"Physics-constrained cooperative learning-based reference models for smart management of chillers considering extrapolation scenarios",authors:"Xinbin Liang; Xu Zhu; Siliang Chen; Xinqiao Jin; Fu Xiao; Zhimin Du",journal:"Applied Energy",year:2023,volume:"349",issue:"",pages:"121642",doi:"10.1016/j.apenergy.2023.121642",doiUrl:"https://doi.org/10.1016/j.apenergy.2023.121642",citations:43,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"A cooperative learning framework trains multiple chiller reference models while penalizing violations of energy and mass conservation at unseen operating conditions. The resulting physics-constrained neural networks improve extrapolation relative to support-vector, random-forest, and conventional neural-network baselines. The approach targets more reliable reference models for optimal control and fault detection in smart building systems.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S0306261923010061",abstractLicense:"",keywords:[],sections:["2.2.4"],originalCitation:"Liang X, Zhu X, Chen S, Jin X, Xiao F, Du Z. Physics-constrained cooperative learning-based reference models for smart management of chillers considering extrapolation scenarios. Applied Energy. 2023;349:121642.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.apenergy.2023.121642",note:"",isRetracted:!1},{id:"ref-41",number:41,numbers:[41],type:"journal-article",title:"Embedding physical neurons in physics-informed neural networks (EP-PINNs) for enhancing chiller performance prediction",authors:"Junjian Fang; Chengchu Yan; Weidong Lu; Jingfeng Shi; Lei Xu; Kai Hu; Yuanhui Ji; Chaoqun Zhuang",journal:"Building Simulation",year:2025,volume:"18",issue:"7",pages:"1877-1901",doi:"10.1007/s12273-025-1293-z",doiUrl:"https://doi.org/10.1007/s12273-025-1293-z",citations:11,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"Accurate chiller performance prediction is crucial for improving the energy efficiency of heating, ventilation, and air conditioning (HVAC) systems. Data-driven models commonly used to enhance chiller performance often rely on sparse data collected under restricted conditions. These models must extrapolate beyond their training data in practical applications, but they generally lack the generalization capability needed for reliable predictions outside their training range. Additionally, their limited interpretability hampers understanding of the physical processes affecting chiller performance, complicating fault identification and performance optimization. To address these issues, this study embeds physical neurons in physics-informed neural networks (EP-PINNs) to enhance chiller performance prediction. By leveragin
