g prior physical knowledge, physical neurons are introduced and embedded into the neural network, forming a neural network architecture with intrinsic physics-based information flow. Simultaneously, simplified physical loss terms are used to guide the training process. The proposed EP-PINNs were applied to predict the performance of four different chillers, and the results demonstrated their high prediction accuracy. Compared to data-driven models, the EP-PINNs exhibited significantly improved generalization capability and interpretability. These advantages highlight the practical value of EP-PINNs in HVAC equipment performance prediction.",abstractKind:"abstract",abstractSource:"User-provided literature library",abstractUrl:"",abstractLicense:"",keywords:["chiller performance prediction","physics-informed neural network","neural network architecture","generalization capability","interpretability"],sections:["2.2.4"],originalCitation:"Fang J, Yan C, Lu W, Shi J, Xu L, Hu K, et al. Embedding physical neurons in physics-informed neural networks (EP-PINNs) for enhancing chiller performance prediction. Building Simulation. 2025;18(7):1877-901.",metadataUrl:"https://api.crossref.org/works/10.1007%2Fs12273-025-1293-z",note:"",isRetracted:!1},{id:"ref-42",number:42,numbers:[42],type:"journal-article",title:"A review on time series forecasting techniques for building energy consumption",authors:"Chirag Deb; Fan Zhang; Junjing Yang; Siew Eang Lee; Kwok Wei Shah",journal:"Renewable and Sustainable Energy Reviews",year:2017,volume:"74",issue:"",pages:"902-924",doi:"10.1016/j.rser.2017.02.085",doiUrl:"https://doi.org/10.1016/j.rser.2017.02.085",citations:1e3,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"This review examines machine-learning techniques for forecasting building energy time series, including cases that combine consumption with weather and indoor-environment variables. Nine widely used methods are compared, together with hybrid approaches that integrate multiple forecasting techniques. The review concludes that hybrid models are generally among the most effective options for building energy forecasting.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S1364032117303155",abstractLicense:"",keywords:[],sections:["2.3"],originalCitation:"Deb C, Zhang F, Yang J, Lee SE, Shah KW. A review on time series forecasting techniques for building energy consumption. Renewable and Sustainable Energy Reviews. 2017;74:902-24.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.rser.2017.02.085",note:"",isRetracted:!1},{id:"ref-43",number:43,numbers:[43],type:"journal-article",title:"Data-driven heating and cooling load predictions for non-residential buildings based on support vector machine regression and NARX Recurrent Neural Network: A comparative study on district scale",authors:"D. Koschwitz; J. Frisch; C. van Treeck",journal:"Energy",year:2018,volume:"165",issue:"",pages:"134-142",doi:"10.1016/j.energy.2018.09.068",doiUrl:"https://doi.org/10.1016/j.energy.2018.09.068",citations:194,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"Support-vector regressors with two kernel choices are compared with recurrent NARX networks of different depths for predicting monthly heating and cooling demand. The case study uses historical measurements from a German non-residential district. In this dataset, the recurrent networks deliver more accurate forecasts without a substantial increase in computational effort.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.semanticscholar.org/paper/0e53bbeebae26bc627190c0a5fab9603b090845c",abstractLicense:"",keywords:[],sections:["2.3"],originalCitation:"Koschwitz D, Frisch J, Van Treeck C. Data-driven heating and cooling load predictions for non-residential buildings based on support vector machine regression and NARX Recurrent Neural Network: A comparative study on district scale. Energy. 2018;165:134-42.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.energy.2018.09.068",note:"",isRetracted:!1},{id:"ref-44",number:44,numbers:[44],type:"journal-article",title:"Deep learning for time series forecasting: The electric load case",authors:"Alberto Gasparin; Slobodan Lukovic; Cesare Alippi",journal:"CAAI Transactions on Intelligence Technology",year:2022,volume:"7",issue:"1",pages:"1-25",doi:"10.1049/cit2.12060",doiUrl:"https://doi.org/10.1049/cit2.12060",citations:45,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"Abstract Management and efficient operations in critical infrastructures such as smart grids take huge advantage of accurate power load forecasting, which, due to its non\u2010linear nature, remains a challenging task. Recently, deep learning has emerged in the machine learning field achieving impressive performance in a vast range of tasks, from image classification to machine translation. Applications of deep learning models to the electric load forecasting problem are gaining interest among researchers as well as the industry, but a comprehensive and sound comparison among different\u2014also traditional\u2014architectures is not yet available in the literature. This work aims at filling the gap by reviewing and experimentally evaluating four real world datasets on the most recent trends in electric load forecasting, by contrasting deep learning architectures on short\u2010term forecast (one\u2010day\u2010ahead prediction). Specifically, the focus is on feedforward and recurrent neural networks, sequence\u2010to\u2010sequence models and temporal convolutional neural networks along with architectural variants, which are known in the signal processing community but are novel to the load forecasting one.",abstractKind:"abstract",abstractSource:"Open-license abstract",abstractUrl:"https://api.crossref.org/works/10.1049%2Fcit2.12060",abstractLicense:"http://creativecommons.org/licenses/by/4.0/",keywords:[],sections:["2.3","2.4.2"],originalCitation:"Gasparin A, Lukovic S, Alippi C. Deep learning for time series forecasting: The electric load case. CAAI Transactions on Intelligence Technology. 2022;7(1):1-25.",metadataUrl:"https://api.crossref.org/works/10.1049%2Fcit2.12060",note:"",isRetracted:!1},{id:"ref-45",number:45,numbers:[45],type:"journal-article",title:"Sequence-to-sequence deep learning model for building energy consumption prediction with dynamic simulation modeling",authors:"Chul Ho Kim; Marie Kim; Yu Jin Song",journal:"Journal of Building Engineering",year:2021,volume:"43",issue:"",pages:"102577",doi:"10.1016/j.jobe.2021.102577",doiUrl:"https://doi.org/10.1016/j.jobe.2021.102577",citations:60,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"A detailed EnergyPlus model combines actual weather with five-minute occupancy, lighting, and equipment schedules and is validated against measured summer electricity use. Its simulated data train a sequence-to-sequence LSTM model for building-energy prediction under varying climate scenarios. Reported errors remain low, while occupancy and solar radiation emerge as the most influential predictors.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S2352710221004356",abstractLicense:"",keywords:[],sections:["2.3"],originalCitation:"Kim CH, Kim M, Song YJ. Sequence-to-sequence deep learning model for building energy consumption prediction with dynamic simulation modeling. Journal of Building Engineering. 2021;43:102577.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.jobe.2021.102577",note:"",isRetracted:!1},{id:"ref-46",number:46,numbers:[46],type:"journal-article",title:"Dynamic model development for vehicle air conditioners based on physics-guided deep learning",authors:"Zhijie Chen; Fu Xiao; Jian Shi; Ao Li",journal:"International Journal of Refrigeration",year:2022,volume:"134",issue:"",pages:"126-138",doi:"10.1016/j.ijrefrig.2021.11.021",doiUrl:"https://doi.org/10.1016/j.ijrefrig.2021.11.021",citations:18,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"A physics-guided deep-learning framework models vehicle air-conditioning dynamics under strong disturbances. Domain knowledge determines inputs, outputs, component structure, and temporal relationships; a NARX-LSTM-MLP represents heat exchangers and an MLP represents the compressor. Integrated component models trained on bus IoT data agree well with measurements and offer a practical basis for fleet-scale health monitoring.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S014070072100459X",abstractLicense:"",keywords:[],sections:["2.3","3.1","3.1.2","3.2","3.2.1"],originalCitation:"Chen Z, Xiao F, Shi J, Li A. Dynamic model development for vehicle air conditioners based on physics-guided deep learning. International Journal of Refrigeration. 2022;134:126-38.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.ijrefrig.2021.11.021",note:"",isRetracted:!1},{id:"ref-47",number:47,numbers:[47],type:"journal-article",title:"An advanced airport terminal cooling load forecasting model integrating SSA and CNN-Transformer",authors:"Bochao Chen; Wansheng Yang; Biao Yan; Keren Zhang",journal:"Energy and Buildings",year:2024,volume:"309",issue:"",pages:"114000",doi:"10.1016/j.enbuild.2024.114000",doiUrl:"https://doi.org/10.1016/j.enbuild.2024.114000",citations:38,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"The study combines singular spectrum analysis with a modified CNN-Transformer to forecast airport-terminal cooling loads influenced by weather and passenger flow. Data reconstruction, learned positional features, and causal convolutions improve sensitivity to local patterns. Tests on terminal load data report strong single- and multi-step accuracy and suggest the approach can support energy-efficient operation of large public buildings.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S0378778824001166",abstractLicense:"",keywords:[],sections:["2.3"],originalCitation:"Chen B, Yang W, Yan B, Zhang K. An advanced airport terminal cooling load forecasting model integrating SSA and CNN-Transformer. Energy and Buildings. 2024;309:114000.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.enbuild.2024.114000",note:"",isRetracted:!1},{id:"ref-48",number:48,numbers:[48],type:"journal-article",title:"Prediction of functional zones cooling load for shopping mall using dual attention based LSTM: A case study",authors:"Anjun Zhao; Yu Zhang; Yuping Zhang; Hangjie Yang; Yingxi Zhang",journal:"International Journal of Refrigeration",year:2022,volume:"144",issue:"",pages:"211-221",doi:"10.1016/j.ijrefrig.2022.07.020",doiUrl:"https://doi.org/10.1016/j.ijrefrig.2022.07.020",citations:38,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"A zonal cooling-load method is developed for shopping malls so that functional areas can be cooled on demand. Gray relational analysis selects influential variables, while an LSTM with feature and temporal attention learns which inputs and historical periods matter most. A Xi'an shopping-mall case study shows improved accuracy, stability, and generalization over earlier prediction models.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S0140700722002675",abstractLicense:"",keywords:[],sections:["2.3"],originalCitation:"Zhao A, Zhang Y, Zhang Y, Yang H, Zhang Y. Prediction of functional zones cooling load for shopping mall using dual attention based LSTM: A case study. International Journal of Refrigeration. 2022;144:211-21.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.ijrefrig.2022.07.020",note:"",isRetracted:!1},{id:"ref-49",number:49,numbers:[49],type:"journal-article",title:"A physics-constrained deep learning framework for dynamic modeling of vapor compression systems",authors:"Jiacheng Ma; Yiyun Dong; Hongtao Qiao; Christopher R. Laughman",journal:"Applied Thermal Engineering",year:2024,volume:"254",issue:"",pages:"123734",doi:"10.1016/j.applthermaleng.2024.123734",doiUrl:"https://doi.org/10.1016/j.applthermaleng.2024.123734",citations:20,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"Data-driven dynamic models typically offer faster execution than their physics-based counterparts described by large systems of nonlinear differential-algebraic equations (DAEs) with quantitatively reasonable accuracy. Therefore, development of such models can be extremely useful for design optimization, controls, fault detection and diagnostics of vapor compression based building Heating, ventilation and air conditioning (HVAC) systems. As the complexity and scale of vapor compression systems (VCS) increase rapidly across the industry, a modular approach of generating and interconnecting data-driven component models enables model reuse and efficient adaption to arbitrary system layouts. Despite the flexibility, the modular integration for system model generation can suffer from nonphysical behaviors of violating conservation laws due to inevitable prediction errors associated with each component. This paper presents a data-driven modeling framework that exploits state-of-the-art deep learning techniques for constructing component models, while enforcing physical conservation for system simulations. A general-purpose system solver is developed to handle arbitrary configurations by automatically integrating data-driven or interchangeable physics-based component models into a system model. Results of an air-source heat pump system reveal a significant speedup with good agreement, compared to high-fidelity first-principles models.",abstractKind:"abstract",abstractSource:"User-provided literature library",abstractUrl:"",abstractLicense:"",keywords:["Transient simulation","Deep learning","Gated recurrent unit","Vapor compression system","Component-based modeling","Physical conservation"],sections:["2.3","3.1","3.1.2","3.1.3","3.2","3.2.1","3.3"],originalCitation:"Ma J, Dong Y, Qiao H, Laughman CR. A physics-constrained deep learning framework for dynamic modeling of vapor compression systems. Applied Thermal Engineering. 2024;254:123734.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.applthermaleng.2024.123734",note:"",isRetracted:!1},{id:"ref-50",number:50,numbers:[50],type:"journal-article",title:"A novel Transformer-based network forecasting method for building cooling loads",authors:"Long Li; Xingyu Su; Xianting Bi; Yueliang Lu; Xuetao Sun",journal:"Energy and Buildings",year:2023,volume:"296",issue:"",pages:"113409",doi:"10.1016/j.enbuild.2023.113409",doiUrl:"https://doi.org/10.1016/j.enbuild.2023.113409",citations:72,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"A Transformer encoder-decoder is proposed for building cooling-load forecasting, using attention to capture dependencies in historical sequences and rank the influence of input features. Evaluation with office-building data shows higher accuracy and longer-horizon stability than comparison methods. The model is intended to support HVAC scheduling and energy-saving operation.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S0378778823006394",abstractLicense:"",keywords:[],sections:["2.3"],originalCitation:"Li L, Su X, Bi X, Lu Y, Sun X. A novel Transformer-based network forecasting method for building cooling loads. Energy and Buildings. 2023;296:113409.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.enbuild.2023.113409",note:"",isRetracted:!1},{id:"ref-51",number:51,numbers:[51],type:"journal-article",title:"Transformer based day-ahead cooling load forecasting of hub airport air-conditioning systems with thermal energy storage",authors:"Die Yu; Tong Liu; Kai Wang; Kang Li; Mehmet Mercang\xF6z; Jian Zhao; Yu Lei; RuoFan Zhao",journal:"Energy and Buildings",year:2024,volume:"308",issue:"",pages:"114008",doi:"10.1016/j.enbuild.2024.114008",doiUrl:"https://doi.org/10.1016/j.enbuild.2024.114008",citations:33,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"A hybrid k-means and Temporal Fusion Transformer model forecasts day-ahead cooling demand for an airport air-conditioning system with thermal storage. Weighted features and dynamic-time-warping distances identify daily load patterns, whose statistics and contextual information feed the interpretable forecasting model. A Chongqing airport case study shows improved error metrics relative to mainstream baselines.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S0378778824001245",abstractLicense:"",keywords:[],sections:["2.3"],originalCitation:"Yu D, Liu T, Wang K, Li K, Mercang\xF6z M, Zhao J, et al. Transformer based day-ahead cooling load forecasting of hub airport air-conditioning systems with thermal energy storage. Energy and Buildings. 2024;308:114008.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.enbuild.2024.114008",note:"",isRetracted:!1},{id:"ref-52",number:52,numbers:[52],type:"journal-article",title:"Principles, research status, and prospects of feature engineering for data-driven building energy prediction: A comprehensive review",authors:"Zeyu Wang; Lisha Xia; Hongping Yuan; Ravi S. Srinivasan; Xiangnan Song",journal:"Journal of Building Engineering",year:2022,volume:"58",issue:"",pages:"105028",doi:"10.1016/j.jobe.2022.105028",doiUrl:"https://doi.org/10.1016/j.jobe.2022.105028",citations:72,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"This review analyzes feature engineering for data-driven building-energy prediction through 172 studies. It organizes methods into feature construction, selection, and extraction, summarizes the field's research patterns, and considers when and why feature engineering improves prediction. Limitations and promising directions are identified for both researchers and industry practitioners.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S2352710222010385",abstractLicense:"",keywords:[],sections:["2.4.1"],originalCitation:"Wang Z, Xia L, Yuan H, Srinivasan RS, Song X. Principles, research status, and prospects of feature engineering for data-driven building energy prediction: A comprehensive review. Journal of Building Engineering. 2022;58:105028.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.jobe.2022.105028",note:"",isRetracted:!1},{id:"ref-53",number:53,numbers:[53],type:"journal-article",title:"Energy modelling and control of building heating and cooling systems with data-driven and hybrid models\u2014A review",authors:"Yasaman Balali; Adrian Chong; Andrew Busch; Steven O\u2019Keefe",journal:"Renewable and Sustainable Energy Reviews",year:2023,volume:"183",issue:"",pages:"113496",doi:"10.1016/j.rser.2023.113496",doiUrl:"https://doi.org/10.1016/j.rser.2023.113496",citations:140,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"Implementing an efficient control strategy for heating, ventilation, and air conditioning (HVAC) systems can lead to improvements in both energy efficiency and thermal performance in buildings. As HVAC systems and buildings are complicated dynamic systems, the effectiveness of both data-driven and model-based control methods has been widely investigated by researchers. However, the main challenges that impede the practical application of model-based methods in real buildings are their reliance on the precision of control-oriented models and the dependence of data-based systems on the quantity and quality of input\u2013output data. The objectives of this study are: (1) To present an overview of the prevalent thermal modelling strategies used as control-oriented models or virtual environments in model-based and data-based control methods, addressing the main requirements of thermal models; (2) the state-of-the-art of MPC and RL control techniques; (3) the data requirements for thermal models. The findings emphasise the need for unified guidelines to validate and verify the proposed control methods, ensuring their practical implementation in real buildings. Moreover, the inclusion of occupancy forecasts in models presents challenges due to the intricate nature of accurately predicting human behaviour, occupancy patterns, and their effects on thermal dynamics. Balancing thermal comfort and energy efficiency in HVAC systems with a supervisory controller remains a difficult task, but combining data-driven and physics-based models can help overcome challenges. Further research is needed to compare the effectiveness of MPC and RL approaches, and accurately measuring the impact of human behaviour and occupancy remains a significant obstacle.",abstractKind:"abstract",abstractSource:"Open-license abstract",abstractUrl:"https://api.openalex.org/works/W4383213297",abstractLicense:"http://creativecommons.org/licenses/by-nc/4.0/",keywords:[],sections:["2.4.1"],originalCitation:"Balali Y, Chong A, Busch A, O'Keefe S. Energy modelling and control of building heating and cooling systems with data-driven and hybrid models\u2014A review. Renewable and Sustainable Energy Reviews. 2023;183:113496.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.rser.2023.113496",note:"",isRetracted:!1},{id:"ref-54",number:54,numbers:[54],type:"journal-article",title:"Review of modeling methods for HVAC systems",authors:"Abdul Afram; Farrokh Janabi-Sharifi",journal:"Applied Thermal Engineering",year:2014,volume:"67",issue:"1-2",pages:"507-519",doi:"10.1016/j.applthermaleng.2014.03.055",doiUrl:"https://doi.org/10.1016/j.applthermaleng.2014.03.055",citations:476,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"This review classifies HVAC system models into data-driven, physics-based, and gray-box approaches. It explains why component-level representations of chillers, boilers, coils, ducts, sensors, and controllers are needed to estimate energy use and test supervisory or local control strategies. Major techniques from each modeling family are compared across the recent literature.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S1359431114002348",abstractLicense:"",keywords:[],sections:["2.4.1","2.4.2"],originalCitation:"Afram A, Janabi-Sharifi F. Review of modeling methods for HVAC systems. Applied Thermal Engineering. 2014;67(1-2):507-19.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.applthermaleng.2014.03.055",note:"",isRetracted:!1},{id:"ref-55",number:55,numbers:[55],type:"journal-article",title:"Time-series forecasting with deep learning: a survey",authors:"Bryan Lim; Stefan Zohren",journal:"Philosophical Transactions of the Royal Society A: Mathematical, Physical and Engineering Sciences",year:2021,volume:"379",issue:"2194",pages:"20200209",doi:"10.1098/rsta.2020.0209",doiUrl:"https://doi.org/10.1098/rsta.2020.0209",citations:1755,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"This survey organizes deep-learning approaches for time-series prediction by their encoder and decoder structures and by forecast horizon. It explains how temporal information enters predictions, reviews combinations of statistical models and neural networks, and discusses how forecasting architectures can support downstream decisions.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://api.crossref.org/works/10.1098%2Frsta.2020.0209",abstractLicense:"",keywords:[],sections:["2.4.2"],originalCitation:"Lim B, Zohren S. Time-series forecasting with deep learning: a survey. Philosophical Transactions of the Royal Society A: Mathematical, Physical and Engineering Sciences. 2021;379(2194):20200209.",metadataUrl:"https://api.crossref.org/works/10.1098%2Frsta.2020.0209",note:"",isRetracted:!1},{id:"ref-56",number:56,numbers:[56],type:"journal-article",title:"Deep networks for system identification: A survey",authors:"Gianluigi Pillonetto; Aleksandr Aravkin; Daniel Gedon; Lennart Ljung; Ant\xF4nio H. Ribeiro; Thomas B. Sch\xF6n",journal:"Automatica",year:2025,volume:"171",issue:"",pages:"111907",doi:"10.1016/j.automatica.2024.111907",doiUrl:"https://doi.org/10.1016/j.automatica.2024.111907",citations:85,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"Deep learning is a topic of considerable current interest.The availability of massive data collections and powerful software resources has led to an impressive amount of results in many application areas that reveal essential but hidden properties of the observations.System identification learns mathematical descriptions of dynamic systems from input-output data and can thus benefit from the advances of deep neural networks to enrich the possible range of models to choose from.For this reason, we provide a survey of deep learning from a system identification perspective.We cover a wide spectrum of topics to enable researchers to understand the methods, providing rigorous practical and theoretical insights into the benefits and challenges of using them.The main aim of the identified model is to predict new data from previous observations.This can be achieved with different deep learning-based modelling techniques and we discuss architectures commonly adopted in the literature, like feedforward, convolutional, and recurrent networks.Their parameters have to be estimated from past data to optimize the prediction performance.For this purpose, we discuss a specific set of first-order optimization tools that have emerged as efficient.The survey then draws connections to the well-studied area of kernel-based methods.They control the data fit by regularization terms that penalize models not in line with prior assumptions.We illustrate how to cast them in deep architectures to obtain deep kernel-based methods.The success of deep learning also resulted in surprising empirical observations, like the counter-intuitive behaviour of models with many parameters.We discuss the role of overparameterized models, including their connection to kernels, as well as implicit regularization mechanisms which affect generalization, specifically the interesting phenomena of benign overfitting and double-descent.Finally, we highlight numerical, computational and software aspects in the area with the help of applied examples.",abstractKind:"abstract",abstractSource:"Open-license abstract",abstractUrl:"https://api.openalex.org/works/W4402699269",abstractLicense:"http://creativecommons.org/licenses/by/4.0/",keywords:[],sections:["2.4.2"],originalCitation:"Pillonetto G, Aravkin A, Gedon D, Ljung L, Ribeiro AH, Sch\xF6n TB. Deep networks for system identification: A survey. Automatica. 2025;171:111907.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.automatica.2024.111907",note:"",isRetracted:!1},{id:"ref-57",number:57,numbers:[57],type:"journal-article",title:"A survey of regularization strategies for deep models",authors:"Reza Moradi; Reza Berangi; Behrouz Minaei",journal:"Artificial Intelligence Review",year:2020,volume:"53",issue:"6",pages:"3947-3986",doi:"10.1007/s10462-019-09784-7",doiUrl:"https://doi.org/10.1007/s10462-019-09784-7",citations:290,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"This survey systematically reviews major regularization methods and variants for deep models, then compares their test error and computational cost on a convolutional network trained with CIFAR-10. Weight decay and data augmentation offer low-cost generalization gains; dropout, normalization, and ensembles become attractive as computational resources increase. Accuracy, training epochs, and operations per sample guide method selection.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://link.springer.com/article/10.1007/s10462-019-09784-7",abstractLicense:"",keywords:[],sections:["2.4.2"],originalCitation:"Moradi R, Berangi R, Minaei B. A survey of regularization strategies for deep models. Artificial Intelligence Review. 2020;53(6):3947-86.",metadataUrl:"https://api.crossref.org/works/10.1007%2Fs10462-019-09784-7",note:"",isRetracted:!1},{id:"ref-58",number:58,numbers:[58],type:"journal-article",title:"Excitation Signal Design for Generating Optimal Training Data for Complex Dynamic Systems",authors:"Edward Winward; Zhijia Yang; Byron Mason; Mark Cary",journal:"IEEE Access",year:2022,volume:"10",issue:"",pages:"8653-8663",doi:"10.1109/access.2021.3138166",doiUrl:"https://doi.org/10.1109/access.2021.3138166",citations:4,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"The appropriate choice of excitation signal in system identification is an important but rarely considered part of the process that determines the success of many downstream activities. This paper presents a novel methodology for excitation signal design to create high accuracy multivariable nonlinear dynamic neuro-fuzzy models. Two different approaches to experimental design are investigated. In the first, a prescribed transient manoeuvre is used. In the second, informative potential is used to deconstruct the transient into a sequence of inputs designed to cover the same input space and reduce model development time. Star discrepancy is used to evaluate the resulting designs and is shown to provide a good proxy for excitation design quality. Results are presented showing the prediction accuracy of the model in terms of an application example, achieving a minimum < 2% cumulative error over a two minute transient. It is shown that the neuro-fuzzy models identified using data from the two different approaches have similar accuracy. However, the second approach based on informative potential leads to a more generalised model and reduces the development time by a factor of four. This is a significant result that shows the importance of choosing an appropriate excitation signal.",abstractKind:"abstract",abstractSource:"Open-license abstract",abstractUrl:"https://api.openalex.org/works/W4205402153",abstractLicense:"https://creativecommons.org/licenses/by/4.0/legalcode",keywords:[],sections:["2.4.2"],originalCitation:"Winward E, Yang Z, Mason B, Cary M. Excitation Signal Design for Generating Optimal Training Data for Complex Dynamic Systems. IEEE Access. 2022;10:8653-63.",metadataUrl:"https://api.crossref.org/works/10.1109%2Faccess.2021.3138166",note:"",isRetracted:!1},{id:"ref-59",number:59,numbers:[59],type:"journal-article",title:"How to approach Carnot cycle via zeotropic working fluid: Research methodology and case study",authors:"Weicong Xu; Shuai Deng; Wen Su; Ying Zhang; Li Zhao; Zhixin Yu",journal:"Energy",year:2018,volume:"144",issue:"",pages:"576-586",doi:"10.1016/j.energy.2017.12.041",doiUrl:"https://doi.org/10.1016/j.energy.2017.12.041",citations:60,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"The paper proposes a thermodynamic-cycle construction method that exploits the adjustable properties of zeotropic mixtures. A three-dimensional cycle diagram extends the conventional temperature-entropy representation with working-fluid composition, supporting analysis of an organic Rankine subsystem coupled to composition regulation. A representative case illustrates how the method can guide higher-efficiency cycle and component design toward Carnot-like performance.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S0360544217320613",abstractLicense:"",keywords:[],sections:["3"],originalCitation:"Xu W, Deng S, Su W, Zhang Y, Zhao L, Yu Z. How to approach Carnot cycle via zeotropic working fluid: Research methodology and case study. Energy. 2018;144:576-86.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.energy.2017.12.041",note:"",isRetracted:!1},{id:"ref-60",number:60,numbers:[60],type:"journal-article",title:"Dynamic modeling of steam power cycles: Part II \u2013 Simulation of a small simple Rankine cycle system",authors:"H. van Putten; P. Colonna",journal:"Applied Thermal Engineering",year:2007,volume:"27",issue:"14-15",pages:"2566-2582",doi:"10.1016/j.applthermaleng.2007.01.035",doiUrl:"https://doi.org/10.1016/j.applthermaleng.2007.01.035",citations:81,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"A lumped-parameter dynamic model is developed for a small biomass-fired Rankine-cycle plant comprising pump, economizer, evaporator, superheater, impulse turbine, generator, and condenser. The model is checked against established steady-state software and qualitatively assessed through pump-speed and flue-gas disturbances. The work demonstrates a modular simulation approach for low-power plants that operate frequently under transient conditions.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S135943110700066X",abstractLicense:"",keywords:[],sections:["3"],originalCitation:"Van Putten H, Colonna P. Dynamic modeling of steam power cycles: Part II\u2013Simulation of a small simple Rankine cycle system. Applied Thermal Engineering. 2007;27(14-15):2566-82.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.applthermaleng.2007.01.035",note:"",isRetracted:!1},{id:"ref-61",number:61,numbers:[61],type:"journal-article",title:"On the dynamic modeling of Brayton cycle power conversion systems with the CATHARE-3 code",authors:"Gedeon Mauger; Nicolas Tauveron; Fabrice Bentivoglio; Alain Ruby",journal:"Energy",year:2019,volume:"168",issue:"",pages:"1002-1016",doi:"10.1016/j.energy.2018.11.063",doiUrl:"https://doi.org/10.1016/j.energy.2018.11.063",citations:28,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"The CATHARE-3 simulation framework is extended for transient analysis of high-pressure, closed nitrogen Brayton cycles. The extensions account for real-gas properties, high-Reynolds-number pressure losses, turbomachinery behavior, and choking. Validation and accident calculations demonstrate why ideal-gas assumptions can misrepresent heat transfer, pressure losses, and compressor operating limits.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.semanticscholar.org/paper/55839faaecffbaad906a28e90c2ffb80de282c8f",abstractLicense:"",keywords:[],sections:["3"],originalCitation:"Mauger G, Tauveron N, Bentivoglio F, Ruby A. On the dynamic modeling of Brayton cycle power conversion systems with the CATHARE-3 code. Energy. 2019;168:1002-16.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.energy.2018.11.063",note:"",isRetracted:!1},{id:"ref-62",number:62,numbers:[62],type:"journal-article",title:"Thermodynamic model and optimization of a multi-step irreversible Brayton cycle",authors:"S. S\xE1nchez-Orgaz; A. Medina; A. Calvo Hern\xE1ndez",journal:"Energy Conversion and Management",year:2010,volume:"51",issue:"11",pages:"2134-2143",doi:"10.1016/j.enconman.2010.03.006",doiUrl:"https://doi.org/10.1016/j.enconman.2010.03.006",citations:42,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"A general thermodynamic model describes regenerative Brayton cycles with arbitrary numbers of turbines and compressors, including reheating and intercooling. It represents non-isentropic machinery, pressure drops, imperfect regeneration, heat leakage, and nonideal reservoir coupling with a compact set of physically meaningful parameters. The formulation recovers published special cases and supports analysis of maximum-power and maximum-efficiency regimes.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S0196890410001135",abstractLicense:"",keywords:[],sections:["3"],originalCitation:"S\xE1nchez-Orgaz S, Medina A, Hern\xE1ndez AC. Thermodynamic model and optimization of a multi-step irreversible Brayton cycle. Energy Conversion and Management. 2010;51(11):2134-43.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.enconman.2010.03.006",note:"",isRetracted:!1},{id:"ref-63",number:63,numbers:[63],type:"journal-article",title:"A thermodynamic analysis of the Linde-Hampson cycle using low-GWP R1234yf-blends",authors:"Yanbin Qin; Nanxi Li; Hua Zhang; Baolin Liu",journal:"Case Studies in Thermal Engineering",year:2023,volume:"49",issue:"",pages:"103358",doi:"10.1016/j.csite.2023.103358",doiUrl:"https://doi.org/10.1016/j.csite.2023.103358",citations:18,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"The Linde-Hampson cycle (LHC) exhibits a promising future as a cooling method to achieve cooling temperatures below \u221240 \xB0C, and are highly desirable in commercial refrigeration. This paper investigated the refrigerant replacement options of low-GWP blends i.e. R1234yf/R1132a, R1234yf/R170, R1234yf/R41 and R1234yf/R744 in the LHC by using thermodynamic analysis. The compressor temperature, cooling capacity, coefficient of performance (COP) and exergy efficiency were chosen as the objective parameters. The modelling results show that the R1234yf/R41 mixture has larger cooling capacities, while the R1234yf/R1132a mixture has higher energy efficiency. Under a typical operating condition, the R1234yf/R1132a mixture attained a COP of 1.4162 and an exergy efficiency of 28.49%, demonstrating high priority for improving energy and exergy performances. Besides, the system performance will be improved significantly with increasing R1234yf mass fraction, but the cooling temperature will also increase. In addition, the condenser and expansion valve are the two components that deplete exergy the most, which should be the focus for performance improvement. These results have important guiding significance for understanding the effects of different operating conditions on the thermodynamic performance of the LHC, and also expand the selectivity towards the refrigeration system and its working fluids.",abstractKind:"abstract",abstractSource:"Open-license abstract",abstractUrl:"https://api.openalex.org/works/W4385498138",abstractLicense:"http://creativecommons.org/licenses/by/4.0/",keywords:[],sections:["3"],originalCitation:"Qin Y, Li N, Zhang H, Liu B. A thermodynamic analysis of the Linde-Hampson cycle using low-GWP R1234yf-blends. Case Studies in Thermal Engineering. 2023;49:103358.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.csite.2023.103358",note:"",isRetracted:!1},{id:"ref-64",number:64,numbers:[64],type:"journal-article",title:"Application of self-adaptive physics-informed neural network for the modeling of deep bottomhole heat exchangers",authors:"Ehsan Ghasemi; Mohammad Emami Niri; Mozhdeh Sajjadi; Hossein Nosrati",journal:"Applied Thermal Engineering",year:2026,volume:"294",issue:"",pages:"130607",doi:"10.1016/j.applthermaleng.2026.130607",doiUrl:"https://doi.org/10.1016/j.applthermaleng.2026.130607",citations:3,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"A self-adaptive physics-informed neural network solves coupled heat-transfer equations for a coaxial deep bottomhole heat exchanger using physical laws rather than prior simulation or measurement data. Dynamically optimized loss weights balance multiple constraints. Comparison with a finite-difference benchmark and sensitivity tests indicates accurate temperature and energy predictions, supporting efficient analysis of geothermal recovery from abandoned wells.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S1359431126009154",abstractLicense:"",keywords:[],sections:["3.1"],originalCitation:"Ghasemi E, Niri ME, Sajjadi M, Nosrati H. Application of self-adaptive physics-informed neural network for the modeling of deep bottomhole heat exchangers. Applied Thermal Engineering. 2026:130607.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.applthermaleng.2026.130607",note:"",isRetracted:!1},{id:"ref-65",number:65,numbers:[65],type:"journal-article",title:"Physics-informed deep residual neural network for finned-tube evaporator performance prediction",authors:"Xing-Yu Liang; Bo Zhang; Chun-Lu Zhang",journal:"Energy",year:2024,volume:"302",issue:"",pages:"131822",doi:"10.1016/j.energy.2024.131822",doiUrl:"https://doi.org/10.1016/j.energy.2024.131822",citations:19,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"Finned-tube heat exchangers are extensively used in industrial and daily life. As complex system designs and digital twins increase, higher demands arise for predictive modeling of finned-tube heat exchanger performance. Previous studies faced issues like disparities in evaporator performance under dry and wet conditions, inaccurate predictions of refrigerant pressure drop, and a lack of comprehensive consideration for predicting the trends in physical details. With the evolution of AI algorithms, exploring novel modeling methods becomes essential. Therefore, this study proposes a physics-informed deep residual network model for accurate performance prediction of finned-tube evaporators. The model achieved mean absolute error of 0.14 % for heat transfer rate prediction, 0.36 % for refrigerant pressure drop prediction, and 0.49 % for air pressure drop prediction. This model addresses previous issues of performance disparities under dry and wet conditions and high errors in refrigerant pressure drop prediction. The proposed deep residual network model is found much better performance in capturing physical details than other machine learning approaches. It can serve as a benchmark model for transfer learning or complex system modeling. The method of determining the structure of residual networks through a priori physical knowledge also provides a new perspective on modeling physical systems.",abstractKind:"abstract",abstractSource:"User-provided literature library",abstractUrl:"",abstractLicense:"",keywords:["Physics-informed network","Residual neural network","Finned-tube evaporator","Modeling","Deep learning"],sections:["3.1","3.1.1"],originalCitation:"Liang X-Y, Zhang B, Zhang C-L. Physics-informed deep residual neural network for finned-tube evaporator performance prediction. Energy. 2024;302:131822.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.energy.2024.131822",note:"",isRetracted:!1},{id:"ref-66",number:66,numbers:[66],type:"journal-article",title:"A physic-extract-constrained neural network for performance prediction of finned-tube condenser in air source heat pump system",authors:"Yanhua Guo; Ningbo Wang; Shuangquan Shao; Xiaoqiong Li; Yaran Liang; Zhuang Chen; Bo Tian; Zhentao Zhang",journal:"International Communications in Heat and Mass Transfer",year:2025,volume:"167",issue:"",pages:"109233",doi:"10.1016/j.icheatmasstransfer.2025.109233",doiUrl:"https://doi.org/10.1016/j.icheatmasstransfer.2025.109233",citations:6,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"It's vital to construct a fast and robust simulation model for the digital twins and intelligent control of air source heat pump (ASHP) system, where heat exchangers are the most complex and time-consuming parts. Therefore, a physics-exact-constrained neural network (PeCNN) is proposed to achieve highly generalized prediction of finned-tube condenser performance in the ASHP system under small data sample conditions. General framework of the PeCNN is to construct loss function integrated with physical constraints based on the 1-D physical correlation-based distributed parameter (PCDP) method and attention mechanism based residual network, resulting in the effective solution of the multiple non-smooth convex optimization problems in parallel. Comprehensive data experiments are conducted in the designed dataset. The results show that the proposed model achieves coefficient of determination (R2) of 0.998 for the refrigerant pressure drop prediction. Compared with other data-driven models, abilities of capturing physical details and extrapolation can be improved by 85% and 11.7%, respectively. The method of physical knowledge integration of the PeCNN also provides a new perspective on fast modeling ASHP systems.",abstractKind:"abstract",abstractSource:"User-provided literature library",abstractUrl:"",abstractLicense:"",keywords:["Physics-constrained","Air source heat pump","Finned-tube condenser","Performance prediction","Neural network"],sections:["3.1","3.1.1"],originalCitation:"Guo Y, Wang N, Shao S, Li X, Liang Y, Chen Z, et al. A physic-extract-constrained neural network for performance prediction of finned-tube condenser in air source heat pump system. International Communications in Heat and Mass Transfer. 2025;167:109233.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.icheatmasstransfer.2025.109233",note:"",isRetracted:!1},{id:"ref-67",number:67,numbers:[67],type:"journal-article",title:"Physics-Informed LSTM based dynamic model of heat exchanger and application on the thermal management system considering time delay",authors:"Xue-bin Tang; Qi-biao Hong; Yu Liu; Bing-cheng Wang; Zheng Cui; Wei Shao",journal:"International Journal of Heat and Mass Transfer",year:2025,volume:"250",issue:"",pages:"127322",doi:"10.1016/j.ijheatmasstransfer.2025.127322",doiUrl:"https://doi.org/10.1016/j.ijheatmasstransfer.2025.127322",citations:17,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"The study combines heat-current physics with an LSTM to model heat-exchanger dynamics when data are scarce. Component models are then integrated with transport delays into a hybrid thermal-management-system model. Experiments show substantially better prediction accuracy than conventional LSTMs at both component and system levels, while reducing the dependence of data-driven models on large datasets.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S0017931025006611",abstractLicense:"",keywords:[],sections:["3.1","3.1.2"],originalCitation:"Tang X-B, Hong Q-B, Liu Y, Wang B-C, Cui Z, Shao W. Physics-informed LSTM based dynamic model of heat exchanger and application on the thermal management system considering time delay. International Journal of Heat and Mass Transfer. 2025;250:127322.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.ijheatmasstransfer.2025.127322",note:"",isRetracted:!1},{id:"ref-69",number:69,numbers:[69],type:"journal-article",title:"AI for dynamic heat exchangers modeling in vapor compression systems with limited computational resources",authors:"Yiming Li; Suxin Qian",journal:"Energy",year:2026,volume:"346",issue:"",pages:"140284",doi:"10.1016/j.energy.2026.140284",doiUrl:"https://doi.org/10.1016/j.energy.2026.140284",citations:3,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"A recurrent-neural-network model and virtual-valve mechanism enable modular dynamic simulation of two-phase heat exchangers under limited computing resources. Accuracy, stability, and response-speed metrics are evaluated, and an orthogonal design simplifies training-data generation. The model achieves near-physics-model accuracy with roughly fivefold faster computation and remains robust on a desktop platform in a heat-pump water-heater demonstration.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S0360544226003865",abstractLicense:"",keywords:[],sections:["3.1","3.1.2","4.1"],originalCitation:"Li Y, Qian S. AI for dynamic heat exchangers modeling in vapor compression systems with limited computational resources. Energy. 2026;346:140284.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.energy.2026.140284",note:"",isRetracted:!1},{id:"ref-70",number:70,numbers:[70],type:"journal-article",title:"Modular deep learning framework for vapor-compression HVAC systems: Scalable, efficient, and physically consistent modeling",authors:"Ali Vaziri; Hongtao Qiao; Christopher R. Laughman; Huazhen Fang",journal:"Applied Thermal Engineering",year:2026,volume:"299",issue:"",pages:"131100",doi:"10.1016/j.applthermaleng.2026.131100",doiUrl:"https://doi.org/10.1016/j.applthermaleng.2026.131100",citations:0,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"A modular deep-learning framework trains vapor-compression components independently and assembles them into different cycle topologies. Neural ordinary differential equations represent dynamics, while mass and energy conservation are enforced exactly at component connections. Tests against high-fidelity Modelica models show low errors, stable long-horizon behavior, and substantial speedups for both single- and dual-compressor heat-pump configurations.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S1359431126014080",abstractLicense:"",keywords:[],sections:["3.1","3.2","3.2.1"],originalCitation:"Vaziri A, Qiao H, Laughman CR, Fang H. Modular deep learning framework for vapor-compression HVAC systems: Scalable, efficient, and physically consistent modeling. Applied Thermal Engineering. 2026;299:131100.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.applthermaleng.2026.131100",note:"",isRetracted:!1},{id:"ref-71",number:71,numbers:[71],type:"journal-article",title:"A comparison of moving-boundary and finite-volume formulations for transients in centrifugal chillers",authors:"Satyam Bendapudi; James E. Braun; Eckhard A. Groll",journal:"International Journal of Refrigeration",year:2008,volume:"31",issue:"8",pages:"1437-1452",doi:"10.1016/j.ijrefrig.2008.03.006",doiUrl:"https://doi.org/10.1016/j.ijrefrig.2008.03.006",citations:152,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"Moving-boundary and finite-volume shell-and-tube heat-exchanger models are developed, embedded in a centrifugal-chiller simulation, and validated against a 300 kW test stand. Both achieve similar accuracy, but finite volumes are more robust during start-up while moving boundaries run about three times faster. Moving-boundary charge estimates are less accurate under a homogeneous two-phase assumption.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S0140700708000637",abstractLicense:"",keywords:[],sections:["3.1.1","3.1.2"],originalCitation:"Bendapudi S, Braun JE, Groll EA. A comparison of moving-boundary and finite-volume formulations for transients in centrifugal chillers. International Journal of Refrigeration. 2008;31(8):1437-52.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.ijrefrig.2008.03.006",note:"",isRetracted:!1},{id:"ref-72",number:72,numbers:[72],type:"journal-article",title:"A comparison between finite volume and switched moving boundary approaches for dynamic vapor compression system modeling",authors:"Herschel Pangborn; Andrew G. Alleyne; Ning Wu",journal:"International Journal of Refrigeration",year:2015,volume:"53",issue:"",pages:"101-114",doi:"10.1016/j.ijrefrig.2015.01.009",doiUrl:"https://doi.org/10.1016/j.ijrefrig.2015.01.009",citations:80,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"Finite-volume and switched moving-boundary formulations for dynamic vapor-compression heat exchangers are compared against experimental system data. The results challenge a simple accuracy-versus-speed tradeoff: both can reach comparable accuracy, although moving boundaries simulate faster and finite volumes adapt more readily to different exchanger geometries. Implementation techniques for speed and numerical robustness are also discussed.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S0140700715000225",abstractLicense:"",keywords:[],sections:["3.1.1","3.1.2"],originalCitation:"Pangborn H, Alleyne AG, Wu N. A comparison between finite volume and switched moving boundary approaches for dynamic vapor compression system modeling. International Journal of Refrigeration. 2015;53:101-14.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.ijrefrig.2015.01.009",note:"",isRetracted:!1},{id:"ref-73",number:73,numbers:[73],type:"journal-article",title:"A general steady state mathematical model for fin-and-tube heat exchanger based on graph theory",authors:"Jian Liu; WenJian Wei; GouLiang Ding; Chunlu Zhang; Masaharu Fukaya; Kaijian Wang; Takefumi Inagaki",journal:"International Journal of Refrigeration",year:2004,volume:"27",issue:"8",pages:"965-973",doi:"10.1016/j.ijrefrig.2004.06.008",doiUrl:"https://doi.org/10.1016/j.ijrefrig.2004.06.008",citations:87,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"A graph-theory steady-state model represents fin-and-tube heat exchangers with flexible refrigerant circuits, fin conduction, and refrigerant distribution. Directed graphs, breadth- and depth-first traversal, and an alternating iteration scheme provide efficient solution of conservation equations. Experimental validation keeps maximum error within about 10%, and the resulting simulator has been used in practical heat-exchanger design.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S0140700704001240",abstractLicense:"",keywords:[],sections:["3.1.1","3.1.3"],originalCitation:"
