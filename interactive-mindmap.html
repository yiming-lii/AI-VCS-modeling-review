 L. McClain",journal:"International Journal of Heat and Mass Transfer",year:2001,volume:"44",issue:"4",pages:"763-770",doi:"10.1016/s0017-9310(00)00139-3",doiUrl:"https://doi.org/10.1016/s0017-9310(00)00139-3",citations:228,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"Artificial neural networks are evaluated for estimating fin-tube refrigeration heat-exchanger duty from limited manufacturer measurements. Well-trained networks can approach measurement uncertainty, but sparse or poorly distributed training cases cause large errors. A cross-validation procedure identifies unreliable operating regions, bounds expected heat-rate error, and helps determine where additional experiments are needed.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S0017931000001393",abstractLicense:"",keywords:[],sections:["3.1.1"],originalCitation:"Pacheco-Vega A, Sen M, Yang KT, McClain RL. Neural network analysis of fin-tube refrigerating heat exchanger with limited experimental data. International Journal of Heat and Mass Transfer. 2001;44(4):763-70.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fs0017-9310%2800%2900139-3",note:"",isRetracted:!1},{id:"ref-76",number:76,numbers:[76],type:"journal-article",title:"Model-based dimensionless neural networks for fin-and-tube condenser performance evaluation",authors:"Liang Yang; Ze-Yu Li; Liang-Liang Shao; Chun-Lu Zhang",journal:"International Journal of Refrigeration",year:2014,volume:"48",issue:"",pages:"1-9",doi:"10.1016/j.ijrefrig.2014.01.006",doiUrl:"https://doi.org/10.1016/j.ijrefrig.2014.01.006",citations:12,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"A dimensionless neural-network model evaluates fin-and-tube condenser performance using physically derived Pi groups as inputs and outputs. Comparison with a validated first-principles tube-by-tube model shows accurate capacity and pressure-drop predictions. Tests across refrigerants indicate useful generalization when the dimensionless operating groups remain within the training domain.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S0140700714000206",abstractLicense:"",keywords:[],sections:["3.1.1"],originalCitation:"Yang L, Li Z-Y, Shao L-L, Zhang C-L. Model-based dimensionless neural networks for fin-and-tube condenser performance evaluation. International Journal of Refrigeration. 2014;48:1-9.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.ijrefrig.2014.01.006",note:"",isRetracted:!1},{id:"ref-77",number:77,numbers:[77],type:"journal-article",title:"Simulation model for complex refrigeration systems based on two-phase fluid network \u2013 Part I: Model development",authors:"Shuangquan Shao; Wenxing Shi; Xianting Li; Qisen Yan",journal:"International Journal of Refrigeration",year:2008,volume:"31",issue:"3",pages:"490-499",doi:"10.1016/j.ijrefrig.2007.07.001",doiUrl:"https://doi.org/10.1016/j.ijrefrig.2007.07.001",citations:46,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"A two-phase fluid-network framework simulates complex refrigeration and heat-pump systems whose heat-exchanger roles or flow directions may change. Distributed heat-exchanger and pipe models are coupled with map-based compressor and expansion-valve models, and mass, momentum, and energy equations are solved iteratively. Heating and cooling experiments on an inverter air conditioner validate the general multi-mode formulation.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S0140700707001247",abstractLicense:"",keywords:[],sections:["3.1.3"],originalCitation:"Shao S, Shi W, Li X, Yan Q. Simulation model for complex refrigeration systems based on two-phase fluid network - Part I: Model development. International Journal of Refrigeration. 2008;31(3):490-9.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.ijrefrig.2007.07.001",note:"",isRetracted:!1},{id:"ref-78",number:78,numbers:[78],type:"journal-article",title:"A tripartite graph based methodology for steady-state solution of generalized multi-mode vapor compression systems",authors:"Ransisi Huang; Vikrant Aute; Jiazhen Ling",journal:"Applied Thermal Engineering",year:2021,volume:"185",issue:"",pages:"116385",doi:"10.1016/j.applthermaleng.2020.116385",doiUrl:"https://doi.org/10.1016/j.applthermaleng.2020.116385",citations:6,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"A general component-based solver represents vapor-compression systems using a tripartite graph. Flow-direction propagation and graph tearing determine the calculation sequence and the variables needed to close the system equations. Tests on six systems with different configurations and refrigerants show that the method can accommodate multiple operating modes while maintaining useful agreement with existing simulations and experiments.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.semanticscholar.org/paper/356ded85e67f437c036f2475625a890e971a253b",abstractLicense:"",keywords:[],sections:["3.1.3"],originalCitation:"Huang R, Aute V, Ling J. A tripartite graph based methodology for steady-state solution of generalized multi-mode vapor compression systems. Applied Thermal Engineering. 2021;185:116385.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.applthermaleng.2020.116385",note:"",isRetracted:!1},{id:"ref-79",number:79,numbers:[79],type:"journal-article",title:"A general simulation model for variable refrigerant flow multi-split air conditioning system based on graph theory",authors:"Haoran Sun; Guoliang Ding; Haitao Hu; Tao Ren; Guanghui Xia; Guoming Wu",journal:"International Journal of Refrigeration",year:2017,volume:"82",issue:"",pages:"22-35",doi:"10.1016/j.ijrefrig.2017.07.003",doiUrl:"https://doi.org/10.1016/j.ijrefrig.2017.07.003",citations:20,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"A graph-theory model represents variable-refrigerant-flow multi-split systems with arbitrary layouts and operating indoor-unit combinations. Directed graphs, adjacency and diagonal matrices, component models, and graph-based traversal form a general cooling/heating simulation and solution method. Experiments show small deviations in capacity, temperature, and pressure.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S0140700717302839",abstractLicense:"",keywords:[],sections:["3.1.3"],originalCitation:"Sun H, Ding G, Hu H, Ren T, Xia G, Wu G. A general simulation model for variable refrigerant flow multi-split air conditioning system based on graph theory. International Journal of Refrigeration. 2017;82:22-35.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.ijrefrig.2017.07.003",note:"",isRetracted:!1},{id:"ref-80",number:80,numbers:[80],type:"journal-article",title:"A physics-data fusion framework for fast modeling of variable refrigerant flow system using exact and trend-based physics-constrained learning",authors:"Yanhua Guo; Zhuang Chen; Yaran Liang; Shuangquan Shao; Ningbo Wang; Bo Tian; Qingzhuang Wu; Hui Zhang; Hongsheng Li; Feifei Huang; Jiaxin Hou",journal:"Energy",year:2026,volume:"351",issue:"",pages:"140776",doi:"10.1016/j.energy.2026.140776",doiUrl:"https://doi.org/10.1016/j.energy.2026.140776",citations:1,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"A multiscale physics-data fusion framework rapidly constructs variable-refrigerant-flow digital models. Exact and trend-based physics constraints guide component neural networks, while a two-phase fluid network assembles the system automatically. Broad-condition tests show high accuracy and a simulation-time reduction from minutes to seconds; a real-time optimization case also lowers daily power use.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S0360544226008790",abstractLicense:"",keywords:[],sections:["3.1.3"],originalCitation:"Guo Y, Chen Z, Liang Y, Shao S, Wang N, Tian B, et al. A physics-data fusion framework for fast modeling of variable refrigerant flow system using exact and trend-based physics-constrained learning. Energy. 2026;351:140776.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.energy.2026.140776",note:"",isRetracted:!1},{id:"ref-81",number:81,numbers:[81],type:"journal-article",title:"Review on the measurement and calculation of frost characteristics",authors:"Mengjie Song; Chaobin Dang",journal:"International Journal of Heat and Mass Transfer",year:2018,volume:"124",issue:"",pages:"586-614",doi:"10.1016/j.ijheatmasstransfer.2018.03.094",doiUrl:"https://doi.org/10.1016/j.ijheatmasstransfer.2018.03.094",citations:207,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"The review compares experimental methods, correlations, and mathematical descriptions used to characterize frost formation. Topics include layer thickness, deposition rate, density, thermal conductivity, morphology, and coupled heat and mass transfer. It also identifies gaps that limit prediction and control of frosting and defrosting processes.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.semanticscholar.org/paper/997cf143cdba8879dae58f0bd7afd0a6359eed50",abstractLicense:"",keywords:[],sections:["3.1.4"],originalCitation:"Song M, Dang C. Review on the measurement and calculation of frost characteristics. International Journal of Heat and Mass Transfer. 2018;124:586-614.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.ijheatmasstransfer.2018.03.094",note:"",isRetracted:!1},{id:"ref-82",number:82,numbers:[82],type:"journal-article",title:"Review of defrosting methods",authors:"Mohammed Amer; Chi-Chuan Wang",journal:"Renewable and Sustainable Energy Reviews",year:2017,volume:"73",issue:"",pages:"53-74",doi:"10.1016/j.rser.2017.01.120",doiUrl:"https://doi.org/10.1016/j.rser.2017.01.120",citations:215,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"This review compares passive, active, and system-level defrosting methods for HVAC and refrigeration. It covers engineered surfaces, electrohydrodynamics, low-frequency and ultrasonic vibration, reverse-cycle hot gas, electric heating, desiccants, and control strategies. The evidence highlights promising surface and ultrasonic approaches, strong reverse-cycle performance, and the continuing need to validate control reliability across systems and environments.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S1364032117301302",abstractLicense:"",keywords:[],sections:["3.1.4"],originalCitation:"Amer M, Wang C-C. Review of defrosting methods. Renewable and Sustainable Energy Reviews. 2017;73:53-74.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.rser.2017.01.120",note:"",isRetracted:!1},{id:"ref-83",number:83,numbers:[83],type:"journal-article",title:"Frosting and defrosting characteristics of household refrigerators and freezers: Recent progress and perspectives",authors:"Guoqiang Liu; Tong Xiong; Tengfei Sun; Guixiang He; Gang Yan",journal:"Energy and Buildings",year:2024,volume:"303",issue:"",pages:"113755",doi:"10.1016/j.enbuild.2023.113755",doiUrl:"https://doi.org/10.1016/j.enbuild.2023.113755",citations:26,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"This review synthesizes research from 2000\u20132023 on frosting and defrosting in household refrigerators and freezers. It analyzes factors governing evaporator frost formation, no-frost evaporator structures, heat transfer, and pressure drop, then examines defrost energy use and improvement methods. The paper closes with research priorities for reducing performance losses and compartment-temperature disturbances.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S0378778823009854",abstractLicense:"",keywords:[],sections:["3.1.4"],originalCitation:"Liu G, Xiong T, Sun T, He G, Yan G. Frosting and defrosting characteristics of household refrigerators and freezers: Recent progress and perspectives. Energy and Buildings. 2024;303:113755.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.enbuild.2023.113755",note:"",isRetracted:!1},{id:"ref-84",number:84,numbers:[84],type:"journal-article",title:"A review of recent progress in active frost prevention/control techniques in refrigeration and HVAC systems",authors:"Andres Paul Sarmiento; Franciene I.P. de S\xE1 Sarmiento; Amir Shooshtari; Michael Ohadi",journal:"Applied Thermal Engineering",year:2024,volume:"253",issue:"",pages:"123680",doi:"10.1016/j.applthermaleng.2024.123680",doiUrl:"https://doi.org/10.1016/j.applthermaleng.2024.123680",citations:27,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"A review of active frost prevention and removal in refrigeration, heat-pump, and HVAC systems covers inlet-air conditioning, vapor injection, reverse-cycle defrosting, vibration and ultrasound, hot-gas bypass, and applied electric or magnetic fields. It notes that inconsistent evaluation baselines hinder direct comparison and proposes future research directions for efficient, durable frost control.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S1359431124013486",abstractLicense:"",keywords:[],sections:["3.1.4"],originalCitation:"Sarmiento AP, de Sa Sarmiento FIP, Shooshtari A, Ohadi M. A review of recent progress in active frost prevention/control techniques in refrigeration and HVAC systems. Applied Thermal Engineering. 2024;253:123680.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.applthermaleng.2024.123680",note:"",isRetracted:!1},{id:"ref-85",number:85,numbers:[85],type:"journal-article",title:"Experimental study on frost growth and dynamic performance of air source heat pump system",authors:"Xian-Min Guo; Yi-Guang Chen; Wei-Hua Wang; Chun-Zheng Chen",journal:"Applied Thermal Engineering",year:2008,volume:"28",issue:"17-18",pages:"2267-2278",doi:"10.1016/j.applthermaleng.2008.01.007",doiUrl:"https://doi.org/10.1016/j.applthermaleng.2008.01.007",citations:169,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"Experiments relate frost morphology and growth to air-source heat-pump performance. Three stages are identified: initial ice and column formation, radial crystal growth with limited performance impact, and rapid lengthwise growth into a porous frost layer accompanied by steep capacity and COP decline. Frost growth and degradation are greatest near 0 \xB0C under the tested humidity conditions.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S1359431108000203",abstractLicense:"",keywords:[],sections:["3.1.4"],originalCitation:"Guo X-M, Chen Y-G, Wang W-H, Chen C-Z. Experimental study on frost growth and dynamic performance of air source heat pump system. Applied Thermal Engineering. 2008;28(17-18):2267-78.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.applthermaleng.2008.01.007",note:"",isRetracted:!1},{id:"ref-86",number:86,numbers:[86],type:"journal-article",title:"Prediction of the frost growth and performance change of air source heat pump system under various frosting conditions",authors:"Yoong Chung; Jin Woo Yoo; Gwi Taek Kim; Min Soo Kim",journal:"Applied Thermal Engineering",year:2019,volume:"147",issue:"",pages:"410-420",doi:"10.1016/j.applthermaleng.2018.10.085",doiUrl:"https://doi.org/10.1016/j.applthermaleng.2018.10.085",citations:82,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"A system model predicts frost accumulation and the resulting degradation of an air-source heat pump. The evaporator calculation includes latent heat and spatially uneven frosting, which changes airflow and pressure losses. Experimental comparisons support the model and indicate that much of the performance deterioration occurs late in the frosting cycle; frost mass alone is not a reliable measure of the loss.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.semanticscholar.org/paper/4bc16b12442f6ef5d2f89a6073592ce794926936",abstractLicense:"",keywords:[],sections:["3.1.4"],originalCitation:"Chung Y, Yoo JW, Kim GT, Kim MS. Prediction of the frost growth and performance change of air source heat pump system under various frosting conditions. Applied Thermal Engineering. 2019;147:410-20.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.applthermaleng.2018.10.085",note:"",isRetracted:!1},{id:"ref-87",number:87,numbers:[87],type:"journal-article",title:"Development and validation of a dynamic modeling framework for air-source heat pumps under cycling of frosting and reverse-cycle defrosting",authors:"Jiacheng Ma; Donghun Kim; James E. Braun; W. Travis Horton",journal:"Energy",year:2023,volume:"272",issue:"",pages:"127030",doi:"10.1016/j.energy.2023.127030",doiUrl:"https://doi.org/10.1016/j.energy.2023.127030",citations:37,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"A first-principles dynamic framework simulates air-source heat pumps through repeated frosting and reverse-cycle defrosting. Frost formation and melting are integrated with a finite-volume evaporator to represent nonuniform behavior, flow reversal, and mode switching. Residential-unit experiments show that the model reproduces heating/defrost cycles accurately and remains numerically stable across transitions.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S0360544223004243",abstractLicense:"",keywords:[],sections:["3.1.4"],originalCitation:"Ma J, Kim D, Braun JE, Horton WT. Development and validation of a dynamic modeling framework for air-source heat pumps under cycling of frosting and reverse-cycle defrosting. Energy. 2023;272:127030.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.energy.2023.127030",note:"",isRetracted:!1},{id:"ref-88",number:88,numbers:[88],type:"journal-article",title:"Deep learning-based prediction method on performance change of air source heat pump system under frosting conditions",authors:"Yong Hwan Eom; Yoong Chung; Minsu Park; Sung Bin Hong; Min Soo Kim",journal:"Energy",year:2021,volume:"228",issue:"",pages:"120542",doi:"10.1016/j.energy.2021.120542",doiUrl:"https://doi.org/10.1016/j.energy.2021.120542",citations:77,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"Since frost on an outdoor heat exchanger in winter reduces the performance of an air source heat pump (ASHP), a defrosting process is necessary to restore the degraded performance. Therefore, frosting and defrosting are crucial challenges. For a more efficient defrosting process, many researchers have conducted studies on demand-based defrosting control so far. Recently, various researches on frost growth prediction using neural networks have been conducted. Here, we propose a novel method to quantitatively predict changes in the performance (heating capacity, power consumption, and COP) of ASHPs due to frost growth using a single model based on deep learning. Based on prediction results, this method can be utilized to optimize the defrosting start control strategy. With multiple outputs regression models, we can predict three performance parameters simultaneously. They are models trained with only the initially installed sensors without additional sensors. Besides, we compared the prediction accuracy differences depending on three deep learning structures, such as a fully-connected deep neural network (FCDNN), convolutional neural network (CNN), and long short-term memory (LSTM). Summarizing the results, the optimal FCDNN-based model achieved a root-mean-square (RMS) error of 2.8% for the prediction of heating capacity, 2.4% for power consumption, and 3.4% for COP of ASHPs. (c) 2021 Published by Elsevier Ltd.",abstractKind:"abstract",abstractSource:"User-provided literature library",abstractUrl:"",abstractLicense:"",keywords:["Air source heat pump","Frost growth","Defrosting start control","Deep learning","Quantitative prediction","Multiple outputs regression"],sections:["3.1.4"],originalCitation:"Eom YH, Chung Y, Park M, Hong SB, Kim MS. Deep learning-based prediction method on performance change of air source heat pump system under frosting conditions. Energy. 2021;228:120542.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.energy.2021.120542",note:"",isRetracted:!1},{id:"ref-89",number:89,numbers:[89],type:"journal-article",title:"Dynamic modeling and defrost optimization for air source heat pumps: A deep learning and autoregression approach",authors:"Lei Chen; Wenpeng Wang; Xueyuan Yang; Hecheng Liu; Ruhao Ou",journal:"Energy and Buildings",year:2024,volume:"322",issue:"",pages:"114689",doi:"10.1016/j.enbuild.2024.114689",doiUrl:"https://doi.org/10.1016/j.enbuild.2024.114689",citations:21,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"Air source heat pumps (ASHPs) are celebrated for their exceptional energy efficiency and their capacity to curtail greenhouse gas emissions. However, a critical challenge in ASHPs research is the effective and accurate management of the defrosting process to preserve peak performance. The development of robust and precise simulation models is crucial yet complex for formulating and assessing defrosting strategies. To address this, our study investigates the integration of deep learning models with feature encoding to establish dynamic models for ASHPs. We evaluated various deep learning architectures, achieving a Mean Absolute Percentage Error (MAPE) of 3.5% in heating capacity predictions. Moreover, our analysis reveals that feature encoding substantially lowers the MAPE by 12%, thereby enhancing model accuracy. We employed a comprehensive suite of evaluation metrics to benchmark the performance across models, finding that the Temporal Convolutional Network (TCN) marginally surpasses others, including Transformer, LSTM, and LightGBM models. Additionally, we utilized transfer learning to boost the generalization capabilities models across different outdoor conditions (temperature and humidity), facilitating effective few-shot training. Finally, our study introduces a novel defrosting control strategy based on Heating Capacity Degradation (HCD). Using dynamic modeling, we determined optimal control thresholds (89%94%) that ensure maximum heating efficiency during frosting conditions. This strategy improves the average heating capacity by 101-278 W compared to conventional defrosting methods. The insights from this research not only advance defrosting control but also serve as a valuable reference for dynamic modeling and control optimization in the heat pump sector. The proposed control method enhances ASHPs performance and energy efficiency, supporting efforts towards achieving carbon neutrality.",abstractKind:"abstract",abstractSource:"User-provided literature library",abstractUrl:"",abstractLicense:"",keywords:["Air source heat pump","Defrosting control","Dynamic model","Transfer learning","Deep learning"],sections:["3.1.4"],originalCitation:"Chen L, Wang W, Yang X, Liu H, Ou R. Dynamic modeling and defrost optimization for air source heat pumps: A deep learning and autoregression approach. Energy and Buildings. 2024;322:114689.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.enbuild.2024.114689",note:"",isRetracted:!1},{id:"ref-90",number:90,numbers:[90],type:"journal-article",title:"Towards maximum efficiency in heat pump operation: Self-optimizing defrost initiation control using deep reinforcement learning",authors:"Jonas Klingebiel; Moritz Salamon; Plamen Bogdanov; Valerius Venzik; Christian Vering; Dirk M\xFCller",journal:"Energy and Buildings",year:2023,volume:"297",issue:"",pages:"113397",doi:"10.1016/j.enbuild.2023.113397",doiUrl:"https://doi.org/10.1016/j.enbuild.2023.113397",citations:37,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"A deep-reinforcement-learning controller learns when to initiate air-source heat-pump defrosting under changing frost conditions using standard refrigerant-cycle sensors. Rather than relying on fixed heuristic thresholds, it maximizes overall efficiency through trial and error. A 31-day simulation outperforms time- and demand-based controls, though real-equipment deployment still requires further study.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S0378778823006278",abstractLicense:"",keywords:[],sections:["3.1.4"],originalCitation:"Klingebiel J, Salamon M, Bogdanov P, Venzik V, Vering C, Mueller D. Towards maximum efficiency in heat pump operation: Self-optimizing defrost initiation control using deep reinforcement learning. Energy and Buildings. 2023;297:113397.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.enbuild.2023.113397",note:"",isRetracted:!1},{id:"ref-91",number:91,numbers:[91],type:"journal-article",title:"Deep learning-based image recognition method for on-demand defrosting control to save energy in commercial energy systems",authors:"Siliang Chen; Kang Chen; Xu Zhu; Xinqiao Jin; Zhimin Du",journal:"Applied Energy",year:2022,volume:"324",issue:"",pages:"119702",doi:"10.1016/j.apenergy.2022.119702",doiUrl:"https://doi.org/10.1016/j.apenergy.2022.119702",citations:33,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"A convolutional image-recognition method enables extensible on-demand defrost control in commercial systems. Deep clustering, augmentation, and hyperparameter optimization reduce labeling effort and raise frost-state recognition accuracy. Field tests versus fixed-interval defrosting show lower frequency, duration, and energy use, with favorable economic and carbon-reduction estimates.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S0306261922009965",abstractLicense:"",keywords:[],sections:["5"],originalCitation:"Chen S, Chen K, Zhu X, Jin X, Du Z. Deep learning-based image recognition method for on-demand defrosting control to save energy in commercial energy systems. Applied Energy. 2022;324:119702.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.apenergy.2022.119702",note:"",isRetracted:!1},{id:"ref-92",number:92,numbers:[92],type:"journal-article",title:"Study on a novel defrost control method based on the surface texture of evaporator image with gray-level cooccurrence matrix, new characterization parameter combination and machine learning",authors:"Yingjie Xu; Yong Xie; Xiaopo Wang; Xi Shen; Mengjie Song; Wei Hang",journal:"Energy and Buildings",year:2023,volume:"292",issue:"",pages:"113173",doi:"10.1016/j.enbuild.2023.113173",doiUrl:"https://doi.org/10.1016/j.enbuild.2023.113173",citations:18,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"The paper combines an optimized gray-level co-occurrence matrix with an extreme learning machine to recognize evaporator frost from image texture. Tests vary illumination, camera angle, and pixel resolution and classify either three frost levels or a binary defrost state. The method achieves approximately 98\u201399% average accuracy and outperforms support-vector and backpropagation alternatives under complex conditions.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl ef.org/works/10.1016%2Fj.ijrefrig.2024.01.025",note:"",isRetracted:!1},{id:"ref-94",number:94,numbers:[94],type:"journal-article",title:"Predicting particle deposition on HVAC heat exchangers",authors:"Jeffrey A Siegel; William W Nazaroff",journal:"Atmospheric Environment",year:2003,volume:"37",issue:"39-40",pages:"5587-5596",doi:"10.1016/j.atmosenv.2003.09.033",doiUrl:"https://doi.org/10.1016/j.atmosenv.2003.09.033",citations:91,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"A fin-and-tube HVAC fouling model combines deterministic impaction, settling, and diffusion with Monte Carlo treatment of turbulent impaction. Experiments across several air speeds show deposition below 2% for submicron particles and increasing importance of fin-edge impaction, settling, and tube impaction for larger particles. Qualitative agreement is good, although the model underpredicts some high-velocity deposition.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S1352231003007751",abstractLicense:"",keywords:[],sections:["3.1.5"],originalCitation:"Siegel JA, Nazaroff WW. Predicting particle deposition on HVAC heat exchangers. Atmospheric Environment. 2003;37:5587-96.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.atmosenv.2003.09.033",note:"",isRetracted:!1},{id:"ref-95",number:95,numbers:[95],type:"journal-article",title:"Gas-side fouling, erosion and corrosion of heat exchangers for middle/low temperature waste heat utilization: A review on simulation and experiment",authors:"Ming-Jia Li; Song-Zhen Tang; Fei-long Wang; Qin-Xin Zhao; Wen-Quan Tao",journal:"Applied Thermal Engineering",year:2017,volume:"126",issue:"",pages:"737-761",doi:"10.1016/j.applthermaleng.2017.07.095",doiUrl:"https://doi.org/10.1016/j.applthermaleng.2017.07.095",citations:145,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"This review surveys mechanisms, prediction models, simulations, and experiments for gas-side fouling, erosion, and corrosion in medium- and low-temperature waste-heat exchangers. Representative rate-prediction workflows are described, and unresolved needs are identified in mechanism understanding and the design of heat exchangers resistant to ash deposition, wear, and corrosive flue-gas constituents.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S1359431117336244",abstractLicense:"",keywords:[],sections:["3.1.5"],originalCitation:"Li M-J, Tang S-Z, Wang F-L, Zhao Q-X, Tao W-Q. Gas-side fouling, erosion and corrosion of heat exchangers for middle/low temperature waste heat utilization: A review on simulation and experiment. Applied Thermal Engineering. 2017;126:737-61.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.applthermaleng.2017.07.095",note:"",isRetracted:!1},{id:"ref-96",number:96,numbers:[96],type:"journal-article",title:"Numerical study on polydisperse particle deposition in a compact heat exchanger",authors:"S. Baghdar Hosseini; R. Haghighi Khoshkhoo; S.M. Javadi Malabad",journal:"Applied Thermal Engineering",year:2017,volume:"127",issue:"",pages:"330-346",doi:"10.1016/j.applthermaleng.2017.08.023",doiUrl:"https://doi.org/10.1016/j.applthermaleng.2017.08.023",citations:32,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"A three-dimensional CFD study tracks polydisperse particles through compact heat-exchanger fin channels using RANS flow and a Lagrangian discrete-particle model. Deposition concentrates near channel fronts and fin edges, varies non-monotonically with particle size, and is affected by interactions among size groups. Increasing air velocity can either promote or suppress deposition depending on the particle regime.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S1359431117316605",abst icle deposition on wet fin surfaces of heat exchanger under dehumidifying conditions",authors:"Feilong Zhan; Guoliang Ding; Dawei Zhuang",journal:"International Journal of Heat and Mass Transfer",year:2020,volume:"149",issue:"",pages:"119258",doi:"10.1016/j.ijheatmasstransfer.2019.119258",doiUrl:"https://doi.org/10.1016/j.ijheatmasstransfer.2019.119258",citations:32,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"A numerical deposition model distinguishes particles captured by condensate from particles adhering to an already wet dust layer. Particle paths and a sticking-velocity criterion predict the deposited shape and mass. Experiments support the predictions, and operating-condition analysis identifies inlet humidity and airborne particle concentration as particularly important influences.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.semanticscholar.org/paper/65056e6cfcbdf335be519e20bc12c21752d82b72",abstractLicense:"",keywords:[],sections:["3.1.5"],originalCitation:"Zhan F, Ding G, Zhuang D. Numerical model of particle deposition on wet fin surfaces of heat exchanger under dehumidifying conditions. International Journal of Heat and Mass Transfer. 2020;151:119258.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.ijheatmasstransfer.2019.119258",note:"",isRetracted:!1},{id:"ref-102",number:102,numbers:[102],type:"journal-article",title:"Fouling characteristics analysis and morphology prediction of heat exchangers with a particulate fouling model considering deposition and removal mechanisms",authors:"Song-Zhen Tang; Fei-Long Wang; Qinlong Ren; Ya-Ling He",journal:"Fuel",year:2017,volume:"203",issue:"",pages:"725-738",doi:"10.1016/j.fuel.2017.03.049",doiUrl:"https://doi.org/10.1016/j.fuel.2017.03.049",citations:117,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"A CFD fouling framework combines discrete particles, dynamic meshes, energy-based deposition, and critical-moment removal to predict fly-ash growth in tube bundles. Including removal changes fouling mass from nearly linear growth to an asymptotic trend. Simulations quantify effects of particle size and gas velocity and predict evolving morphology and heat-transfer degradation.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S0016236117303253",abstractLicense:"",keywords:[],sections:["3.1.5"],originalCitation:"Tang S-Z, Wang F-L, Ren Q, He Y-L. Fouling characteristics analysis and morphology prediction of heat exchangers with a particulate fouling model considering deposition and removal mechanisms. Fuel. 2017;203:725-38.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.fuel.2017.03.049",note:"",isRetracted:!1},{id:"ref-103",number:103,numbers:[103],type:"journal-article",title:"Real-time fouling characteristics of a typical heat exchanger used in the waste heat recovery systems",authors:"Fei-Long Wang; Ya-Ling He; Zi-Xiang Tong; Song-Zhen Tang",journal:"International Journal of Heat and Mass Transfer",year:2017,volume:"104",issue:"",pages:"774-786",doi:"10.1016/j.ijheatmasstransfer.2016.08.112",doiUrl:"https://doi.org/10.1016/j.ijheatmasstransfer.2016.08.112",citations:134,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"A real-time heat-exchanger fouling model integrates particle deposition and shear-driven removal with CFD and discrete-particle tracking. A time-scaling ratio maps short numerical simulations to realistic fouling durations. Fouling develops mainly in stagnation and recirculation zones, approaches an asymptote, and decreases as inlet velocity or particle diameter increases under the studied conditions; experiments provide validation.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S0017931016312157",abstractLicense:"",keywords:[],sections:["3.1.5 dust environment",authors:"Long Miao; Yichun Wang; Revaz Kavtaradze; Fen Guo; Yawen Li",journal:"International Journal of Heat and Mass Transfer",year:2021,volume:"168",issue:"",pages:"120879",doi:"10.1016/j.ijheatmasstransfer.2020.120879",doiUrl:"https://doi.org/10.1016/j.ijheatmasstransfer.2020.120879",citations:15,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"Experiments and simulations examine wavy-fin heat exchangers exposed to airborne sand and dust. Particle size and concentration influence both heat transfer and pressure loss through two-way interaction with the air. Regression correlations are developed for the Colburn and friction factors. Overall thermal-hydraulic performance is slightly lower than in clean-air operation, although the reported change is small.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.semanticscholar.org/paper/50152da95bed9b48cf8f6b00ac34f9f2e6ba70f1",abstractLicense:"",keywords:[],sections:["3.1.5"],originalCitation:"Miao L, Wang Y, Kavtaradze R, Guo F, Li Y. Investigation of the heat transfer and flow characteristics in wavy fins of compact heat exchanger in a sand-dust environment. International Journal of Heat and Mass Transfer. 2021;163:120879.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.ijheatmasstransfer.2020.120879",note:"",isRetracted:!1},{id:"ref-106",number:106,numbers:[106],type:"journal-article",title:"A CFD study of particle deposition in three-dimensional heat exchange channel based on an improved deposition model",authors:"Hao Lu; Yunyun Quan",journal:"International Journal of Heat and Mass Transfer",year:2021,volume:"178",issue:"",pages:"121633",doi:"10.1016/j.ijheatmasstransfer.2021.121633",doiUrl:"https://doi.org/10.1016/j.ijheatmasstransfer.2021.121633",citations:62,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"A three-dimensional CFD study uses a Reynolds-stress flow model and an improved discrete-particle deposition model incorporating turbulent fluctuations and rebound in a ribbed heat-exchange channel. Ribs, corner secondary flow, recirculating cavities, gravity, and rebound govern where particles accumulate. Particle size, rib spacing-to-height ratio, and air velocity strongly affect wall-specific deposition efficiency.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S0017931021007365",abstractLicense:"",keywords:[],sections:["3.1.5"],originalCitation:"Lu H, Quan Y. A CFD study of particle deposition in three-dimensional heat exchange channel based on an improved deposition model. International Journal of Heat and Mass Transfer. 2021;178:121633.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.ijheatmasstransfer.2021.121633",note:"",isRetracted:!1},{id:"ref-107",number:107,numbers:[107],type:"journal-article",title:"Investigation of deposition characteristics on tube-bundle heat exchanger with an improved ash particle model",authors:"Zhiming Xu; Jinhui Li; Zhimin Han; Xinrui Yang",journal:"Powder Technology",year:2023,volume:"413",issue:"",pages:"118027",doi:"10.1016/j.powtec.2022.118027",doiUrl:"https://doi.org/10.1016/j.powtec.2022.118027",citations:25,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"A random-function particle model coupled with dynamic meshes predicts fly-ash deposition and the evolving surface geometry of tube bundles. Simulations show different velocity trends for small and large particles and a non-monotonic dependence on particle size for inline arrangements. Deposits form first on upstream windward surfaces and diminish along downstream rows.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S0032591022009081",abstractLicense:"",keywords:[],sections:["3.1.5"],originalCitation:"Xu Z, Li J, Han Z, Yang X. Investigation of deposition characteristics on tube-bundle heat exchanger with an improved ash particle model. Powder Technology. 2023;413:118027.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.powtec.2022.118027",note:"",isRetracted:!1},{id:"ref-108",number:108,numbers:[108],type:"journal-article",title:"Estimation and sensitivity analysis of fouling resistance in phosphoric acid/steam heat exchanger using artificial neural networks and regression methods",authors:"Rania Jradi; Christophe Marvillet; Mohamed Razak Jeday",journal:"Scientific Reports",year:2023,volume:"13",issue:"1",pages:"17889",doi:"10.1038/s41598-023-44516-6",doiUrl:"https://doi.org/10.1038/s41598-023-44516-6",citations:14,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"Abstract One of the most frequent problem in phosphoric acid concentration plant is the heat exchanger build-up. This problem causes a reduction of the performance of this equipment and an increase of energy losses which lead to damage the apparatus. In this study, estimation of fouling resistance in a cross-flow heat exchanger was solved using a linear [Partial Least Squares (PLS)] and non linear [Artificial Neural Network (ANN)] methods. Principal Component Analysis (PCA) and Step Wise Regression (SWR) were preceded the modeling in order to determine the highest relation between operating parameters with the fouling resistance. The values of correlation coefficient (r 2 ) and predictive ability which are equal to 0.992 and 87%, respectively showed a good prediction of the developed PLS model. In order to improve the results obtained by PLS method, an ANN model was developed. 361 experimental data points was used to design and train the network. A network containing 6 hidden neurons trained with Broyden\u2013Fletcher\u2013Goldfarb\u2013Shanno (BFGS) algorithm and hyperbolic tangent sigmoid transfer function for the hidden and output layers was selected to be the optimal configuration. The Garson\u2019s equation was applied to determine the sensitivity of input parameters on fouling resistance based on ANN results. Results indicated that acid inlet and outlet temperatures were the high relative important parameters on fouling resistance with importance equal to 56% and 15.4%, respectively.",abstractKind:"abstract",abstractSource:"Open-license abstract",abstractUrl:"https://api.crossref.org/works/10.1038%2Fs41598-023-44516-6",abstractLicense:"https://creativecommons.org/licenses/by/4.0",keywords:[],sections:["3.1.5"],originalCitation:"Jradi R, Marvillet C, Jeday MR. Estimation and sensitivity analysis of fouling resistance in phosphoric acid/steam heat exchanger using artificial neural networks and regression methods. Scientific Reports. 2023;13:17474.",metadataUrl:"https://api.crossref.org/works/10.1038%2Fs41598-023-44516-6",note:"",isRetracted:!1},{id:"ref-109",number:109,numbers:[109],type:"journal-article",title:"Data-Driven Soft Sensor for Crude Oil Fouling Monitoring in Heat Exchanger Networks",authors:"Xutao Mei; Hikaru Kiyomoto; Shoma Kato; Yasuki Kansha",journal:"IEEE Sensors Journal",year:2023,volume:"23",issue:"21",pages:"26336-26346",doi:"10.1109/jsen.2023.3317936",doiUrl:"https://doi.org/10.1109/jsen.2023.3317936",citations:8,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"An industrial-data model is developed to monitor and forecast crude-oil fouling in heat-exchanger networks. The approach learns relationships among operating measurements rather than relying solely on reaction-based fouling equations. Validation across different periods gives agreement with measured fouling near an R-squared value of 0.90, supporting its use in planning cleaning schedules.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://api.openalex.org/works/W4387092543",abstractLicense:"",keywords:[],sections:["3.1.5"],originalCitation:"Mei X, Kiyomoto H, Kato S, Kansha Y. Data-Driven Soft Sensor for Crude Oil Fouling Monitoring in Heat Exchanger Networks. IEEE Sensors Journal. 2023;23:30459-70.",metadataUrl:"https://api.crossref.org/works/10.1109%2Fjsen.2023.3317936",note:"",isRetracted:!1},{id:"ref-110",number:110,numbers:[110],type:"journal-article",title:"Performance investigation of a hybrid dynamic\u2013reciprocating compression system for compressed air energy storage",authors:"Jiaxin Dong; Shuai Yang; Jun Zhang; Shijie Qin; Dazhuan Wu",journal:"Journal of Energy Storage",year:2026,volume:"176",issue:"",pages:"123500",doi:"10.1016/j.est.2026.123500",doiUrl:"https://doi.org/10.1016/j.est.2026.123500",citations:0,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"A hybrid compressed-air-energy-storage system combines a high-flow dynamic compressor with a high-pressure reciprocating stage. Experiments show that pre-compression broadens the reciprocating compressor's stable flow range, raises cylinder volumetric efficiency, and redistributes work to reduce specific power. Coordinated pressure-ratio and speed control limits pulsation-related excitation.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S2352152X26031646",abstractLicense:"",keywords:[],sections:["3.2"],originalCitation:"Dong J, Yang S, Zhang J, Qin S, Wu D. Performance investigation of a hybrid dynamic\u2013reciprocating compression system for compressed air energy storage. Journal of Energy Storage. 2026;176:123500.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.est.2026.123500",note:"",isRetracted:!1},{id:"ref-111",number:111,numbers:[111],type:"journal-article",title:"A gray-box heat pump system model compatible with building energy modeling engines and reduced quantities of training data",authors:"Shahzad Yousaf; Samee Ullah; Craig R. Bradshaw",journal:"Energy and Buildings",year:2025,volume:"345",issue:"",pages:"116131",doi:"10.1016/j.enbuild.2025.116131",doiUrl:"https://doi.org/10.1016/j.enbuild.2025.116131",citations:9,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"This study applies a previously developed gray-box model for air-conditioning systems [1] to heat pump systems, extending it to accurately predict performance under heating operation. The model maintains its foundational approach as a steady-state, component-based framework that requires minimal data for training (as few as five points) and uses standard inputs for building energy simulation, such as air-side temperatures (outdoor dry and wet bulb, indoor dry bulb), indoor supply airflow rate, and rated system information. A key contribution from this work is reformulation for heat exchanger overall heat transfer coefficient (UA) correlations, utilizing Symbolic Regression (SR) to accommodate heat pump operation. The model was tested under a full training data set, four low-training data scenarios, and two extrapolation scenarios, demonstrating robust predictive performance. The data used for comparison is from three, advanced, split-system heat pump systems with capacities of 12.30 kW (3.5 tons), 14 kW(4 tons), and 17.60 kW(5 tons). The model achieved MAPE (mean absolute percentage error) that is under 3 % for heating capacity and 4% for the coefficient of performance (COP). These results highlight the model's capability for accurate performance predictions and its potential for energy management and optimization in heat pump system under varied conditions.",abstractKind:"abstract",abstractSource:"User-provided literature library",abstractUrl:"",abstractLicense:"",keywords:["Semi-physical model","Overall heat transfer coefficient","Symbolic regression","Unitary heat pump system","Energy performance gap"],sections:["3.2","3.2.1"],originalCitation:"Yousaf S, Ullah S, Bradshaw CR. A gray-box heat pump system model compatible with building energy modeling engines and reduced quantities of training data. Energy and Buildings. 2025;345:116131.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.enbuild.2025.116131",note:"",isRetracted:!1},{id:"ref-112",number:112,numbers:[112],type:"journal-article",title:"Development of an automated compressor performance mapping using artificial neural network and multiple compressor technologies",authors:"Jie Ma; Xin Ding; W. Travis Horton; Davide Ziviani",journal:"International Journal of Refrigeration",year:2020,volume:"120",issue:"",pages:"66-80",doi:"10.1016/j.ijrefrig.2020.08.001",doiUrl:"https://doi.org/10.1016/j.ijrefrig.2020.08.001",citations:24,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"The paper proposes automated neural-network mapping of positive-displacement compressor performance using a reduced set of calorimeter measurements. It seeks to identify operating limits and provide a more flexible alternative to standard cubic-polynomial maps. Reciprocating, scroll, and rolling-piston compressors are used to assess the method across different compressor technologies.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.semanticscholar.org/paper/7bc7ed5436b2987e677be63c204cd13321162567",abstractLicense:"",keywords:[],sections:["3.2","3.2.1"],originalCitation:"Ma J, Ding X, Horton WT, Ziviani D. Development of an automated compressor performance mapping using artificial neural network and multiple compressor technologies. International Journal of Refrigeration. 2020;120:66-80.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.ijrefrig.2020.08.001",note:"",isRetracted:!1},{id:"ref-113",number:113,numbers:[113],type:"journal-article",title:"Performance modeling of centrifugal compressor using kernel partial least squares",authors:"Fei Chu; Fuli Wang; Xiaogang Wang; Shuning Zhang",journal:"Applied Thermal Engineering",year:2012,volume:"44",issue:"",pages:"90-99",doi:"10.1016/j.applthermaleng.2012.03.043",doiUrl:"https://doi.org/10.1016/j.applthermaleng.2012.03.043",citations:46,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"Kernel partia om/science/article/pii/S1359431126006150",abstractLicense:"",keywords:[],sections:["3.3"],originalCitation:"Zou L, Liu Y, Yu J. Experimental investigation on a modified ejector-enhanced mechanical dehumidification system with low-GWP refrigerant. Applied Thermal Engineering. 2026:130307.",metadataUrl:"https://api.crossref.org/works/10.1016/j.applthermaleng.2026.130307",note:"The publisher updated the title. Authors, journal and article number match the manuscript reference.",isRetracted:!1},{id:"ref-125",number:125,numbers:[125],type:"journal-article",title:"Experimental investigation and modeling of a hermetic scroll expander",authors:"Fadhel Ayachi; Elias Boulawz Ksayer; Pierre Neveu; Assaad Zoughaib",journal:"Applied Energy",year:2016,volume:"181",issue:"",pages:"256-267",doi:"10.1016/j.apenergy.2016.08.030",doiUrl:"https://doi.org/10.1016/j.apenergy.2016.08.030",citations:49,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"A converted hermetic scroll compressor is experimentally studied as a small organic-Rankine-cycle expander using R245fa. Test data calibrate a semi-empirical steady-state model for pressure loss and internal efficiency that can be embedded in larger system simulations. High supply pressures yield promising generator-expander efficiency, while mismatch from the built-in volume ratio explains performance deterioration.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S0306261916311175",abstractLicense:"",keywords:[],sections:["3.3"],originalCitation:"Ayachi F, El Boulawz Ksayer E, Neveu P, Zoughaib A. Experimental investigation and modeling of a hermetic scroll expander. Applied Energy. 2016;181:256\u201367.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.apenergy.2016.08.030",note:"",isRetracted:!1},{id:"ref-126",number:126,numbers:[126],type:"journal-article",title:"Piston-cylinder work producing expansion device in a transcritical carbon dioxide cycle. Part II: theoretical model",authors:"J.S. Baek; E.A. Groll; P.B. Lawless",journal:"International Journal of Refrigeration",year:2005,volume:"28",issue:"2",pages:"152-164",doi:"10.1016/j.ijrefrig.2004.08.007",doiUrl:"https://doi.org/10.1016/j.ijrefrig.2004.08.007",citations:52,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"A lubrication-theory model describes a piston-cylinder expansion device for transcritical carbon-dioxide cycles, with connecting-rod conversion of piston motion to crank rotation and the piston ring treated as a slippery bearing. The model supports prototype verification, identifies design-stage loss mechanisms, and analyzes the device within the companion experimental cycle.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S0140700704001665",abstractLicense:"",keywords:[],sections:["3.3"],originalCitation:"Baek JS, Groll EA, Lawless PB. Piston-cylinder work producing expansion device in a transcritical carbon dioxide cycle. Part II: Theoretical model. International Journal of Refrigeration. 2005;28(2):152\u201364.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.ijrefrig.2004.08.007",note:"",isRetracted:!1},{id:"ref-127",number:127,numbers:[127],type:"journal-article",title:"Mass flow characteristics prediction of refrigerants through electronic expansion valve based on XGBoost",authors:"Anping Wan; Zhipeng Gong; Ting Chen; Khalil AL-Bukhaiti",journal:"International Journal of Refrigeration",year:2024,volume:"158",issue:"",pages:"345-352",doi:"10.1016/j.ijrefrig.2023.12.011",doiUrl:"https://doi.org/10.1016/j.ijrefrig.2023.12.011",citations:27,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"An XGBoost model predicts refrigerant mass-flow coefficients through electronic expansion valves using published R1233zd(E) and R245fa experiments. Training and test performance show little gap, and most predictions fall within 5% of measurements. The method improves substantially on the original correlations and offers a basis for more accurate refrigeration-system control.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S0140700723004668",abstractLicense:"",keywords:[],sections:["3.3"],originalCitation:"Wan A, Gong Z, Chen T, Al-Bukhaiti K. Mass flow characteristics prediction of refrigerants through electronic expansion valve based on XGBoost. International Journal of Refrigeration. 2024;158:345\u201352.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.ijrefrig.2023.12.011",note:"",isRetracted:!1},{id:"ref-128",number:128,numbers:[128],type:"journal-article",title:"Refrigerant flow through electronic expansion valve: Experiment and neural network modeling",authors:"Xiang Cao; Ze-Yu Li; Liang-Liang Shao; Chun-Lu Zhang",journal:"Applied Thermal Engineering",year:2016,volume:"92",issue:"",pages:"210-218",doi:"10.1016/j.applthermaleng.2015.09.062",doiUrl:"https://doi.org/10.1016/j.applthermaleng.2015.09.062",citations:49,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"Electronic expansion valve (EEV) plays a crucial role in controlling refrigerant mass flow rate of refrigeration or heat pump systems for energy savings. However, complexities in two-phase throttling process and geometry make accurate modeling of EEV flow characteristics more difficult. This paper developed an artificial neural network (ANN) model using refrigerant inlet and outlet pressures, inlet subcooling, EEV opening as ANN inputs, refrigerant mass flow rate as ANN output. Both linear and nonlinear transfer functions in hidden layer were used and compared to each other. Experimental data from multiple sources including in-house experiments of one EEV with R410A were used for ANN training and test. In addition, literature correlations were compared with ANN as well. Results showed that the ANN model with nonlinear transfer function worked well in all cases and it is much accurate than the literature correlations. In all cases, nonlinear ANN predicted refrigerant mass flow rates within +/- 0.4% average relative deviation (A.D.) and 2.7% standard deviation (S.D.), meanwhile it predicted the EEV opening at 0.1% A.D. and 2.1% S.D. (C) 2015 Elsevier Ltd. All rights reserved.",abstractKind:"abstract",abstractSource:"User-provided literature library",abstractUrl:"",abstractLicense:"",keywords:["Electronic expansion valve","Refrigerant","Experiment","Model","Artificial neural network"],sections:["3.3"],originalCitation:"Cao X, Li Z-Y, Shao L-L, Zhang C-L. Refrigerant flow through electronic expansion valve: Experiment and neural network modeling. Applied Thermal Engineering. 2016;92:210\u20138.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.applthermaleng.2015.09.062",note:"",isRetracted:!1},{id:"ref-129",number:129,numbers:[129],type:"journal-article",title:"Accurate modelling of the scroll expander via a mechanism-incorporated data-driven method",authors:"Xin Ma; Xiaoshuang Lv; Chengdong Li; Ke Li",journal:"International Journal of Refrigeration",year:2023,volume:"155",issue:"",pages:"32-46",doi:"10.1016/j.ijrefrig.2023.09.005",doiUrl:"https://doi.org/10.1016/j.ijrefrig.2023.09.005",citations:5,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"A mechanism-incorporated adaptive neuro-fuzzy model predicts scroll-expander volume flow and torque. Least-squares identification first calibrates a mechanistic model, then ANFIS learns its residual errors; their outputs are combined for the final forecast. Comparisons with standalone and hybrid neural, support-vector, and extreme-learning approaches show higher accuracy and robustness.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S0140700723002414",abstractLicense:"",keywords:[],sections:["3.3"],originalCitation:"Ma X, Lv X, Li C, Li K. Accurate modelling of the scroll expander via a mechanism-incorporated data-driven method. International Journal of Refrigeration. 2023;155:32\u201346.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.ijrefrig.2023.09.005",note:"",isRetracted:!1},{id:"ref-130",number:130,numbers:[130],type:"journal-article",title:"System model derivation of the CO2 two-phase ejector based on the CFD-based reduced-order model",authors:"Michal Haida; Jacek Smolka; Armin Hafner; Ziemowit Ostrowski; Michal Palacz; Andrzej J. Nowak; Krzysztof Banasiak",journal:"Energy",year:2018,volume:"144",issue:"",pages:"941-956",doi:"10.1016/j.energy.2017.12.055",doiUrl:"https://doi.org/10.1016/j.energy.2017.12.055",citations:28,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"A reduced-order model of an R744 two-phase ejector combines proper orthogonal decomposition with radial-basis interpolation, using a homogeneous-equilibrium CFD model as its basis. Mass-flow and field validation against CFD and experiments shows useful accuracy across the studied motive-pressure range. Negligible evaluation time makes the model suitable for dynamic refrigeration-system simulation.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S0360544217320881",abstractLicense:"",keywords:[],sections:["3.3"],originalCitation:"Haida M, Smolka J, Hafner A, Ostrowski Z, Palacz M, Nowak AJ, et al. System model derivation of the CO2 two-phase ejector based on the CFD-based reduced-order model. Energy. 2018;144:941\u201356.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.energy.2017.12.055",note:"",isRetracted:!1},{id:"ref-131",number:131,numbers:[131],type:"journal-article",title:"Performance predictions using Artificial Neural Network for isobutane flow in non-adiabatic capillary tubes",authors:"M. Heimel; W. Lang; R. Almbauer",journal:"International Journal of Refrigeration",year:2014,volume:"38",issue:"",pages:"281-289",doi:"10.1016/j.ijrefrig.2013.08.018",doiUrl:"https://doi.org/10.1016/j.ijrefrig.2013.08.018",citations:17,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"An artificial-neural-network model predicts isobutane flow through non-adiabatic capillary-tube/suction-line arrangements. Training data come from a one-dimensional homogeneous model validated against new and published measurements. The method covers choked and non-choked flow, two-phase inlet states, and broad domestic-refrigeration operating ranges that many conventional correlations cannot represent.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://graz.elsevierpure.com/en/publications/performance-predictions-using-artificial-neural-network-for-isobu",abstractLicense:"",keywords:[],sections:["3.3","3.3.2"],originalCitation:"Heimel M, Lang W, Almbauer R. Performance predictions using artificial neural network for isobutane flow in non-adiabatic capillary tubes. International Journal of Refrigeration. 2014;38:281\u20139.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.ijrefrig.2013.08.018",note:"",isRetracted:!1},{id:"ref-132",number:132,numbers:[132],type:"journal-article",title:"Machine learning and CFD for mapping and optimization of CO2 ejectors",authors:"Knut Emil Ringstad; Krzysztof Banasiak; \xC5smund Ervik; Armin Hafner",journal:"Applied Thermal Engineering",year:2021,volume:"199",issue:"",pages:"117604",doi:"10.1016/j.applthermaleng.2021.117604",doiUrl:"https://doi.org/10.1016/j.applthermaleng.2021.117604",citations:53,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"In this study, a novel simulation-based algorithm for CO2 ejector design and performance evaluation is presented. The algorithm is based on an automated Computational Fluid Dynamics (CFD) workflow that can account for different ejector geometries and operating conditions. The CFD data points are used to train a Gaussian Process Regression (GPR) machine learning model to predict the ejector performance indicators; efficiency, mass flow rates, outflow uniformity, and entropy generation. Three use cases are investigated using this methodology: 1) performance mapping for off-design operating conditions of a given ejector, 2) design mapping of ejector performance with 5 geometry variables investigated, and 3) flow structure prediction between different ejector mixing chamber geometries. The results show that this algorithm can be used to efficiently explore ejector designs with mean average errors between 0.07 and 0.1 [\u2013] in entrainment ratio. Furthermore, the method can to look for optimized geometries using gradient descent methods, as well as produce ejector performance maps. Additionally, the method is able to predict local flow structures of velocity and pressure inside the ejector with varied ejector geometries. The databases and GPR method implementation from this work is made available open-source for further development and research.",abstractKind:"abstract",abstractSource:"Open-license abstract",abstractUrl:"https://api.openalex.org/works/W3202243975",abstractLicense:"http://creativecommons.org/licenses/by/4.0/",keywords:[],sections:["3.3"],originalCitation:"Ringstad KE, Banasiak K, Ervik \xC5, Hafner A. Machine learning and CFD for mapping and optimization of CO2 ejectors. Applied Thermal Engineering. 2021;199:117604.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.applthermaleng.2021.117604",note:"",isRetracted:!1},{id:"ref-133",number:133,numbers:[133],type:"journal-article",title:"Generalized correlation of refrigerant mass flow rate through adiabatic capillary tubes using artificial neural network",authors:"Chun-Lu Zhang",journal:"International Journal of Refrigeration",year:2005,volume:"28",issue:"4",pages:"506-514",doi:"10.1016/j.ijrefrig.2004.11.004",doiUrl:"https://doi.org/10.1016/j.ijrefrig.2004.11.004",citations:59,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"A generalized adiabatic-capillary mass-flow correlation combines dimensional analysis with a three-layer feedforward neural network. Dimensionless groups reduce the number of inputs, while data for seven refrigerants train and test the nonlinear predictor. A single hidden neuron fits the training set well, and out-of-domain test behavior is interpreted using a homogeneous-equilibrium model.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://iifiir.org/en/fridoc/generalized-correlation-of-refrigerant-mass-flow-rate-through-124473",abstractLicense:"",keywords:[],sections:["3.3"],originalCitation:"Zhang C-L. Generalized correlation of refrigerant mass flow rate through adiabatic capillary tubes using artificial neural network. International Journal of Refrigeration. 2005;28(4):506\u201314.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.ijrefrig.2004.11.004",note:"",isRetracted:!1},{id:"ref-134",number:134,numbers:[134],type:"journal-article",title:"Artificial neural network-based predictive model for supersonic ejector in refrigeration system",authors:"Hanzeng Zhu; Jiapeng Liu; Jinpeng Yu; Peng Yang",journal:"Case Studies in Thermal Engineering",year:2023,volume:"49",issue:"",pages:"103313",doi:"10.1016/j.csite.2023.103313",doiUrl:"https://doi.org/10.1016/j.csite.2023.103313",citations:15,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"In this paper, a novel predictive model is proposed for the supersonic ejector in the refrigeration system based on the artificial neural network technique. A composite performance prediction framework for the supersonic ejector is developed by employing a back propagation neural network with particle swarm optimization (PSO-BPNN) algorithm and a dynamic error com-pensation method. Firstly, we study the model construction problem for the supersonic ejector based on the traditional BPNN modeling method and the PSO algorithm. And then, a dynamic compensation technique is given to improve the predictive accuracy of the ejector model based on the adaptive neural network method. Finally, both the simulation and experimental results are given to verify our method. The experimental validation results show that most prediction errors of our model are less than 4%. Therefore, compared with the existing traditional models, our model has a higher accuracy.",abstractKind:"abstract",abstractSource:"User-provided literature library",abstractUrl:"",abstractLicense:"",keywords:["Ejector","Artificial neural network","Dynamic compensation","Model","Refrigeration system"],sections:["3.3"],originalCitation:"Zhu H, Liu J, Yu J, Yang P. Artificial neural network-based predictive model for supersonic ejector in refrigeration system. Case Studies in Thermal Engineering. 2023;49:103313.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.csite.2023.103313",note:"",isRetracted:!1},{id:"ref-135",number:135,numbers:[135],type:"journal-article",title:"Dynamic linear modeling of a refrigeration process with electronic expansion valve actuator",authors:"T.S.S. Siqueira Dantas; I.C. Franco; A.M.F. Fileti; F.V. Silva",journal:"International Journal of Refrigeration",year:2017,volume:"75",issue:"",pages:"311-321",doi:"10.1016/j.ijrefrig.2017.01.014",doiUrl:"https://doi.org/10.1016/j.ijrefrig.2017.01.014",citations:10,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"Time-invariant and time-varying stochastic ARMAX models are identified for an R404A refrigeration system actuated by an electronic expansion valve. Kalman-filter and forgetting-factor estimators update changing parameters for evaporating temperature, condensing temperature, and superheat. Simulation validation shows low prediction errors, supporting future adaptive stochastic model-predictive control for lower energy use.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S0140700717300269",abstractLicense:"",keywords:[],sections:["3.3.1"],originalCitation:"Siqueira Dantas TSS, Franco IC, Fileti AMF, Silva FV. Dynamic linear modeling of a refrigeration process with electronic expansion valve actuator. International Journal of Refrigeration. 2017;75:311\u201321.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.ijrefrig.2017.01.014",note:"",isRetracted:!1},{id:"ref-136",number:136,numbers:[136],type:"journal-article",title:"Thermal analysis and development of PID control for electronic expansion device of vapor compression refrigeration systems",authors:"S.S. Franco; J.R. Henr\xEDquez; A.A.V. Ochoa; J.A.P. da Costa; K.A. Ferraz",journal:"Applied Thermal Engineering",year:2022,volume:"206",issue:"",pages:"118130",doi:"10.1016/j.applthermaleng.2022.118130",doiUrl:"https://doi.org/10.1016/j.applthermaleng.2022.118130",citations:28,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"A 1 kW R404A vapor-compression prototype is used to tune electronic-expansion-valve PI and PID controllers with a black-box discrete model and Ziegler\u2013Nichols methods. Superheat and valve opening guide optimization. The resulting settings improve energy-efficiency ratio over the factory controller, demonstrating the importance of control calibration for electronic expansion devices.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S1359431122000941",abstractLicense:"",keywords:[],sections:["3.3.1"],originalCitation:"Franco SS, Henriquez JR, Ochoa AAV, da Costa, J. A. P., Ferraz KA. Thermal analysis and development of PID control for electronic expansion device of vapor compression refrigeration systems. Applied Thermal Engineering. 2022;206:118130.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.applthermaleng.2022.118130",note:"",isRetracted:!1},{id:"ref-137",number:137,numbers:[137],type:"journal-article",title:"Adaptive-model predictive control of electronic expansion valves with adjustable setpoint for evaporator superheat minimization",authors:"Mehari Tesfay; Fadi Alsaleem; Parthiban Arunasalam; Arvind Rao",journal:"Building and Environment",year:2018,volume:"133",issue:"",pages:"151-160",doi:"10.1016/j.buildenv.2018.02.015",doiUrl:"https://doi.org/10.1016/j.buildenv.2018.02.015",citations:31,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"An adaptive model-predictive controller regulates electronic-expansion-valve superheat in strongly nonlinear, time-varying HVAC systems. Recursive estimation continually updates process gain and time constant, while a setpoint-hunting algorithm balances low superheat, stability, and energy efficiency. Experiments on two systems demonstrate rapid response and robust recovery under load changes and disturbances.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S0360132318300817",abstractLicense:"",keywords:[],sections:["3.3.1"],originalCitation:"Tesfay M, Alsaleem F, Arunasalam P, Rao A. Adaptive-model predictive control of electronic expansion valves with adjustable setpoint for evaporator superheat minimization. Building and Environment. 2018;133:151\u201360.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.buildenv.2018.02.015",note:"",isRetracted:!1},{id:"ref-138",number:138,numbers:[138],type:"journal-article",title:"Decentralized model predictive control of a multi-evaporator air conditioning system",authors:"Matthew S. Elliott; Bryan P. Rasmussen",journal:"Control Engineering Practice",year:2013,volume:"21",issue:"12",pages:"1665-1677",doi:"10.1016/j.conengprac.2013.08.010",doiUrl:"https://doi.org/10.1016/j.conengprac.2013.08.010",citations:71,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"A hierarchical, decentralized model-predictive-control architecture coordinates temperatures in a multi-evaporator vapor-compression system. A supervisory MPC assigns cooling, pressure, and superheat targets while modular local controllers track them and enforce operating constraints. The design avoids conflicts among independently controlled zones and permits evaporators or compressors to be added without redesigning existing controllers.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S0967066113001561",abstractLicense:"",keywords:[],sections:["3.3.1"],originalCitation:"Elliott MS, Rasmussen BP. Decentralized model predictive control of a multi-evaporator air conditioning system. Control Engineering Practice. 2013;21(12):1665\u201377.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.conengprac.2013.08.010",note:"",isRetracted:!1},{id:"ref-139",number:139,numbers:[139],type:"journal-article",title:"An electronic expansion valve modeling framework development using artificial neural network: A case study on VRF systems",authors:"Hanlong Wan; Tao Cao; Yunho Hwang; Saikee Oh",journal:"International Journal of Refrigeration",year:2019,volume:"107",issue:"",pages:"114-127",doi:"10.1016/j.ijrefrig.2019.08.018",doiUrl:"https://doi.org/10.1016/j.ijrefrig.2019.08.018",citations:22,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"Electronic expansion valves (EEV) are widely used in variable refrigerant flow systems (VRF) to control the mass flow rate of each indoor unit. EEV model is used to predict the mass flow rate through an EEV. While the power-law correlation method has been used to build the EEV model so far, Artificial Neural Network (ANN) methods have been adapted to model the EEV with a fixed speed compressor thanks to its higher accuracy. However, the EEV is typically working with the variable speed compressor in a VRF system. In addition, the parameters used in ANN modeling could be further optimized. The objective of this study is to develop an EEV modeling framework and optimize the input parameter number and hidden neuron number. We presented the framework through an EEV model development for a VRF system. For these, we used the field test data, applied a principal components analysis approach in optimizing the ANN input parameter number, and investigated the proper number of hidden neurons and appropriate transfer function pairs. We found the performance of the ANN model would not improve much as the number of input parameters and the number of hidden neurons reached a threshold. Only three transfer function pairs are suitable for this case in total nine groups we studied. Our ANN model has the average absolute deviation of 2.2%. The framework can be easily applied to EEV modeling in other VRF and air condition systems with necessary data support. (C) 2019 Elsevier Ltd and IIR. All rights reserved.",abstractKind:"abstract",abstractSource:"User-provided literature library",abstractUrl:"",abstractLicense:"",keywords:["Electronic expansion valve","Artificial neuron network","Principal component analysis","Variable refrigerant flow"],sections:["3.3.1"],originalCitation:"Wan H, Cao T, Hwang Y, Oh S. An electronic expansion valve modeling framework development using artificial neural network: A case study on VRF systems. International Journal of Refrigeration. 2019;107:114\u201327.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.ijrefrig.2019.08.018",note:"",isRetracted:!1},{id:"ref-140",number:140,numbers:[140],type:"journal-article",title:"Comparison of different controllers for variable speed compressor and electronic expansion valve",authors:"Orhan Ekren; Savas Sahin; Yalcin Isler",journal:"International Journal of Refrigeration",year:2010,volume:"33",issue:"6",pages:"1161-1168",doi:"10.1016/j.ijrefrig.2010.05.005",doiUrl:"https://doi.org/10.1016/j.ijrefrig.2010.05.005",citations:98,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"PID, fuzzy-logic, and neural-network controllers are compared for a chiller's variable-speed scroll compressor and electronic expansion valve, both separately and in coordinated pairs. PID gives stable steady-state superheat and water temperature in individual control, while paired neural controllers deliver the lowest power under disturbance, reducing consumption relative to PID and fuzzy alternatives.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S0140700710000915",abstractLicense:"",keywords:[],sections:["3.3.1"],originalCitation:"Ekren O, Sahin S, Isler Y. Comparison of different controllers for variable speed compressor and electronic expansion valve. International Journal of Refrigeration. 2010;33(6):1161\u20138.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.ijrefrig.2010.05.005",note:"",isRetracted:!1},{id:"ref-141",number:141,numbers:[141],type:"journal-article",title:"Physics-informed reinforcement learning for energy-efficient minute-scale control of split-type air-conditioning systems: Experimental validation on real hardware",authors:"Haosen Qin; Zhengwei Li; Xiang Gao; Minxuan Qi; Yiyang Zhang",journal:"Applied Energy",year:2026,volume:"423",issue:"",pages:"128402",doi:"10.1016/j.apenergy.2026.128402",doiUrl:"https://doi.org/10.1016/j.apenergy.2026.128402",citations:0,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"Physics-informed deep reinforcement learning is deployed online on a commercial split air conditioner over 58 hardware runs. Hierarchical compressor\u2013valve structure, manufacturer-based safety constraints, delayed-response states, and phase-dependent rewards stabilize a compact D3QN controller. In matched-comfort tests, it cools faster than the factory PID and reduces total energy use by 19%, with robustness across laboratories and loads.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.sciencedirect.com/science/article/pii/S0306261926010561",abstractLicense:"",keywords:[],sections:["3.3.1"],originalCitation:"Qin H, Li Z, Gao X, Qi M, Zhang Y. Physics-informed reinforcement learning for energy-efficient minute-scale control of split-type air-conditioning systems: Experimental validation on real hardware. Applied Energy. 2026;423:128402.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.apenergy.2026.128402",note:"",isRetracted:!1},{id:"ref-142",number:142,numbers:[142],type:"journal-article",title:"Large language model-based interpretable machine learning control in building energy systems",authors:"Liang Zhang; Zhelun Chen",journal:"Energy and Buildings",year:2024,volume:"313",issue:"",pages:"114278",doi:"10.1016/j.enbuild.2024.114278",doiUrl:"https://doi.org/10.1016/j.enbuild.2024.114278",citations:80,citationSource:"OpenAlex \xB7 checked 31 Aug 2026",abstract:"This study combines Shapley-value explanations with a large language model to make HVAC control decisions easier to interpret. The language model connects data-driven feature contributions with rule-based control logic and presents an explanation in natural language. A simulated demand-response precooling case demonstrates the feasibility of the approach for explaining model-predictive-control actions.",abstractKind:"summary",abstractSource:"English summary of the published abstract",abstractUrl:"https://www.semanticscholar.org/paper/0f7c738bbd07c875972cf864ac6bb504bf753146",abstractLicense:"",keywords:[],sections:["3.3.1"],originalCitation:"Zhang L, Chen Z. Large language model-based interpretable machine learning control in building energy systems. Energy and Buildings. 2024;313:114278.",metadataUrl:"https://api.crossref.org/works/10.1016%2Fj.enbuild.2024.114278",note:"",isRetracted:!1},{id:"ref-143",number:143,numbers:[143],type:"journal-article",title:"Non-adiabatic capillary tube flow: a homogeneous model and process description",authors:"B Xu; P.K Bansal",journal:"Applied Thermal Engineering",
